      const COURSE_DRAFT_IDS = [
        "roundDateInput", "roundCourseSelect", "roundCustomCourseName",
        "roundTeeSelect", "roundHolesSelect", "roundScoreInput", "roundParInput",
        "roundFirInput", "roundGirInput", "roundPuttsInput", "roundBirdiesInput",
        "roundModeSelect", "roundNotesInput", "bulkImportText",
        "newCourseName", "newCourseLocation", "newCoursePar", "newCourseHoles",
        "newCourseCat", "newCourseFocus", "newCourseNote"
      ];

      function redrawCourses(preserveDraft = true) {
        const draft = {};
        if (preserveDraft) {
          for (const id of COURSE_DRAFT_IDS) {
            const node = document.getElementById(id);
            if (node) draft[id] = node.value;
          }
        }
        renderCourses();
        if (preserveDraft) {
          for (const id of COURSE_DRAFT_IDS) {
            const node = document.getElementById(id);
            if (node && draft[id] !== undefined) node.value = draft[id];
          }
          const customWrap = document.getElementById("roundCustomCourseWrap");
          const sel = document.getElementById("roundCourseSelect");
          if (customWrap && sel) customWrap.classList.toggle("hidden", sel.value !== "__custom__");
        }
      }

      function renderCourses() {
        const el = document.getElementById("view-courses");
        const courses = state.courses || [];
        const rounds = state.roundLogs || [];
        const cats = DEFAULTS.courseCategories || [];
        const crds = DEFAULTS.customPracticeRounds || [];

        const favCount = courses.filter((c) => c.favorite).length;
        const par3TeeCount = courses.filter((c) => c.tees && Number(c.tees.par3) > 0).length;
        const drillOrShortCount = courses.filter((c) =>
          c.par <= 60 ||
          (c.tees && Number(c.tees.par3) > 0) ||

        function importRoundObjects(items) {
          let added = 0;
          let skipped = 0;
          for (const item of items) {
            const iso = parseHistoricalDate(item.date);
            const score = Number(item.score);
            if (!iso || !Number.isFinite(score) || score <= 0) {
              skipped++;
              continue;
            }
            const matched = findCourseByNameOrId(item.courseName || item.courseId || item.course);
            const holes = Number(item.holes) || (matched && matched.holes) || 18;
            const tee = String(item.tee || (matched && matched.par <= 60 ? "par3" : "white")).trim();
            const par = Number(item.par) || getDefaultParForSelection(matched, tee.toLowerCase() === "par 3" ? "par3" : tee.toLowerCase(), holes);
            const cName = matched ? matched.name : String(item.courseName || item.course || "Custom Course").trim();
            const cId = matched ? matched.id : cName.toLowerCase().replace(/[^a-z0-9]+/g, "_");
            state.roundLogs.push({
              id: `rnd_${Date.now()}_${Math.random().toString(36).slice(2, 7)}_${added}`,
              date: iso,
              courseId: cId,
              courseName: cName,
              tee: tee.toLowerCase() === "par 3" ? "par3" : tee.toLowerCase(),
              holes,
              score,
              par,
              fir: item.fir || "",
              gir: item.gir || "",
              putts: item.putts || "",
              birdies: item.birdies || "",
              mode: item.mode || "real",
              notes: item.notes || ""
            });
            added++;
          }
          saveState();
          showToast(`Imported ${added} historical round${added === 1 ? "" : "s"}${skipped ? ` (${skipped} skipped)` : ""}!`);
          renderCourses();
        }

        function parseAndImportText(rawText) {
          const trimmed = String(rawText || "").trim();
          if (!trimmed) {
            showToast("Paste CSV lines or choose a file first.");
            return;
          }
          if (trimmed.startsWith("[") || trimmed.startsWith("{")) {
            try {
              const parsed = JSON.parse(trimmed);
              const arr = Array.isArray(parsed) ? parsed : (Array.isArray(parsed.roundLogs) ? parsed.roundLogs : []);
              if (arr.length) {
                importRoundObjects(arr);
                return;
              }
            } catch {
              // Fall through to CSV parser
            }
          }
          const lines = trimmed.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
          const objs = [];
          let hasFull12ColHeader = false;
          lines.forEach((line, idx) => {
            const cols = parseCsvLine(line);
            if (!cols.length) return;
            if (idx === 0 && /^date$/i.test(cols[0])) {
              hasFull12ColHeader = cols.length >= 11 && /^fir$/i.test(cols[6] || "");
              return; // Skip CSV header row
            }
            const looksLike12Col = hasFull12ColHeader || (
              cols.length >= 12 &&
              ["real", "almost", "sore", ""].includes(String(cols[10] || "").trim().toLowerCase())
            );
            if (looksLike12Col) {
              objs.push({
                date: cols[0],
                courseName: cols[1] || "",
                score: cols[2],
                par: cols[3],
                tee: cols[4] || "",
                holes: cols[5] || "",
                fir: cols[6] || "",
                gir: cols[7] || "",
                putts: cols[8] || "",
                birdies: cols[9] || "",
                mode: cols[10] || "real",
                notes: cols.slice(11).join(", ")
              });
            } else {
              objs.push({
                date: cols[0],
                courseName: cols[1] || "",
                score: cols[2],
                par: cols[3],
                tee: cols[4] || "",
                holes: cols[5] || "",
                notes: cols.slice(6).join(", ")
              });
            }
          });
          importRoundObjects(objs);
        }

        const btnRunBulkImport = document.getElementById("btnRunBulkImport");
        if (btnRunBulkImport) {
          btnRunBulkImport.onclick = () => parseAndImportText(document.getElementById("bulkImportText").value);
        }

        const bulkImportFile = document.getElementById("bulkImportFile");
        const btnUploadBulk = document.getElementById("btnUploadBulk");
        if (btnUploadBulk && bulkImportFile) btnUploadBulk.onclick = () => bulkImportFile.click();
        if (bulkImportFile) {
          bulkImportFile.onchange = (ev) => {
            const file = ev.target.files && ev.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => parseAndImportText(reader.result);
            reader.readAsText(file);
          };
        }

        document.getElementById("btnExportRoundsCsv").onclick = () => {
          const rows = [["Date", "Course", "Score", "Par", "Tee", "Holes", "FIR", "GIR", "Putts", "Birdies", "Mode", "Notes"]];
          const csvCell = (v) => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
          for (const r of state.roundLogs) {
            rows.push([
              r.date, r.courseName, r.score, r.par, r.tee, r.holes,
              r.fir || "", r.gir || "", r.putts || "", r.birdies || "", r.mode || "real", r.notes || ""
            ].map(csvCell));
          }
          const blob = new Blob([rows.map((r) => r.join(",")).join("\n")], { type: "text/csv" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = `simwatch_rounds_${todayISO(0)}.csv`;
          a.click();
          showToast("Exported historical rounds CSV!");
        };

        const roundFilterSel = document.getElementById("roundFilterCourseSelect");
        if (roundFilterSel) {
          roundFilterSel.onchange = () => {
            state.roundFilterCourse = roundFilterSel.value;
            redrawCourses(true);
          };
        }

        el.querySelectorAll("[data-del-round]").forEach((btn) => {
          btn.onclick = () => {

              saveState();
              if (state.activeView === "courses") redrawCourses(true);
              showToast("Restored round entry.");
            });
          };
        });
      }

          document.getElementById("btnDeleteDrill").onclick = () => {

            state.drills = state.drills.filter((x) => x.id !== existing.id);

          a.download = `simwatch_drills_backup_${todayISO(0)}.json`;

        hla: { label: "Start line", short: "HLA", unit: "°", step: 1, foamOk: true, get: (s) => s.ball && s.ball.hla },

        path: { label: "Club path", short: "Path", unit: "°", step: 1, foamOk: true, get: (s) => s.club_data && s.club_data.path },

        manual: { label: "Tap to score", short: "", unit: "", step: 0, foamOk: true, get: () => null }
      };
      const SESSION_MODES = ["real", "almost", "sore"];
      const SESSION_MINUTES = [20, 30, 45];
      const BRIDGE_URL = "http://127.0.0.1:8765";
      const AUTO_ADVANCE_MS = 2500;
      const DONE_MIN_SECS = 45; // a block with no reps counts as done after this long on it

      function sNum(v) {
        if (typeof v === "number") return isFinite(v) ? v : null;
        if (typeof v === "string" && v.trim() !== "" && isFinite(Number(v))) return Number(v);
        return null;
      }
      function drillById(id) { return state.drills.find((d) => d.id === id) || null; }
      function modeDef(id) { return (DEFAULTS.modes || []).find((m) => m.id === id) || { id, label: id, shortLabel: id, icon: "" }; }
      function fmtClock(sec) {
        sec = Math.max(0, Math.floor(sec));
        const m = Math.floor(sec / 60), s = sec % 60;
        return `${m}:${String(s).padStart(2, "0")}`;
      }
      function weekdayShort(iso) {
        const d = new Date(`${iso}T12:00:00`);
        return isNaN(d) ? iso : d.toLocaleDateString(undefined, { weekday: "short" });
      }
      function shortTitle(d, max = 30) {
        const t = d ? String(d.title || d.id) : "Drill";
        return t.length > max ? t.slice(0, max - 1).trimEnd() + "…" : t;
      }

      // "5 min", "8–10 min", "1 hr", "90 sec", 12 -> minutes (default 5).
      function parseDurationMin(str) {
        if (typeof str === "number" && isFinite(str) && str > 0) return Math.min(180, Math.round(str));
        const s = String(str || "").toLowerCase().replace(/[–—]/g, "-");
        const m = s.match(/(\d+(?:\.\d+)?)(?:\s*(?:-|to)\s*(\d+(?:\.\d+)?))?\s*(hours?|hrs?|h\b|minutes?|mins?|m\b|'|seconds?|secs?|s\b)?/);
        if (!m) return 5;
        let v = m[2] ? (parseFloat(m[1]) + parseFloat(m[2])) / 2 : parseFloat(m[1]);
        const unit = m[3] || "min";
        if (/^h/.test(unit)) v *= 60;
        else if (/^s/.test(unit)) v /= 60;
        v = Math.round(v);
        return v >= 1 && v <= 180 ? v : 5;
      }

      // Rep goal from a drill's free-text reps string; null when it is ambiguous (=> no auto-advance).
      function parseRepGoal(str) {
        let s = String(str || "").toLowerCase().replace(/\([^)]*\)/g, " ");
        s = s.split(/pass\s*[:=]|[;/,]|\.\s|\bthen\b/)[0];
        const clamp = (n) => (n >= 1 && n <= 200 ? n : null);
        let m = s.match(/(\d+)\s*(?:sets?|targets?|rounds?|stations?)\s*(?:of|x|×)\s*(\d+)/);
        if (m) return clamp(Number(m[1]) * Number(m[2]));
        m = s.match(/(\d+)\s*(?:balls?|shots?)\s*per\s*\S+\s*[x×]\s*(\d+)/);
        if (m) return clamp(Number(m[1]) * Number(m[2]));
        const ballRe = /(\d+)\s+(?:(?!\d)[^\s+]+\s+){0,3}?(?:balls?|shots?|putts?|chips?|drives?)\b/g;
        let sum = 0, hit;
        while ((hit = ballRe.exec(s))) sum += Number(hit[1]);
        if (sum) return clamp(sum);
        m = s.match(/(\d+)\s+(?:[^\s+]+\s+){0,2}?(?:reps?|rehearsals?|holds?|pauses?|gates?|swings?)\b/);
        if (m && !s.includes("+")) return clamp(Number(m[1]));
        return null;
      }

      function getSessionTarget(drill, mode) {
        if (!drill) return null;
        const raw = drill.target;
        if (!isPlainObj(raw) || !SESSION_METRICS[raw.metric]) return null;
        const t = {
          metric: raw.metric,
          goal: sNum(raw.goal),
          tol: sNum(raw.tol),
          reps: sNum(raw.reps) && raw.reps > 0 ? Math.round(raw.reps) : null,
          pass: sNum(raw.pass) && raw.pass > 0 ? Math.round(raw.pass) : null
        };
        if (typeof raw.club === "string" && raw.club) t.club = raw.club;
        if (t.metric !== "manual" && (t.goal === null || t.tol === null || t.tol < 0)) t.metric = "manual";
        // Almost Golf (foam) balls: carry / ball speed / spin are not valid -> tap-to-score only.
        if (mode === "almost" && !SESSION_METRICS[t.metric].foamOk) { t.metric = "manual"; t.foam = true; }
        return t;
      }
      function repGoalFor(drill, target) {
        if (target && target.reps) return target.reps;
        return drill ? parseRepGoal(drill.reps) : null;
      }
      function targetText(t) {
        if (!t) return "";
        if (t.metric === "manual") return t.foam ? "Foam balls: tap ✓ / ✗ to score" : "Tap ✓ / ✗ to score";
        const mt = SESSION_METRICS[t.metric];
        const g = t.goal > 0 && mt.unit === "°" ? `+${t.goal}` : String(t.goal);
        return `${mt.label} ${g}${mt.unit} ±${t.tol}${mt.unit}${t.club ? ` · ${t.club}` : ""}`;
      }

      // Score one bridge shot against a target. ok: true/false, or null when not scorable.
      function scoreShot(shot, target, mode) {
        const hla = sNum(shot && shot.ball && shot.ball.hla);
        if (!target || target.metric === "manual") return { value: hla, ok: null, reason: target && target.foam ? "foam" : "manual" };
        const mt = SESSION_METRICS[target.metric];
        if (mode === "almost" && !mt.foamOk) return { value: null, ok: null, reason: "foam" };
        const v = sNum(mt.get(shot || {}));
        if (v === null) return { value: null, ok: null, reason: "nodata" };
        return { value: v, ok: Math.abs(v - target.goal) <= target.tol, reason: "" };
      }

      // ---- drill classification for the planner ----
      function drillText(d) { return [d.id, d.title, d.section, d.category, d.type].filter(Boolean).join(" ").toLowerCase(); }
      function isTestDrill(d) {
        const own = [d.id, d.title, d.category, d.type].filter(Boolean).join(" ").toLowerCase();
        const grp = [d.section, d.category].filter(Boolean).join(" ").toLowerCase();
        return /\b(test|game|challenge|combine|ladder|scored)\b/.test(own) || /\b(pressure|transfer|test|games?)\b/.test(grp);
      }
      // Pure warm-up / mobility flows (by id/title, not section) never fill a focus slot.
      function isPureWarm(d) { return /warm-?up|mobility|unlock|stretch/.test([d.id, d.title].join(" ").toLowerCase()); }
      function warmRank(d, mode) {
        const t = drillText(d);
        if (mode === "sore" && /mobility|unlock|stretch/.test(t)) return -1;
        if (/warm-?up|warmup/.test(t)) return 0;
        if (/mobility|calibration|warm|unlock|stretch/.test(t)) return 1;
        return 9;
      }

      // ---- history helpers ----
      function sortedSessions() {
        return (state.sessions || []).slice().sort((a, b) => String(a.startedAt || a.date).localeCompare(String(b.startedAt || b.date)));
      }
      function blockScore(b) {
        let hits = 0, n = 0;
        for (const r of b.reps || []) if (r.ok === true || r.ok === false) { n++; if (r.ok) hits++; }
        return { hits, n };
      }
      function sessionDrillScore(s, drillId) {
        let hits = 0, n = 0, reps = 0;
        for (const b of s.blocks || []) if (b.drillId === drillId) { const x = blockScore(b); hits += x.hits; n += x.n; reps += (b.reps || []).length; }
        return { hits, n, reps, rate: n ? hits / n : null };
      }
      // Chronological hit-rate history for a drill (scored sessions only), optionally stopping at a session id.
      function drillRateHistory(drillId, limit = 5, uptoId = null) {
        const out = [];
        for (const s of sortedSessions()) {
          const sc = sessionDrillScore(s, drillId);
          if (sc.n) out.push({ id: s.id, date: s.date, rate: sc.rate, hits: sc.hits, n: sc.n });
          if (uptoId && s.id === uptoId) break;
        }
        return out.slice(-limit);
      }
      function recentRate(drillId) {
        const h = drillRateHistory(drillId, 5);
        if (!h.length) return null;
        let hits = 0, n = 0;
        h.forEach((x) => { hits += x.hits; n += x.n; });
        return hits / n;
      }
      function sparklineSvg(rates, w = 64, h = 20) {
        if (!rates || !rates.length) return "";
        const pts = rates.map((r, i) => {
          const x = rates.length === 1 ? w / 2 : 3 + (i * (w - 6)) / (rates.length - 1);
          const y = h - 3 - Math.max(0, Math.min(1, r)) * (h - 6);
          return [Math.round(x * 10) / 10, Math.round(y * 10) / 10];
        });
        const last = pts[pts.length - 1];
        const label = `Hit rate trend: ${rates.map((r) => Math.round(r * 100) + "%").join(", ")}`;
        return `<svg class="tn-spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}">` +
          `<title>${esc(label)}</title>` +
          `<line x1="0" y1="${h / 2}" x2="${w}" y2="${h / 2}" stroke="#334155" stroke-width="1" stroke-dasharray="2 3"/>` +
          (pts.length > 1 ? `<polyline fill="none" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts.map((p) => p.join(",")).join(" ")}"/>` : "") +
          `<circle cx="${last[0]}" cy="${last[1]}" r="3" fill="#fde68a"/></svg>`;
      }

      // ---- routine sequencing ----
      function dayRoutineSeq() {
        return (DEFAULTS.routines || []).filter((r) => /^day-\d+/.test(r.id))
          .sort((a, b) => parseInt(a.id.slice(4), 10) - parseInt(b.id.slice(4), 10)).map((r) => r.id);
      }
      // Next "Day N" routine: the one after the last session's routine (same one if that was today).
      function nextRoutineDay() {
        const seq = dayRoutineSeq();
        if (!seq.length) return null;
        let last = null, lastDate = null;
        const hist = sortedSessions().reverse();
        for (const s of hist) if (s.routineId && seq.includes(s.routineId)) { last = s.routineId; lastDate = s.date; break; }
        if (!last) {
          // Fallback: infer from the most recent day log's completed drills.
          const dates = Object.keys(state.deliveryLogs || {}).filter((k) => ((state.deliveryLogs[k] || {}).completedDrills || []).length).sort().reverse();
          for (const iso of dates) {
            const counts = {};
            for (const id of state.deliveryLogs[iso].completedDrills) {
              const d = drillById(id);
              for (const day of (d && d.days) || []) if (seq.includes(day)) counts[day] = (counts[day] || 0) + 1;
            }
            const best = seq.filter((id) => counts[id]).sort((a, b) => counts[b] - counts[a] || seq.indexOf(a) - seq.indexOf(b))[0];
            if (best) { last = best; lastDate = iso; break; }
          }
        }
        if (!last) return seq[0];
        if (lastDate === todayISO(0)) return last;
        return seq[(seq.indexOf(last) + 1) % seq.length];
      }

      // Deterministic planner: same inputs (drills, history, date) => same plan.
      function buildTonightSession(opts) {
        const minutes = SESSION_MINUTES.includes(Number(opts && opts.minutes)) ? Number(opts.minutes) : 30;
        const mode = SESSION_MODES.includes(opts && opts.mode) ? opts.mode : "real";
        const nextDay = nextRoutineDay();
        const modeRoutine = mode === "almost" ? "kids-asleep" : mode === "sore" ? "gym-sore" : null;
        const pool = state.drills
          .map((d, i) => ({ d, i, min: parseDurationMin(d.duration) }))
          .filter((x) => (x.d.modes || []).includes(mode));
        const rateCache = {};
        const rate = (x) => {
          if (!(x.d.id in rateCache)) { const r = recentRate(x.d.id); rateCache[x.d.id] = r === null ? 0.6 : r; }
          return rateCache[x.d.id];
        };
        const tier = (x) => ((x.d.days || []).includes(nextDay) ? 0 : modeRoutine && (x.d.days || []).includes(modeRoutine) ? 1 : 2);
        // On ball-striking nights, mobility/setup drills belong in the warm-up slot, not a focus slot.
        const mob = (x) => (mode !== "sore" && /mobility/i.test(String(x.d.section || "")) ? 1 : 0);
        const byPref = (a, b) => mob(a) - mob(b) || tier(a) - tier(b) || rate(a) - rate(b) || a.i - b.i;
        const slack = 2;
        const items = [];
        let used = 0;
        const take = (x, role, alts) => { items.push({ drillId: x.d.id, role, minutes: x.min, alts: alts.map((a) => a.d.id) }); used += x.min; };
        const fits = (x, extra = 0) => used + x.min + extra <= minutes + slack;

        const warmPool = pool.filter((x) => warmRank(x.d, mode) < 9 && !isTestDrill(x.d))
          .sort((a, b) => warmRank(a.d, mode) - warmRank(b.d, mode) ||
            Number((b.d.days || []).includes("daily-calibration")) - Number((a.d.days || []).includes("daily-calibration")) ||
            a.min - b.min || a.i - b.i);
        const warm = warmPool.find((x) => x.min <= Math.max(5, minutes * 0.3)) || null;
        if (warm) take(warm, "warmup", warmPool.filter((x) => x !== warm && x.min <= Math.max(5, minutes * 0.3)).slice(0, 6));

        const taken = () => new Set(items.map((it) => it.drillId));
        const testPool = pool.filter((x) => isTestDrill(x.d) && !taken().has(x.d.id)).sort(byPref);
        const focusPool = pool.filter((x) => !isTestDrill(x.d) && !isPureWarm(x.d) && !taken().has(x.d.id)).sort(byPref);
        const shortestFocus = focusPool.reduce((m, x) => Math.min(m, x.min), Infinity);
        let test = testPool.find((t) => fits(t, shortestFocus)) || null;
        let f1 = focusPool.find((f) => fits(f, test ? test.min : 0)) || null;
        if (!f1) { test = null; f1 = focusPool.find((f) => fits(f)) || focusPool[0] || null; }
        const focusTaken = [];
        if (f1) { take(f1, "focus", []); focusTaken.push(f1); }
        // Keep adding focus blocks (max 4) while they fit alongside the test, so 45-min plans fill the budget.
        while (focusTaken.length < 4) {
          const next = focusPool.find((f) => !focusTaken.includes(f) && fits(f, test ? test.min : 0));
          if (!next) break;
          take(next, "focus", []); focusTaken.push(next);
        }
        const focusAlts = focusPool.filter((f) => !focusTaken.includes(f)).slice(0, 10);
        items.forEach((it) => { if (it.role === "focus") it.alts = focusAlts.map((a) => a.d.id); });
        const finalTest = testPool.find((t) => fits(t)) || null;
        if (finalTest) take(finalTest, "test", testPool.filter((t) => t !== finalTest).slice(0, 6));

        return {
          mode, minutes, routineId: nextDay,
          items,
          totalMin: items.reduce((s, it) => s + it.minutes, 0)
        };
      }

      // ---- Tonight card UI state (plan edits survive re-renders until mode/minutes/history change) ----
      const tonightUi = { key: null, plan: null, edited: false };
      function tonightPrefs() {
        const p = state.sessionPrefs || {};
        const mode = SESSION_MODES.includes(p.mode) ? p.mode : (SESSION_MODES.includes(state.activeMode) ? state.activeMode : "real");
        const minutes = SESSION_MINUTES.includes(p.minutes) ? p.minutes : 30;
        return { mode, minutes };
      }
      function getTonightPlan() {
        const { mode, minutes } = tonightPrefs();
        const key = `${mode}|${minutes}|${(state.sessions || []).length}|${todayISO(0)}|${state.drills.length}`;
        if (!tonightUi.plan || tonightUi.key !== key || !tonightUi.edited) {
          if (tonightUi.key !== key) tonightUi.edited = false;
          if (!tonightUi.edited) tonightUi.plan = buildTonightSession({ mode, minutes });
          tonightUi.key = key;
        }
        return tonightUi.plan;
      }
      function recomputePlanTotal(plan) { plan.totalMin = plan.items.reduce((s, it) => s + it.minutes, 0); }
      function swapPlanItem(i) {
        const plan = getTonightPlan();
        const it = plan.items[i];
        if (!it) return;
        if (!it.cycle) it.cycle = [it.drillId].concat(it.alts || []);
        const used = new Set(plan.items.filter((_, j) => j !== i).map((x) => x.drillId));
        let k = it.cycle.indexOf(it.drillId);
        for (let step = 0; step < it.cycle.length; step++) {
          k = (k + 1) % it.cycle.length;
          const cand = it.cycle[k];
          if (!used.has(cand) && drillById(cand)) {
            if (cand === it.drillId) break;
            it.drillId = cand;
            it.minutes = parseDurationMin(drillById(cand).duration);
            tonightUi.edited = true;
            recomputePlanTotal(plan);
            renderTonightCard();
            return;
          }
        }
        showToast("No other drill fits that slot in this mode.");
      }
      function removePlanItem(i) {
        const plan = getTonightPlan();
        if (!plan.items[i]) return;
        plan.items.splice(i, 1);
        tonightUi.edited = true;
        recomputePlanTotal(plan);
        renderTonightCard();
      }

      function lastSessionHeadline() {
        const s = sortedSessions().pop();
        if (!s) return null;
        let best = null;
        for (const b of s.blocks) {
          const sc = blockScore(b);
          if (sc.n && (!best || sc.n > best.n)) best = { b, n: sc.n, rate: sc.hits / sc.n };
        }
        const day = weekdayShort(s.date);
        if (best) {
          const d = drillById(best.b.drillId);
          const m = best.b.target && SESSION_METRICS[best.b.target.metric];
          const pct = Math.round(best.rate * 100);
          const text = m && best.b.target.metric !== "manual"
            ? `Last: ${pct}% ${m.label.toLowerCase()} hits (${shortTitle(d, 22)}), ${day}`
            : `Last: ${pct}% hits on ${shortTitle(d, 28)}, ${day}`;
          return { s, text };
        }
        const done = s.blocks.filter((b) => b.done).length;
        return { s, text: `Last: ${done} drill${done === 1 ? "" : "s"}, ${sessionMinutes(s)} min, ${day}` };
      }
      function sessionMinutes(s) {
        const a = Date.parse(s.startedAt), b = Date.parse(s.endedAt);
        if (isNaN(a) || isNaN(b)) return Math.round(s.blocks.reduce((t, x) => t + (x.secs || 0), 0) / 60);
        return Math.max(0, Math.round((b - a) / 60000));
      }

      function renderTonightCard() {
        const el = document.getElementById("tonightCard");
        if (!el) return;
        el.classList.toggle("hidden", state.activeView !== "deck");
        if (state.activeView !== "deck") return;
        const { mode, minutes } = tonightPrefs();
        const plan = getTonightPlan();
        const md = modeDef(mode);
        const metrics = computeDeliveryMetrics();
        const head = lastSessionHeadline();
        const nextR = (DEFAULTS.routines || []).find((r) => r.id === plan.routineId);
        const act = state.activeSession;
        const actReps = act ? act.blocks.reduce((t, b) => t + b.reps.length, 0) : 0;
        const roleLabel = { warmup: "Warm-up", focus: "Focus", test: "Test" };
        const title = act
          ? `<span class="tn-kicker">Session in progress</span><span class="tn-sep">·</span>${esc(modeDef(act.mode).shortLabel || act.mode)}<span class="tn-sep">·</span>drill ${act.idx + 1}/${act.blocks.length}<span class="tn-sep">·</span>${actReps} reps`
          : `<span class="tn-kicker">Tonight</span><span class="tn-sep">·</span>${esc(md.shortLabel || md.label)}<span class="tn-sep">·</span>${plan.items.length} drill${plan.items.length === 1 ? "" : "s"}<span class="tn-sep">·</span>~${plan.totalMin} min`;
        el.innerHTML = `
          <div class="tn-head">
            <h2 class="tn-title">${title}</h2>
            <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
              ${act ? `<button type="button" class="nav-btn" id="btnTonightEndSaved">End &amp; save</button><button type="button" class="nav-btn" id="btnTonightDiscard">Discard</button>` : ""}
              <button type="button" class="tn-start" id="btnTonightStart" ${!act && !plan.items.length ? "disabled" : ""}>${act ? "▶ Resume session" : "▶ Start session"}</button>
            </div>
          </div>
          <div class="tn-controls">
            <div class="tn-seg" role="group" aria-label="Ball mode for tonight">
              ${SESSION_MODES.map((m) => { const d = modeDef(m); return `<button type="button" data-tn-mode="${esc(m)}" aria-pressed="${m === mode}" title="${esc(d.label)}">${d.icon ? esc(d.icon) + " " : ""}${esc(d.shortLabel || d.label)}</button>`; }).join("")}
            </div>
            <div class="tn-seg" role="group" aria-label="Minutes available">
              ${SESSION_MINUTES.map((n) => `<button type="button" data-tn-min="${n}" aria-pressed="${n === minutes}">${n} min</button>`).join("")}
            </div>
            <span class="sim-pill" data-sim-pill></span>
          </div>
          <div class="tn-meta">
            <span>🔥 ${metrics.streak}-day streak</span>
            ${head ? `<button type="button" class="linklike" id="btnTonightLast" title="Open the summary of your last session">${esc(head.text)}</button>` : `<span>No mat sessions yet - tonight's the first.</span>`}
            ${nextR ? `<span>Next up: <strong>${esc(nextR.title)}</strong></span>` : ""}
          </div>
          ${plan.items.length ? `<ol class="tn-plan" aria-label="Tonight's plan">
            ${plan.items.map((it, i) => {
              const d = drillById(it.drillId);
              const spark = sparklineSvg(drillRateHistory(it.drillId, 5).map((h) => h.rate), 44, 18);
              return `<li>
                <span class="tn-role r-${esc(it.role)}">${esc(roleLabel[it.role] || it.role)}</span>
                <span class="tn-name" title="${esc(d ? d.title : it.drillId)}">${esc(d ? d.title : it.drillId)}</span>
                ${spark}
                <span class="tn-min">${it.minutes}m</span>
                <button type="button" data-tn-swap="${i}" title="Swap for another ${esc(roleLabel[it.role] || "")} drill" aria-label="Swap ${esc(d ? d.title : "")}">⇄</button>
                <button type="button" data-tn-remove="${i}" title="Remove from tonight" aria-label="Remove ${esc(d ? d.title : "")}">✕</button>
              </li>`;
            }).join("")}
          </ol>${tonightUi.edited ? `<div style="margin-top:6px;"><button type="button" class="nav-btn" id="btnTonightReset" style="padding:4px 10px; font-size:0.85rem;">↺ Reset plan</button></div>` : ""}`
          : `<p class="tn-empty">No drills available in ${esc(md.label)} mode${tonightUi.edited ? ` - <button type="button" class="nav-btn" id="btnTonightReset">↺ Reset plan</button>` : "."}</p>`}
        `;
        el.querySelectorAll("[data-tn-mode]").forEach((b) => b.onclick = () => {
          state.sessionPrefs = Object.assign({}, state.sessionPrefs, { mode: b.getAttribute("data-tn-mode") });
          saveState(); renderTonightCard();
        });
        el.querySelectorAll("[data-tn-min]").forEach((b) => b.onclick = () => {
          state.sessionPrefs = Object.assign({}, state.sessionPrefs, { minutes: Number(b.getAttribute("data-tn-min")) });
          saveState(); renderTonightCard();
        });
        el.querySelectorAll("[data-tn-swap]").forEach((b) => b.onclick = () => swapPlanItem(Number(b.getAttribute("data-tn-swap"))));
        el.querySelectorAll("[data-tn-remove]").forEach((b) => b.onclick = () => removePlanItem(Number(b.getAttribute("data-tn-remove"))));
        const reset = document.getElementById("btnTonightReset");
        if (reset) reset.onclick = () => { tonightUi.edited = false; tonightUi.plan = null; renderTonightCard(); };
        document.getElementById("btnTonightStart").onclick = startSession;
        const last = document.getElementById("btnTonightLast");
        if (last && head) last.onclick = () => openSummary(head.s.id);
        const endSaved = document.getElementById("btnTonightEndSaved");
        if (endSaved) endSaved.onclick = () => { openMatShell(); finishSession(); };
        const discard = document.getElementById("btnTonightDiscard");
        if (discard) discard.onclick = () => {
          const keep = state.activeSession;
          state.activeSession = null;
          postActiveDrill(null);
          saveState(); renderTonightCard();
          showUndoToast("Session discarded.", () => { state.activeSession = keep; saveState(); renderTonightCard(); });
        };
        updateSimPills();
      }

      // ---- active session lifecycle ----
      const mat = { open: false, view: "run", confirm: false, advanceTimer: null, tick: null, lastShot: null, flash: null, summaryId: null, logDraft: null, wakeLock: null, returnFocus: null };

      function curBlock() { const s = state.activeSession; return s ? s.blocks[s.idx] || null : null; }
      function flushBlockTime(b) {
        if (b && b.enteredAt) { b.secs = (b.secs || 0) + Math.max(0, (Date.now() - b.enteredAt) / 1000); b.enteredAt = Date.now(); }
      }
      function saveSessionState() { flushBlockTime(curBlock()); saveState(); }
      function cancelAutoAdvance() { if (mat.advanceTimer) { clearTimeout(mat.advanceTimer); mat.advanceTimer = null; } }

      function startSession() {
        if (state.activeSession) { openMat(); return; }
        const plan = getTonightPlan();
        if (!plan.items.length) { showToast("No drills in tonight's plan - pick another mode or reset the plan."); return; }
        const now = new Date();
        state.activeSession = {
          id: `s-${now.getTime().toString(36)}`,
          date: todayISO(0),
          mode: plan.mode,
          minutes: plan.minutes,
          routineId: plan.routineId,
          startedAt: now.toISOString(),
          endedAt: null,
          idx: 0,
          blocks: plan.items.map((it) => {
            const d = drillById(it.drillId);
            const target = getSessionTarget(d, plan.mode);
            return { drillId: it.drillId, target, repGoal: repGoalFor(d, target), planMin: it.minutes, secs: 0, done: false, reps: [] };
          })
        };
        tonightUi.edited = false;
        openMat();
      }

      function enterBlock(i) {
        const s = state.activeSession;
        if (!s || i < 0 || i >= s.blocks.length) return;
        const prev = curBlock();
        if (prev && prev.enteredAt) { flushBlockTime(prev); prev.enteredAt = null; }
        cancelAutoAdvance();
        s.idx = i;
        s.blocks[i].enteredAt = Date.now();
        mat.lastShot = null;
        postActiveDrill(s.blocks[i].drillId);
        saveState();
        renderMat();
      }
      function nextBlock() {
        const s = state.activeSession;
        if (!s) return;
        if (s.idx < s.blocks.length - 1) enterBlock(s.idx + 1);
        else finishSession();
      }
      function prevBlock() { const s = state.activeSession; if (s && s.idx > 0) enterBlock(s.idx - 1); }

      function logRep(ok) {
        const b = curBlock();
        if (!b || mat.view !== "run") return;
        const last = b.reps[b.reps.length - 1];
        // Tapping right after an unscored shot scores that shot instead of adding a separate rep.
        if (last && last.ok === null && last.shotTs && Date.now() - Date.parse(last.ts) < 30000) last.ok = ok;
        else b.reps.push({ ok, value: null, ts: new Date().toISOString() });
        if (mat.lastShot && last && last.shotTs && mat.lastShot.shot.ts === last.shotTs) mat.lastShot.score.ok = last.ok;
        afterRep(ok);
      }
      function afterRep(ok) {
        mat.flash = ok === true ? "hit" : ok === false ? "miss" : null;
        saveSessionState();
        renderMat();
        const b = curBlock();
        if (b && b.repGoal && b.reps.length >= b.repGoal && !mat.advanceTimer) {
          mat.advanceTimer = setTimeout(() => { mat.advanceTimer = null; if (mat.open && mat.view === "run") nextBlock(); }, AUTO_ADVANCE_MS);
          renderMat();
        }
      }
      function undoRep() {
        const b = curBlock();
        if (!b || !b.reps.length) return;
        b.reps.pop();
        if (mat.advanceTimer && (!b.repGoal || b.reps.length < b.repGoal)) cancelAutoAdvance();
        mat.flash = null;
        saveSessionState();
        renderMat();
      }

      function finishSession() {
        const s = state.activeSession;
        if (!s) { closeMat(); return; }
        cancelAutoAdvance();
        const b = curBlock();
        if (b && b.enteredAt) { flushBlockTime(b); b.enteredAt = null; }
        const blocks = s.blocks.map((x) => ({
          drillId: x.drillId, target: x.target, repGoal: x.repGoal, planMin: x.planMin,
          secs: Math.round(x.secs || 0), done: x.reps.length > 0 || (x.secs || 0) >= DONE_MIN_SECS, reps: x.reps
        }));
        state.activeSession = null;
        postActiveDrill(null);
        if (cadenceState.isPlaying) stopCadenceMetronome();
        if (!blocks.some((x) => x.done)) {
          saveState();
          closeMat();
          renderTonightCard();
          showToast("Session ended - nothing logged, so nothing was saved.");
          return;
        }
        const routineOk = s.routineId && blocks.some((x) => x.done && ((drillById(x.drillId) || {}).days || []).includes(s.routineId));
        const done = {
          id: s.id, date: s.date, mode: s.mode, minutes: s.minutes, routineId: routineOk ? s.routineId : null,
          startedAt: s.startedAt, endedAt: new Date().toISOString(), savedToLog: false, blocks
        };
        state.sessions.push(done);
        if (state.sessions.length > 500) state.sessions = state.sessions.slice(-500);
        // Existing completed-drills mechanism (same rules as toggleDrillDoneToday).
        const log = ensureDayLog(done.date);
        for (const x of blocks) if (x.done && !log.completedDrills.includes(x.drillId)) log.completedDrills.push(x.drillId);
        if (!log.status) { log.status = done.mode === "sore" ? "recovery" : "partial"; log.mode = done.mode; }
        saveState();
        renderHeader();
        openSummary(done.id);
      }

      // ---- overlay open/close ----
      function openMatShell() {
        const ov = document.getElementById("matOverlay");
        if (!mat.open) mat.returnFocus = document.activeElement;
        mat.open = true;
        ov.classList.remove("hidden");
        document.body.classList.add("mat-open");
        ov.focus({ preventScroll: true });
        if (!mat.tick) mat.tick = setInterval(updateMatClock, 1000);
        requestWakeLock();
      }
      function openMat() {
        const s = state.activeSession;
        if (!s) return;
        mat.view = "run";
        mat.confirm = false;
        openMatShell();
        enterBlock(Math.min(s.idx || 0, s.blocks.length - 1));
      }
      function openSummary(sessionId) {
        const s = (state.sessions || []).find((x) => x.id === sessionId);
        if (!s) return;
        mat.view = "summary";
        mat.confirm = false;
        mat.summaryId = sessionId;
        mat.logDraft = null;
        openMatShell();
        renderMat();
        const ov = document.getElementById("matOverlay");
        ov.scrollTop = 0;
      }
      function closeMat() {
        cancelAutoAdvance();
        const s = state.activeSession;
        const b = curBlock();
        if (b && b.enteredAt) { flushBlockTime(b); b.enteredAt = null; }
        if (s) { postActiveDrill(null); saveState(); }
        mat.open = false;
        mat.confirm = false;
        if (mat.tick) { clearInterval(mat.tick); mat.tick = null; }
        const ov = document.getElementById("matOverlay");
        ov.classList.add("hidden");
        ov.innerHTML = "";
        document.body.classList.remove("mat-open");
        releaseWakeLock();
        if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
        renderTonightCard();
        renderHeader();
        const back = document.getElementById("btnTonightStart") || mat.returnFocus;
        if (back && back.focus) back.focus({ preventScroll: true });
      }
      async function requestWakeLock() {
        try { if (navigator.wakeLock && !mat.wakeLock) mat.wakeLock = await navigator.wakeLock.request("screen"); } catch (e) { mat.wakeLock = null; }
      }
      function releaseWakeLock() { try { if (mat.wakeLock) mat.wakeLock.release(); } catch (e) { /* ignore */ } mat.wakeLock = null; }
      function toggleFullscreen() {
        const ov = document.getElementById("matOverlay");
        if (document.fullscreenElement) { document.exitFullscreen().catch(() => {}); return; }
        if (ov.requestFullscreen) ov.requestFullscreen().catch(() => showToast("Full screen not available here."));
      }

      // ---- tempo (existing cadence metronome) ----
      function tempoPresetFor(drill, routineId) {
        const presets = DEFAULTS.cadencePresets || [];
        const has = (id) => presets.some((p) => p.id === id);
        const fromText = (t) => { const m = /(\d{2})\s*\/\s*(\d{1,2})/.exec(String(t || "")); return m && has(`${m[1]}-${m[2]}`) ? `${m[1]}-${m[2]}` : null; };
        if (!drill) return null;
        for (const k of ["cadencePresetId", "cadencePreset", "tempoPreset", "cadence"]) {
          const v = drill[k];
          if (typeof v === "string" && v) { if (has(v)) return v; const p = fromText(v); if (p) return p; }
        }
        const days = drill.days || [];
        const order = routineId && days.includes(routineId) ? [routineId].concat(days) : days;
        for (const id of order) {
          const r = (DEFAULTS.routines || []).find((x) => x.id === id);
          const p = r && fromText(r.cadenceTarget);
          if (p) return p;
        }
        return null;
      }
      function toggleSessionTempo() {
        const s = state.activeSession, b = curBlock();
        const id = b && tempoPresetFor(drillById(b.drillId), s.routineId);
        if (!id) { toggleCadenceMetronome(); renderMat(); return; }
        if (cadenceState.isPlaying && state.cadencePresetId === id) stopCadenceMetronome();
        else {
          if (cadenceState.isPlaying) stopCadenceMetronome();
          state.cadencePresetId = id;
          saveState();
          startCadenceMetronome();
        }
        renderMat();
      }

      // ---- rendering: run view ----
      function updateMatClock() {
        if (!mat.open || mat.view !== "run") return;
        const s = state.activeSession, b = curBlock();
        if (!s || !b) return;
        const drillSecs = (b.secs || 0) + (b.enteredAt ? (Date.now() - b.enteredAt) / 1000 : 0);
        const sessSecs = (Date.now() - Date.parse(s.startedAt)) / 1000;
        const dEl = document.getElementById("matDrillClock");
        const sEl = document.getElementById("matSessClock");
        if (dEl) {
          dEl.querySelector("span").textContent = `${fmtClock(drillSecs)}${b.planMin ? ` / ${b.planMin}:00` : ""}`;
          dEl.classList.toggle("over", !!b.planMin && drillSecs > b.planMin * 60);
        }
        if (sEl) sEl.querySelector("span").textContent = fmtClock(sessSecs);
      }
      function fmtVal(v, unit, signed) {
        if (v === null || v === undefined) return "–";
        const r = Math.round(v * 10) / 10;
        return `${signed && r > 0 ? "+" : ""}${r}${unit || ""}`;
      }
      function renderShotPanel(s, b) {
        const ls = mat.lastShot;
        if (!ls) {
          return `<div class="mat-shot"><div class="mat-shot-label">Last shot</div>
            <div class="mat-verdict none">${bridge.live ? "Waiting for a shot…" : "Sim offline - tap ✓ Hit / ✗ Miss"}</div></div>`;
        }
        const sh = ls.shot, sc = ls.score, foam = s.mode === "almost";
        const ball = sh.ball || {}, cd = sh.club_data || {};
        const tiles = [];
        const metric = b.target && b.target.metric;
        if (!foam) tiles.push(["Ball speed", fmtVal(sNum(ball.speed), ""), metric === "ball_speed"]);
        tiles.push(["HLA", fmtVal(sNum(ball.hla), "°", true), metric === "hla" || !metric || metric === "manual"]);
        if (!foam && sNum(ball.carry) !== null) tiles.push(["Carry", fmtVal(sNum(ball.carry), ""), metric === "carry"]);
        if (metric && ["face", "path", "aoa"].includes(metric)) tiles.push([SESSION_METRICS[metric].label, fmtVal(sNum(cd[metric]), "°", true), true]);
        if (metric === "spin_axis" && !foam) tiles.push(["Spin axis", fmtVal(sNum(ball.spin_axis), "°", true), true]);
        const verdict = sc.ok === true ? `<div class="mat-verdict hit">✓ HIT</div>`
          : sc.ok === false ? `<div class="mat-verdict miss">✗ MISS</div>`
          : `<div class="mat-verdict none">${sc.reason === "nodata" ? "No reading for this metric - tap ✓ / ✗" : "Not auto-scored - tap ✓ / ✗"}</div>`;
        const clubWarn = b.target && b.target.club && sh.club && String(sh.club).toLowerCase().replace(/[^a-z0-9]/g, "") !== String(b.target.club).toLowerCase().replace(/[^a-z0-9]/g, "")
          ? `<div class="mat-note">Club ${esc(sh.club)} (target: ${esc(b.target.club)})</div>` : "";
        return `<div class="mat-shot ${sc.ok === true ? "hit" : sc.ok === false ? "miss" : ""}">
          <div class="mat-shot-label">Last shot${sh.club ? ` · ${esc(sh.club)}` : ""}${sh.shot_num != null ? ` · #${esc(sh.shot_num)}` : ""}</div>
          <div class="mat-shot-grid">${tiles.map(([k, v, f]) => `<div><div class="k">${esc(k)}</div><div class="v ${f ? "focus" : ""}">${esc(v)}</div></div>`).join("")}</div>
          ${verdict}${clubWarn}
        </div>`;
      }
      function renderMat() {
        const ov = document.getElementById("matOverlay");
        if (!ov || !mat.open) return;
        if (mat.view === "summary") { renderSummary(ov); return; }
        const s = state.activeSession, b = curBlock();
        if (!s || !b) { closeMat(); return; }
        const d = drillById(b.drillId);
        const cue = (d && d.video && d.video.keyFrameCue) || (d && d.instructions && d.instructions[0]) || "";
        const plan = d && d.modePlans && d.modePlans[s.mode];
        const sc = blockScore(b);
        const count = b.reps.length;
        const tempoId = tempoPresetFor(d, s.routineId);
        const tempoPreset = (DEFAULTS.cadencePresets || []).find((p) => p.id === tempoId);
        const tempoOn = cadenceState.isPlaying && (!tempoId || state.cadencePresetId === tempoId);
        const isLast = s.idx === s.blocks.length - 1;
        const unscored = b.reps.filter((r) => r.ok === null).length;
        const t = b.target;
        const canAdjust = t && t.metric !== "manual" && SESSION_METRICS[t.metric].step;
        const flashCls = mat.flash ? "mat-flash" : "";
        ov.innerHTML = `
          <div class="mat-top">
            <div class="mat-progress" aria-label="Drill ${s.idx + 1} of ${s.blocks.length}">${s.idx + 1}/${s.blocks.length}</div>
            <div class="mat-clock" id="matDrillClock"><small>Drill</small><span></span></div>
            <div class="mat-clock" id="matSessClock"><small>Session</small><span></span></div>
            <span class="sim-pill" data-sim-pill></span>
            <div class="mat-top-btns">
              <button type="button" class="mat-small-btn ${tempoOn ? "active" : ""}" id="matTempo" title="Start/stop the cadence metronome${tempoPreset ? ` at ${esc(tempoPreset.name)}` : ""} (T)">Tempo ${tempoOn ? "❚❚" : "▶"} ${esc(tempoPreset ? tempoPreset.name.split(" ")[0] : "")}</button>
              <button type="button" class="mat-small-btn" id="matFull" title="Full screen">⛶</button>
            </div>
          </div>
          <h1 class="mat-title">${esc(d ? d.title : b.drillId)}</h1>
          ${cue ? `<p class="mat-cue">${esc(cue)}</p>` : ""}
          <div class="mat-target">
            ${t ? `<span>🎯 ${esc(targetText(t))}</span>` : `<span>${esc(d && d.reps ? d.reps : "")}</span>`}
            ${canAdjust ? `<button type="button" class="mat-small-btn mat-goal-btn" data-goal="-1" aria-label="Lower goal">−</button><button type="button" class="mat-small-btn mat-goal-btn" data-goal="1" aria-label="Raise goal">+</button>` : ""}
            ${t && t.pass && b.repGoal ? `<span>· pass ${t.pass}/${b.repGoal}</span>` : ""}
          </div>
          ${plan && s.mode !== "real" ? `<div class="mat-note">${esc(modeDef(s.mode).shortLabel)}: ${esc(plan)}</div>` : ""}
          <div class="mat-main">
            <div class="${flashCls}">
              <div class="mat-count" aria-live="polite">${count}${b.repGoal ? `<span class="of"> / ${b.repGoal}</span>` : ""}</div>
              <div class="mat-hm"><span class="h">✓ ${sc.hits}</span> &nbsp; <span class="m">✗ ${sc.n - sc.hits}</span>${sc.n ? ` &nbsp; <span class="r">${Math.round((sc.hits / sc.n) * 100)}%</span>` : ""}${unscored ? ` &nbsp; <span class="r" style="font-size:22px;">${unscored} unscored</span>` : ""}</div>
            </div>
            ${renderShotPanel(s, b)}
          </div>
          ${mat.advanceTimer ? `<div class="mat-banner" role="status">✓ Rep goal reached - ${isLast ? "finishing session" : "next drill"} in a moment (Undo to stay)</div>` : ""}
          <div class="mat-actions mat-run-actions">
            <button type="button" class="mat-btn hit" id="matHit">✓ Hit<small>Space · H · 1</small></button>
            <button type="button" class="mat-btn miss" id="matMiss">✗ Miss<small>M · X · 2</small></button>
            <button type="button" class="mat-btn" id="matUndo">Undo<small>Backspace</small></button>
            <button type="button" class="mat-btn" id="matPrev" ${s.idx === 0 ? "disabled" : ""}>‹ Prev<small>PgUp · ←</small></button>
            <button type="button" class="mat-btn" id="matNext">${isLast ? "Finish" : "Next ›"}<small>PgDn · →</small></button>
            <button type="button" class="mat-btn end" id="matEnd">End<small>Esc</small></button>
          </div>
          <div class="mat-keys">Presenter clicker: PgDn = next · PgUp = prev · T = tempo · Shots from the sim are logged automatically when it is live.</div>
          ${mat.confirm ? `<div class="mat-confirm" role="alertdialog" aria-modal="true" aria-labelledby="matConfirmTitle">
            <div class="mat-confirm-box">
              <h2 id="matConfirmTitle">End session?</h2>
              <p>${s.blocks.reduce((tt, x) => tt + x.reps.length, 0)} reps logged so far.</p>
              <div class="mat-actions">
                <button type="button" class="mat-btn hit" id="matConfirmEnd" style="font-size:28px;">End &amp; summary<small>Enter</small></button>
                <button type="button" class="mat-btn" id="matConfirmPause">Pause<small>resume later</small></button>
                <button type="button" class="mat-btn" id="matConfirmKeep">Keep going<small>Esc</small></button>
              </div>
            </div>
          </div>` : ""}
        `;
        mat.flash = null;
        const on = (id, fn) => { const n = document.getElementById(id); if (n) n.onclick = fn; };
        on("matHit", () => logRep(true));
        on("matMiss", () => logRep(false));
        on("matUndo", undoRep);
        on("matPrev", prevBlock);
        on("matNext", nextBlock);
        on("matEnd", requestEndSession);
        on("matTempo", toggleSessionTempo);
        on("matFull", toggleFullscreen);
        on("matConfirmEnd", () => { mat.confirm = false; finishSession(); });
        on("matConfirmPause", () => { mat.confirm = false; closeMat(); showToast("Session paused - Resume from the Tonight card."); });
        on("matConfirmKeep", () => { mat.confirm = false; renderMat(); });
        ov.querySelectorAll("[data-goal]").forEach((n) => n.onclick = () => {
          const step = SESSION_METRICS[t.metric].step * Number(n.getAttribute("data-goal"));
          t.goal = Math.round((t.goal + step) * 10) / 10;
          saveSessionState();
          renderMat();
        });
        updateSimPills();
        updateMatClock();
        if (mat.confirm) { const c = document.getElementById("matConfirmEnd"); if (c) c.focus(); }
      }
      function requestEndSession() {
        const s = state.activeSession;
        if (!s) { closeMat(); return; }
        const reps = s.blocks.reduce((t, x) => t + x.reps.length, 0);
        if (reps > 0 || s.blocks.some((x) => (x.secs || 0) >= DONE_MIN_SECS)) { mat.confirm = true; renderMat(); return; }
        // Nothing logged: just leave (and drop the empty session).
        state.activeSession = null;
        postActiveDrill(null);
        saveState();
        closeMat();
      }

      // ---- rendering: summary view ----
      function prevRateBefore(drillId, sessionId) {
        let prev = null;
        for (const s of sortedSessions()) {
          if (s.id === sessionId) break;
          const sc = sessionDrillScore(s, drillId);
          if (sc.n) prev = sc.rate;
        }
        return prev;
      }
      function sessionAutoNote(s) {
        const parts = s.blocks.filter((b) => b.done).map((b) => {
          const d = drillById(b.drillId), sc = blockScore(b);
          return `${shortTitle(d, 28)} ${sc.n ? `${sc.hits}/${sc.n}` : `${b.reps.length} reps`}`;
        });
        return `Mat session ${sessionMinutes(s)}m (${modeDef(s.mode).shortLabel || s.mode}): ${parts.join(", ")}`;
      }
      function renderSummary(ov) {
        const s = (state.sessions || []).find((x) => x.id === mat.summaryId);
        if (!s) { closeMat(); return; }
        const planned = s.blocks.length;
        const doneN = s.blocks.filter((b) => b.done).length;
        const balls = s.blocks.reduce((t, b) => t + b.reps.length, 0);
        let hitsAll = 0, nAll = 0;
        const rows = s.blocks.map((b) => {
          const sc = blockScore(b);
          hitsAll += sc.hits; nAll += sc.n;
          const prev = prevRateBefore(b.drillId, s.id);
          const rate = sc.n ? sc.hits / sc.n : null;
          const delta = rate !== null && prev !== null ? Math.round((rate - prev) * 100) : null;
          const trend = drillRateHistory(b.drillId, 5, s.id).map((h) => h.rate);
          return { b, d: drillById(b.drillId), sc, rate, delta, trend };
        });
        const scored = rows.filter((r) => r.rate !== null);
        const best = scored.length ? scored.reduce((a, r) => (r.rate > a.rate ? r : a)) : null;
        const worstC = scored.length > 1 ? scored.reduce((a, r) => (r.rate < a.rate ? r : a)) : null;
        const worst = worstC && best && worstC.rate < best.rate ? worstC : null;
        const log = getDayLog(s.date);
        if (!mat.logDraft || mat.logDraft.id !== s.id) {
          const derived = doneN === planned ? "met" : doneN > 0 ? "partial" : "missed";
          const note = sessionAutoNote(s);
          const existing = String(log.notes || "");
          mat.logDraft = {
            id: s.id,
            status: log.status === "met" ? "met" : derived,
            quality: typeof log.quality === "number" ? log.quality : 4,
            notes: s.savedToLog || existing.includes(note) ? existing : (existing ? existing + "\n" : "") + note
          };
        }
        const dr = mat.logDraft;
        const statusOpts = [["met", "✅ Met"], ["partial", "⚡ Partial"], ["recovery", "💪 Recovery"], ["missed", "❌ Missed"]];
        ov.innerHTML = `
          <div class="mat-sum">
            <div class="mat-top">
              <div class="mat-progress">Session summary</div>
              <span class="sim-pill" data-sim-pill></span>

              <div class="row" role="group" aria-label="Status"><span style="min-width:90px;">Status</span>${statusOpts.map(([v, l]) => `<button type="button" class="opt" data-sum-status="${v}" aria-pressed="${dr.status === v}">${l}</button>`).join("")}</div>
              <div class="row" role="group" aria-label="Quality"><span style="min-width:90px;">Quality</span>${[1, 2, 3, 4, 5].map((n) => `<button type="button" class="opt" data-sum-q="${n}" aria-pressed="${dr.quality === n}">${n}</button>`).join("")}</div>
              <label for="sumNotes" style="font-size:18px; color:#cbd5e1;">Notes</label>
              <textarea id="sumNotes">${esc(dr.notes)}</textarea>
              <div class="sum-actions">
                <button type="button" class="mat-btn primary" id="sumSave">💾 ${s.savedToLog ? "Update day log" : "Save to day log"}</button>
                <button type="button" class="mat-btn" id="sumOpenLog">Open day log</button>

        ov.querySelectorAll("[data-sum-status]").forEach((n) => n.onclick = () => { dr.notes = document.getElementById("sumNotes").value; dr.status = n.getAttribute("data-sum-status"); renderMat(); });
        ov.querySelectorAll("[data-sum-q]").forEach((n) => n.onclick = () => { dr.notes = document.getElementById("sumNotes").value; dr.quality = Number(n.getAttribute("data-sum-q")); renderMat(); });
        document.getElementById("sumNotes").oninput = (e) => { dr.notes = e.target.value; };
        document.getElementById("sumSave").onclick = () => saveSessionToDayLog(s);
        document.getElementById("sumClose").onclick = closeMat;
        document.getElementById("sumDone").onclick = closeMat;
        document.getElementById("sumOpenLog").onclick = () => {
          state.selectedLogDate = s.date;
          state.activeView = "tracker";

          window.scrollTo(0, 0);
        };

      }
      function saveSessionToDayLog(s) {
        const dr = mat.logDraft;
        const log = ensureDayLog(s.date);
        log.status = dr.status;
        log.mode = s.mode;
        log.quality = dr.quality;
        log.notes = String(dr.notes || "");
        for (const b of s.blocks) if (b.done && !log.completedDrills.includes(b.drillId)) log.completedDrills.push(b.drillId);
        s.savedToLog = true;
        saveState();
        renderHeader();
        showToast(`Saved to day log for ${s.date}`);
        renderMat();
      }

      // ---- keyboard: scoped to the overlay (capture phase, so the page's T / M / arrows never fire underneath) ----
      window.addEventListener("keydown", (e) => {
        if (!mat.open) return;
        const tgt = e.target || {};
        const typing = tgt.tagName === "TEXTAREA" || tgt.tagName === "INPUT" || tgt.tagName === "SELECT";
        e.stopImmediatePropagation();
        if (e.key === "Tab" || e.altKey || e.ctrlKey || e.metaKey) return;
        if (mat.view === "summary") {
          if (e.key === "Escape") { e.preventDefault(); closeMat(); }
          return;
        }
        if (typing) return;
        const k = e.key;
        if (mat.confirm) {
          if (k === "Escape") { e.preventDefault(); mat.confirm = false; renderMat(); }
          else if (k === "Enter") { e.preventDefault(); mat.confirm = false; finishSession(); }
          return;
        }
        const handled = () => e.preventDefault();
        if (k === "PageDown" || k === "ArrowRight") { handled(); if (!e.repeat) nextBlock(); }
        else if (k === "PageUp" || k === "ArrowLeft") { handled(); if (!e.repeat) prevBlock(); }
        else if (k === " " || k === "h" || k === "H" || k === "1") { handled(); if (!e.repeat) logRep(true); }
        else if (k === "m" || k === "M" || k === "x" || k === "X" || k === "2") { handled(); if (!e.repeat) logRep(false); }
        else if (k === "Backspace" || k === "u" || k === "U") { handled(); undoRep(); }
        else if (k === "t" || k === "T") { handled(); if (!e.repeat) toggleSessionTempo(); }
        else if (k === "Escape") { handled(); requestEndSession(); }
        else if (k === "ArrowUp" || k === "ArrowDown" || k === "b" || k === "B" || k === ".") { handled(); } // clicker "blank" keys etc.: swallow
      }, true);

      // ---- live shot bridge (simwatch.py bridge; CORS-enabled so it works from file://) ----
      const bridge = { es: null, live: false, retry: null, seen: new Set(), status: null, lastShot: null };
      function updateSimPills() {
        const st = bridge.status || {};
        document.querySelectorAll("[data-sim-pill]").forEach((n) => {
          n.classList.toggle("live", bridge.live);
          n.textContent = bridge.live ? "Sim live" : "Sim offline (manual scoring)";
          n.title = bridge.live
            ? `Shot bridge connected${st.sniffer_ok ? " · GSPro feed OK" : " · waiting for the GSPro feed"}${st.last_shot_ts ? ` · last shot ${st.last_shot_ts}` : ""}`
            : `No shot bridge at ${BRIDGE_URL} - run "python simwatch.py bridge" (retrying every 15s). Tap ✓ / ✗ to score.`;
        });
      }
      function setBridgeLive(live) {
        const was = bridge.live;
        bridge.live = live;
        updateSimPills();
        if (live && !was && state.activeSession && mat.open && mat.view === "run") postActiveDrill(curBlock() && curBlock().drillId);
        if (was !== live && mat.open && mat.view === "run" && !mat.lastShot) renderMat();
      }
      function scheduleBridgeRetry() {
        clearTimeout(bridge.retry);
        bridge.retry = setTimeout(bridgeConnect, 15000);
      }
      async function bridgeConnect() {
        clearTimeout(bridge.retry);
        if (bridge.es) return;
        if (typeof window.EventSource !== "function" || typeof window.fetch !== "function") { setBridgeLive(false); return; }
        try {
          const ctl = typeof AbortController === "function" ? new AbortController() : null;
          const to = ctl ? setTimeout(() => ctl.abort(), 2500) : null;
          const res = await fetch(`${BRIDGE_URL}/api/status`, { cache: "no-store", signal: ctl ? ctl.signal : undefined });
          if (to) clearTimeout(to);
          const doc = await res.json();
          if (!res.ok || !doc || doc.ok !== true) throw new Error("bad status");
          bridge.status = doc;
        } catch (e) {
          setBridgeLive(false);
          scheduleBridgeRetry();
          return;
        }
        let es;
        try { es = new EventSource(`${BRIDGE_URL}/api/events`); } catch (e) { setBridgeLive(false); scheduleBridgeRetry(); return; }
        bridge.es = es;
        es.onopen = () => setBridgeLive(true);
        es.addEventListener("status", (ev) => {
          try { const doc = JSON.parse(ev.data); if (isPlainObj(doc)) bridge.status = doc; } catch (e) { /* ignore */ }
          setBridgeLive(true);
        });
        es.addEventListener("shot", (ev) => {
          let shot = null;
          try { shot = JSON.parse(ev.data); } catch (e) { return; }
          onBridgeShot(shot);
        });
        es.onerror = () => {
          es.close();
          if (bridge.es === es) bridge.es = null;
          setBridgeLive(false);
          scheduleBridgeRetry();
        };
      }
      function postActiveDrill(drillId) {
        if (!bridge.live || typeof window.fetch !== "function") return;
        const id = typeof drillId === "string" && /^[A-Za-z0-9_-]{1,80}$/.test(drillId) ? drillId : null;
        fetch(`${BRIDGE_URL}/api/drill`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ drill_id: id })
        }).catch(() => { /* bridge went away; the EventSource error handler flips the pill */ });
      }
      function onBridgeShot(shot) {
        if (!isPlainObj(shot) || typeof shot.ts !== "string" || !shot.ts) return;
        if (bridge.seen.has(shot.ts)) return; // ts is the unique key (shot_num resets)
        bridge.seen.add(shot.ts);
        if (bridge.seen.size > 3000) bridge.seen = new Set(Array.from(bridge.seen).slice(-1000));
        bridge.lastShot = shot;
        if (bridge.status) bridge.status.last_shot_ts = shot.ts;
        const s = state.activeSession, b = curBlock();
        if (!mat.open || mat.view !== "run" || !s || !b || mat.confirm) { updateSimPills(); return; }
        const sc = scoreShot(shot, b.target, s.mode);
        b.reps.push({ ok: sc.ok, value: sc.value, ts: new Date().toISOString(), shotTs: shot.ts });
        mat.lastShot = { shot, score: sc };
        afterRep(sc.ok);
      }

      // ============================== END SESSION ==============================

      function enhanceA11y() {
        document.querySelectorAll(CLICKABLE_SEL).forEach((n) => {
          if (n.tagName === "BUTTON" || n.tagName === "A") return;
          if (!n.hasAttribute("role")) n.setAttribute("role", "button");
          if (!n.hasAttribute("tabindex")) n.setAttribute("tabindex", "0");
        });
        const orb = document.getElementById("tempoOrb");

        document.querySelectorAll("[data-pick-cadence]").forEach((n) => n.setAttribute("aria-pressed", String(n.classList.contains("active") || n.classList.contains("is-active") || n.getAttribute("data-pick-cadence") === state.cadencePresetId)));
        document.querySelectorAll("[data-routine],[data-section]").forEach((n) => n.setAttribute("aria-pressed", String(n.classList.contains("active"))));
        document.querySelectorAll(".btn-pill:not([role=tab])").forEach((n) => n.setAttribute("aria-pressed", String(n.classList.contains("active"))));
        document.querySelectorAll("#btnCadencePlayToggle, #btnTopbarCadence").forEach((n) => n.setAttribute("aria-pressed", String(cadenceState.isPlaying)));
      }
      document.addEventListener("keydown", (e) => {
        if ((e.key === "Enter" || e.key === " ") && e.target && e.target.getAttribute && e.target.getAttribute("role") === "button" &&
            e.target.tagName !== "BUTTON" && !e.altKey && !e.ctrlKey && !e.metaKey) {

          e.stopPropagation();

        }
      }, true);

      // =====================================================================================
      // ===== SWING CHECKLIST: per-phase checklist view + "Pre-shot cards" fullscreen overlay =====
      // (Deliberately NOT named "Mat mode": that is the Tonight's Session overlay above.)
      // State it owns: state.checklistFocusIds, state.checklistLog, state.checklistCustomItems,
      // state.checklistFocusOnly. Content comes from DEFAULTS.swingChecklist (drills_data.js).
      // =====================================================================================
      const clExpanded = new Set();          // item ids whose details are open (UI only)
      const clDraft = { title: "", cue: "", phase: "" };
      const clCue = { open: false, idx: 0, ids: [], returnFocus: null, tx: 0, ty: 0 };

      function clData() { return DEFAULTS.swingChecklist || { phases: [], defaultFocusIds: [], items: [] }; }
      function clPhases() { return Array.isArray(clData().phases) ? clData().phases : []; }
      function clAllItems() {
        const built = (clData().items || []).map((it) => Object.assign({}, it, { custom: false }));
        const custom = (state.checklistCustomItems || []).map((it) => ({
          id: it.id, phase: it.phase, title: it.title, cue: it.cue, why: "", check: { dtl: "", fo: "" },
          fault: "", feel: "", drillIds: [], custom: true
        }));
        return built.concat(custom);
      }
      function clItemById(id) { return clAllItems().find((it) => it.id === id) || null; }
      function clTodaySet() { return new Set(state.checklistLog[todayISO(0)] || []); }
      function clFocusSet() { return new Set(state.checklistFocusIds || []); }
      function clVisibleItems() {
        const all = clAllItems();
        const f = clFocusSet();
        // Focus-only with nothing starred would show an empty list; fall back to everything.
        if (!state.checklistFocusOnly || !f.size) return all;
        return all.filter((it) => f.has(it.id));
      }
      function clFocusItems() {
        const f = clFocusSet();
        const order = clPhases().map((p) => p.id);
        return clAllItems().filter((it) => f.has(it.id))
          .map((it, i) => ({ it, i, p: order.indexOf(it.phase) }))
          .sort((a, b) => (a.p - b.p) || (a.i - b.i)).map((x) => x.it);
      }
      function clWeekDays() {
        let n = 0;
        for (let i = 0; i < 7; i++) if ((state.checklistLog[todayISO(-i)] || []).length) n++;
        return n;
      }
      function clPhaseName(id) { const p = clPhases().find((x) => x.id === id); return p ? p.name : ""; }

      function clToggleCheck(id) {
        const iso = todayISO(0);
        const cur = new Set(state.checklistLog[iso] || []);
        if (cur.has(id)) cur.delete(id); else cur.add(id);
        if (cur.size) state.checklistLog[iso] = Array.from(cur); else delete state.checklistLog[iso];
        saveState();
      }
      function clToggleStar(id) {
        const cur = new Set(state.checklistFocusIds || []);
        if (cur.has(id)) cur.delete(id); else cur.add(id);

      function clDrillChips(it) {

            </div>

      function clItemCard(it, today, focus) {
        const done = today.has(it.id);

        const open = clExpanded.has(it.id);
        const rows = [];
        if (it.why) rows.push(`<dt>Why it matters</dt><dd>${esc(it.why)}</dd>`);

        const focus = clFocusSet();

        const checkedVisible = visible.filter((it) => today.has(it.id)).length;

              <div class="cl-grid">${items.map((it) => clItemCard(it, today, focus)).join("")}</div>
