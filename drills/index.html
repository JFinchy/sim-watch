          ${phaseHtml || `<p class="cl-empty">Nothing to show. Star an item or turn off Focus only.</p>`}

          <section class="panel cl-add" aria-label="Add my own item">
            <h3 style="margin-top:0;">➕ Add my own item</h3>
            <form id="clAddForm" autocomplete="off">
              <label>Title
                <input type="text" id="clAddTitle" maxlength="120" required value="${esc(clDraft.title)}" />
              </label>
              <label>Cue (what to think or feel)
                <textarea id="clAddCue" maxlength="400">${esc(clDraft.cue)}</textarea>
              </label>
              <label>Phase
                <select id="clAddPhase">${phases.map((p) => `<option value="${esc(p.id)}" ${clDraft.phase === p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select>
              </label>
              <div><button type="submit" class="nav-btn primary">Add item</button></div>
            </form>
          </section>`;
        void ids;

        window.scrollTo(0, scrollY);
        if (fk) {
          const target = Array.from(el.querySelectorAll("[data-fk]")).find((n) => n.getAttribute("data-fk") === fk && !n.disabled);
          if (target) target.focus({ preventScroll: true });
        }
      }

      function clGoto(id) {
        const it = clItemById(id);
        if (!it) return;
        if (state.checklistFocusOnly && !clFocusSet().has(id)) state.checklistFocusOnly = false;
        clExpanded.add(id);
        saveState();
        renderChecklist();
        const el = document.getElementById("view-checklist");
        const node = Array.from(el.querySelectorAll("[data-cl-item]")).find((n) => n.getAttribute("data-cl-item") === id);
        if (!node) return;
        const calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        node.scrollIntoView({ block: "center", behavior: calm ? "auto" : "smooth" });
        node.classList.add("flash");
        setTimeout(() => node.classList.remove("flash"), 1600);
        const btn = node.querySelector(".cl-more");
        if (btn) btn.focus({ preventScroll: true });
      }

      function clOpenDrill(drillId) {
        if (!drillById(drillId)) { showToast("That drill is no longer in your deck."); return; }
        state.activeMode = "all";
        state.activeRoutine = "all";
        state.activeSection = "all";
        state.selectedDrillId = drillId;
        state.activeView = "deck";
        saveState();
        renderAll();
        window.scrollTo(0, 0);
      }

      function clDelete(id) {
        const idx = (state.checklistCustomItems || []).findIndex((it) => it.id === id);
        if (idx < 0) return;
        const removed = state.checklistCustomItems[idx];
        const hadFocus = (state.checklistFocusIds || []).includes(id);
        const logged = Object.keys(state.checklistLog).filter((d) => state.checklistLog[d].includes(id));
        state.checklistCustomItems.splice(idx, 1);
        state.checklistFocusIds = (state.checklistFocusIds || []).filter((x) => x !== id);
        logged.forEach((d) => {
          state.checklistLog[d] = state.checklistLog[d].filter((x) => x !== id);
          if (!state.checklistLog[d].length) delete state.checklistLog[d];
        });
        clExpanded.delete(id);
        saveState();
        renderChecklist();
        showUndoToast(`Deleted "${removed.title}".`, () => {
          state.checklistCustomItems.splice(Math.min(idx, state.checklistCustomItems.length), 0, removed);
          if (hadFocus) state.checklistFocusIds = (state.checklistFocusIds || []).concat([id]);
          logged.forEach((d) => { state.checklistLog[d] = (state.checklistLog[d] || []).concat([id]); });
          saveState();
          if (state.activeView === "checklist") renderChecklist();
        });
      }

      function clClearToday() {
        const iso = todayISO(0);
        const prev = state.checklistLog[iso];
        if (!prev || !prev.length) return;
        delete state.checklistLog[iso];
        saveState();
        renderChecklist();
        showUndoToast("Cleared today's checks.", () => {
          state.checklistLog[iso] = prev;
          saveState();
          if (state.activeView === "checklist") renderChecklist();
        });
      }

      function clAddItem() {
        const title = clDraft.title.trim().slice(0, 120);
        if (!title) { showToast("Give your item a title first."); return; }
        const phases = clPhases();
        const phase = phases.some((p) => p.id === clDraft.phase) ? clDraft.phase : (phases[0] && phases[0].id) || "";
        const id = "custom-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        state.checklistCustomItems.push({ id, phase, title, cue: clDraft.cue.trim().slice(0, 400) });
        clDraft.title = "";
        clDraft.cue = "";
        saveState();
        renderChecklist();
        showToast("Added your item. Star it to put it in My Focus.");
      }

      (function bindChecklist() {
        const el = document.getElementById("view-checklist");
        el.addEventListener("click", (e) => {
          const btn = e.target.closest && e.target.closest("[data-cl-act]");
          if (!btn || !el.contains(btn)) return;
          const act = btn.getAttribute("data-cl-act");
          const id = btn.getAttribute("data-cl-id");
          if (act === "check") { clToggleCheck(id); renderChecklist(); }
          else if (act === "star") {
            clToggleStar(id);
            renderChecklist();
            showToast(clFocusSet().has(id) ? "Added to My Focus." : "Removed from My Focus.");
          }
          else if (act === "expand") {
            if (clExpanded.has(id)) clExpanded.delete(id); else clExpanded.add(id);
            renderChecklist();
          }
          else if (act === "focusonly") { state.checklistFocusOnly = !state.checklistFocusOnly; saveState(); renderChecklist(); }
          else if (act === "clear") clClearToday();
          else if (act === "cards") openCue();
          else if (act === "goto") clGoto(id);
          else if (act === "drill") clOpenDrill(btn.getAttribute("data-cl-drill"));
          else if (act === "delete") clDelete(id);
        });
        el.addEventListener("input", (e) => {
          if (e.target.id === "clAddTitle") clDraft.title = e.target.value;
          else if (e.target.id === "clAddCue") clDraft.cue = e.target.value;
        });
        el.addEventListener("change", (e) => { if (e.target.id === "clAddPhase") clDraft.phase = e.target.value; });
        el.addEventListener("submit", (e) => { e.preventDefault(); if (e.target.id === "clAddForm") clAddItem(); });
      })();

      // ---- Pre-shot cards: fullscreen, one starred item per screen ----
      function openCue() {
        const items = clFocusItems();
        if (!items.length) { showToast("Star at least one item first."); return; }
        if (typeof mat !== "undefined" && mat.open) return;
        const ov = document.getElementById("cueOverlay");
        if (!clCue.open) clCue.returnFocus = document.activeElement;
        clCue.ids = items.map((it) => it.id);
        clCue.idx = 0;
        clCue.open = true;
        ov.classList.remove("hidden");
        document.body.classList.add("cue-open");
        renderCue();
        ov.focus({ preventScroll: true });
        if (typeof requestWakeLock === "function") requestWakeLock();
      }
      function closeCue() {
        if (!clCue.open) return;
        clCue.open = false;
        const ov = document.getElementById("cueOverlay");
        ov.classList.add("hidden");
        ov.innerHTML = "";
        document.body.classList.remove("cue-open");
        if (typeof mat !== "undefined" && !mat.open && typeof releaseWakeLock === "function") releaseWakeLock();
        if (state.activeView === "checklist") renderChecklist();
        const back = clCue.returnFocus && clCue.returnFocus.isConnected ? clCue.returnFocus : document.querySelector('[data-cl-act="cards"]');
        if (back && back.focus) back.focus({ preventScroll: true });
      }
      function stepCue(delta) {
        const n = clCue.ids.length;
        if (!n) return;
        clCue.idx = (clCue.idx + delta + n) % n;
        renderCue();
      }
      function renderCue() {
        const ov = document.getElementById("cueOverlay");
        // Drop any items that vanished (e.g. deleted) so the index stays valid.
        clCue.ids = clCue.ids.filter((id) => clItemById(id));
        if (!clCue.ids.length) { closeCue(); return; }
        if (clCue.idx >= clCue.ids.length) clCue.idx = 0;
        const it = clItemById(clCue.ids[clCue.idx]);
        const done = clTodaySet().has(it.id);
        const act = document.activeElement && ov.contains(document.activeElement) ? document.activeElement.getAttribute("data-cue-act") : null;
        ov.innerHTML = `
          <div class="cue-top">
            <span class="cue-count">${clCue.idx + 1} / ${clCue.ids.length}</span>
            <span class="cue-phase">${esc(clPhaseName(it.phase))}</span>
            <button type="button" class="cue-btn" data-cue-act="close" aria-label="Close pre-shot cards">&#10005; Close</button>
          </div>
          <div class="cue-body" data-cue-body aria-live="polite">
            <h2 class="cue-title">${esc(it.title)}</h2>
            ${it.cue ? `<p class="cue-text">${esc(it.cue)}</p>` : ""}
          </div>
          <div class="cue-dots" aria-hidden="true">${clCue.ids.map((_, i) => `<i class="${i === clCue.idx ? "on" : ""}"></i>`).join("")}</div>
          <div class="cue-nav">
            <button type="button" class="cue-btn" data-cue-act="prev" aria-label="Previous card">&larr; Prev</button>
            <button type="button" class="cue-btn" data-cue-act="check" aria-pressed="${done}">${done ? "&#10003; Done today" : "Mark done today"}</button>
            <button type="button" class="cue-btn" data-cue-act="next" aria-label="Next card">Next &rarr;</button>
          </div>
          <p class="cue-hint">Tap the card, swipe, or use the arrow keys to move on. Esc closes.</p>`;
        if (act) {
          const b = ov.querySelector(`[data-cue-act="${act}"]`);
          if (b) b.focus({ preventScroll: true });
        } else if (!ov.contains(document.activeElement)) {
          ov.focus({ preventScroll: true });
        }
      }
      (function bindCue() {
        const ov = document.getElementById("cueOverlay");
        ov.addEventListener("click", (e) => {
          const btn = e.target.closest && e.target.closest("[data-cue-act]");
          if (btn) {
            const a = btn.getAttribute("data-cue-act");
            if (a === "close") closeCue();
            else if (a === "prev") stepCue(-1);
            else if (a === "next") stepCue(1);
            else if (a === "check") { clToggleCheck(clCue.ids[clCue.idx]); renderCue(); }
            return;
          }
          if (e.target.closest && e.target.closest("[data-cue-body]")) stepCue(1);
        });
        ov.addEventListener("touchstart", (e) => {
          const t = e.changedTouches && e.changedTouches[0];
          if (t) { clCue.tx = t.clientX; clCue.ty = t.clientY; }
        }, { passive: true });
        ov.addEventListener("touchend", (e) => {
          const t = e.changedTouches && e.changedTouches[0];
          if (!t) return;
          const dx = t.clientX - clCue.tx, dy = t.clientY - clCue.ty;
          if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) stepCue(dx < 0 ? 1 : -1);
        }, { passive: true });
        // Capture phase so the page's T / M / arrow shortcuts never fire underneath the overlay.
        window.addEventListener("keydown", (e) => {
          if (!clCue.open) return;
          e.stopImmediatePropagation();
          if (e.altKey || e.ctrlKey || e.metaKey) return;
          const k = e.key;
          const tgt = e.target || {};
          if (k === "Escape") { e.preventDefault(); closeCue(); }
          else if (k === "Tab") {
            const btns = Array.from(ov.querySelectorAll("button"));
            if (!btns.length) { e.preventDefault(); return; }
            const first = btns[0], last = btns[btns.length - 1];
            if (e.shiftKey && (document.activeElement === first || document.activeElement === ov)) { e.preventDefault(); last.focus(); }
            else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
          }
          else if (k === "ArrowRight" || k === "PageDown") { e.preventDefault(); stepCue(1); }
          else if (k === "ArrowLeft" || k === "PageUp") { e.preventDefault(); stepCue(-1); }
          else if ((k === " " || k === "Enter") && tgt.tagName !== "BUTTON") { e.preventDefault(); stepCue(1); }
        }, true);
      })();
      // ============================== END SWING CHECKLIST ==============================

      function renderAll() {
        renderHeader();
        renderModeBar();
        renderViewTabs();
        renderFilterBar();
        renderTonightCard();

        ["deck", "checklist", "browse", "tracker", "courses", "editor", "cadence", "bag"].forEach((v) => {
          const viewEl = document.getElementById(`view-${v}`);
          if (viewEl) viewEl.classList.toggle("hidden", state.activeView !== v);
        });

        if (state.activeView === "deck") renderDeck();
        else if (state.activeView === "checklist") renderChecklist();
        else if (state.activeView === "browse") renderBrowse();
        else if (state.activeView === "tracker") renderTracker();
        else if (state.activeView === "courses") renderCourses();
        else if (state.activeView === "editor") renderEditor();
        else if (state.activeView === "cadence") renderCadence();
        else if (state.activeView === "bag") renderBag();
        enhanceA11y();
      }

      // Deck navigation listeners
      document.getElementById("btnPrevDrill").onclick = () => jumpDrill(-1);
      document.getElementById("btnNextDrill").onclick = () => jumpDrill(1);
      document.getElementById("btnPrevSection").onclick = () => jumpSection(-1);
      document.getElementById("btnNextSection").onclick = () => jumpSection(1);

      // Keyboard navigation (ignore when typing inside inputs/textareas/selects or holding modifier keys)
      window.addEventListener("keydown", (e) => {
        if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey && e.key.length > 1 || e.defaultPrevented) return;
        const tgt = e.target || {};
        const tag = tgt.tagName || "";
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || tgt.isContentEditable ||
            (tgt.getAttribute && /^(textbox|combobox|slider|spinbutton|searchbox)$/.test(tgt.getAttribute("role") || ""))) return;

        // Global Cadence Metronome toggle
        if (e.key === "t" || e.key === "T") {
          e.preventDefault();
          if (e.repeat) return; // holding T must not flap the metronome on/off
          toggleCadenceMetronome();
          return;
        }

        // Drill deck navigation only on Deck view
        if (state.activeView !== "deck") return;
        if (tag === "VIDEO" && e.key.startsWith("Arrow")) return;

        if (e.key === "ArrowLeft") {
          e.preventDefault();
          jumpDrill(-1);
        } else if (e.key === "ArrowRight") {
          e.preventDefault();
          jumpDrill(1);
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          jumpSection(-1);
        } else if (e.key === "ArrowDown") {
          e.preventDefault();
          jumpSection(1);
        } else if (e.key === " " || e.code === "Space") {
          if (tag === "BUTTON" || tag === "A" || tag === "VIDEO" || (tgt.getAttribute && tgt.getAttribute("role") === "button")) return;
          const vid = document.getElementById("drillVideo");
          if (vid && !vid.classList.contains("hidden")) {
            e.preventDefault();
            if (vid.paused) vid.play().catch(() => {});
            else vid.pause();
          }
        } else if (e.key === "m" || e.key === "M") {
          if (state.selectedDrillId) {
            e.preventDefault();
            toggleDrillDoneToday(state.selectedDrillId);
          }
        }
      });

      renderAll();
      loadShortsHandles();
      bridgeConnect();
      if (backupIsStale()) setTimeout(() => showToast("Reminder: " + backupStatusText() + " (Editor tab > Export Full Backup)"), 1200);
    })();
  </script>
</body>
</html>
