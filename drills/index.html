<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SimWatch Golf Drills, Routines &amp; Daily Delivery Hub</title>
  <style>
    :root {
      --bg: #0b1120;
      --bg-card: #111827;
      --bg-elev: #1e293b;
      --bg-hover: #263449;
      --border: #2c3b55;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --green: #10b981;
      --green-soft: rgba(16, 185, 129, 0.16);
      --indigo: #818cf8;
      --indigo-soft: rgba(129, 140, 248, 0.16);
      --amber: #f59e0b;
      --amber-soft: rgba(245, 158, 11, 0.16);
      --red: #ef4444;
      --red-soft: rgba(239, 68, 68, 0.16);
      --radius: 12px;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at 15% 0%, #13223e 0%, var(--bg) 55%);
      color: var(--text);
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      min-height: 100vh;
      line-height: 1.5;
    }

    a { color: var(--accent); }
    button, input, textarea, select {
      font: inherit;
      color: inherit;
    }

    .app-shell {
      max-width: 1320px;
      margin: 0 auto;
      padding: 18px 20px 60px;
    }

    /* Header */
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 20px;
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: linear-gradient(135deg, #0284c7, #10b981);
      display: grid;
      place-items: center;
      font-size: 22px;
      font-weight: 700;
    }
    .brand h1 {
      margin: 0;
      font-size: 1.25rem;
      letter-spacing: -0.01em;
    }
    .brand p {
      margin: 2px 0 0;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .hud-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      font-size: 0.85rem;
      font-weight: 600;
    }
    .stat-pill.good { background: var(--green-soft); border-color: rgba(16, 185, 129, 0.45); color: #6ee7b7; }
    .stat-pill.warn { background: var(--amber-soft); border-color: rgba(245, 158, 11, 0.45); color: #fcd34d; }
    .stat-pill.info { background: var(--accent-soft); border-color: rgba(56, 189, 248, 0.45); color: #7dd3fc; }

    /* Mode + View Navigation Bars */
    .controls-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .pill-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      background: rgba(17, 24, 39, 0.85);
      padding: 6px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
    .pill-group-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      padding: 0 8px 0 6px;
      font-weight: 700;
    }

    .btn-pill {
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      padding: 7px 13px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-pill:hover { background: var(--bg-elev); color: var(--text); }
    .btn-pill.active {
      background: var(--accent-soft);
      border-color: rgba(56, 189, 248, 0.55);
      color: #e0f2fe;
    }
    .btn-pill.mode-real.active {
      background: var(--green-soft);
      border-color: rgba(16, 185, 129, 0.6);
      color: #a7f3d0;
    }
    .btn-pill.mode-almost.active {
      background: var(--indigo-soft);
      border-color: rgba(129, 140, 248, 0.6);
      color: #c7d2fe;
    }
    .btn-pill.mode-sore.active {
      background: var(--amber-soft);
      border-color: rgba(245, 158, 11, 0.6);
      color: #fde68a;
    }

    /* Routine + Section Ribbon */
    .filter-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .filter-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .filter-label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      min-width: 82px;
      font-weight: 700;
    }
    .chip {
      border: 1px solid var(--border);
      background: var(--bg-elev);
      color: #cbd5e1;
      padding: 5px 11px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 500;
      transition: all 0.14s ease;
    }
    .chip:hover { background: var(--bg-hover); color: #fff; }
    .chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #082f49;
      font-weight: 700;
    }

    /* Section & Drill Deck Controls */
    .deck-nav-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-bottom: 16px;
    }
    .nav-btn {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 15px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.14s ease;
    }
    .nav-btn:hover:not(:disabled) {
      background: var(--bg-hover);
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .nav-btn.primary {
      background: linear-gradient(135deg, #0284c7, #0ea5e9);
      border-color: #38bdf8;
      color: #fff;
    }
    .nav-btn.success {
      background: linear-gradient(135deg, #059669, #10b981);
      border-color: #34d399;
      color: #fff;
    }
    .nav-btn.danger {
      background: var(--red-soft);
      border-color: rgba(239, 68, 68, 0.5);
      color: #fca5a5;
    }

    .deck-position {
      text-align: center;
      flex: 1;
      min-width: 220px;
    }
    .deck-position .section-kicker {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      font-weight: 700;
    }
    .deck-position .counter {
      font-size: 0.92rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .dots-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
    }
    .dot-btn {
      width: 26px;
      height: 22px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-elev);
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
    }
    .dot-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #082f49;
    }
    .dot-btn.done {
      border-color: var(--green);
      color: #6ee7b7;
    }
    .dot-btn.active.done {
      background: var(--green);
      color: #052e16;
    }

    /* Drill Stage Grid */
    .drill-stage {
      display: grid;
      grid-template-columns: 1.02fr 1.18fr;
      gap: 18px;
      align-items: start;
    }
    @media (max-width: 960px) {
      .drill-stage { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
    }

    /* Video / Visual Box */
    .media-frame {
      position: relative;
      background: #070c17;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 16 / 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .media-frame video,
    .media-frame iframe {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border: 0;
      background: #000;
    }
    .video-missing {
      width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 6px; padding: 14px; text-align: center; color: var(--muted); font-size: 0.86rem;
    }
    .video-missing code { color: var(--text); }
    .diagram-box {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px;
      text-align: center;
      background: radial-gradient(circle at 50% 35%, #162544 0%, #070c17 75%);
    }
    .diagram-box svg {
      width: 100%;
      max-height: 220px;
    }
    .diagram-caption {
      margin-top: 8px;
      font-size: 0.85rem;
      color: #bae6fd;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 6px 12px;
      border-radius: 8px;
    }

    .media-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      align-items: center;
      justify-content: space-between;
    }
    .media-toolbar-left,
    .media-toolbar-right {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .btn-sm {
      padding: 6px 11px;
      font-size: 0.8rem;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--bg-elev);
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
    }
    .btn-sm:hover { background: var(--bg-hover); border-color: var(--accent); }
    .btn-sm.active { background: var(--accent-soft); border-color: var(--accent); color: #7dd3fc; }

    /* Meta Tags */
    .drill-header h2 {
      margin: 6px 0 8px;
      font-size: 1.42rem;
      line-height: 1.25;
    }
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 10px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 600;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      color: #cbd5e1;
    }
    .badge.real { background: var(--green-soft); border-color: rgba(16, 185, 129, 0.45); color: #6ee7b7; }
    .badge.almost { background: var(--indigo-soft); border-color: rgba(129, 140, 248, 0.45); color: #c7d2fe; }
    .badge.sore { background: var(--amber-soft); border-color: rgba(245, 158, 11, 0.45); color: #fde68a; }

    /* Info Sections inside Right Column */
    .info-block {
      margin-top: 14px;
      padding: 13px 15px;
      border-radius: 10px;
      background: rgba(30, 41, 59, 0.55);
      border: 1px solid var(--border);
    }
    .info-block h3 {
      margin: 0 0 8px;
      font-size: 0.92rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .info-block p { margin: 0; font-size: 0.94rem; color: #e2e8f0; }
    .steps-list {
      margin: 0;
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      font-size: 0.93rem;
      color: #e2e8f0;
    }

    .checkpoint-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 600px) {
      .checkpoint-grid { grid-template-columns: 1fr; }
    }
    .cp-card {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.87rem;
    }
    .cp-card strong { color: #7dd3fc; display: block; margin-bottom: 3px; }

    .mode-adapt-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .mode-box {
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      font-size: 0.88rem;
    }
    .mode-box.highlighted {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.25);
    }
    .mode-box.highlighted.real { border-color: var(--green); background: var(--green-soft); }
    .mode-box.highlighted.almost { border-color: var(--indigo); background: var(--indigo-soft); }
    .mode-box.highlighted.sore { border-color: var(--amber); background: var(--amber-soft); }
    .mode-box strong { display: block; margin-bottom: 2px; }

    .feel-notes-area {
      width: 100%;
      min-height: 70px;
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 11px;
      resize: vertical;
      font-size: 0.9rem;
    }
    .feel-notes-area:focus,
    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid var(--accent);
      border-color: transparent;
    }

    /* Routine Browser View */
    .routine-section-group {
      margin-bottom: 22px;
    }
    .routine-section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0 0 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
      font-size: 1.06rem;
      color: #bae6fd;
    }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 14px;
    }
    .drill-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.14s ease, border-color 0.14s ease;
    }
    .drill-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }
    .drill-card h4 { margin: 0; font-size: 1.02rem; }
    .drill-card p { margin: 0; font-size: 0.85rem; color: var(--muted); }

    /* Goals & Delivery Tracker View */
    .tracker-top-grid {
      display: grid;
      grid-template-columns: 1.05fr 1.35fr;
      gap: 18px;
      margin-bottom: 18px;
    }
    @media (max-width: 960px) {
      .tracker-top-grid { grid-template-columns: 1fr; }
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    @media (max-width: 720px) {
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .kpi-card {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
    }
    .kpi-card .label { font-size: 0.76rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .kpi-card .val { font-size: 1.55rem; font-weight: 800; margin-top: 2px; }
    .kpi-card .sub { font-size: 0.78rem; color: var(--muted); }

    .status-btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 10px 0 12px;
    }
    .status-btn {
      padding: 10px 12px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--bg-elev);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.86rem;
      text-align: left;
      transition: all 0.14s ease;
    }
    .status-btn:hover { border-color: var(--accent); }
    .status-btn.selected.met { background: var(--green-soft); border-color: var(--green); color: #6ee7b7; }
    .status-btn.selected.partial { background: var(--amber-soft); border-color: var(--amber); color: #fde68a; }
    .status-btn.selected.recovery { background: var(--accent-soft); border-color: var(--accent); color: #bae6fd; }
    .status-btn.selected.missed { background: var(--red-soft); border-color: var(--red); color: #fca5a5; }

    .rating-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin: 8px 0 12px;
    }
    .rate-pill {
      width: 34px;
      height: 32px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--bg-elev);
      cursor: pointer;
      font-weight: 700;
    }
    .rate-pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #082f49;
    }

    .chart-wrap {
      background: #0b1324;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      overflow-x: auto;
    }
    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 8px;
    }
    .legend-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 3px;
      margin-right: 5px;
      vertical-align: middle;
    }

    .heatmap-grid {
      display: grid;
      grid-template-columns: repeat(13, minmax(16px, 1fr));
      gap: 5px;
      margin-top: 10px;
    }
    .hm-col {
      display: grid;
      grid-template-rows: repeat(7, 16px);
      gap: 5px;
    }
    .hm-cell {
      width: 100%;
      height: 16px;
      border-radius: 4px;
      border: 1px solid rgba(148, 163, 184, 0.16);
      background: #172033;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .hm-cell:hover { transform: scale(1.2); border-color: #fff; }
    .hm-cell.met { background: #10b981; }
    .hm-cell.recovery { background: #38bdf8; }
    .hm-cell.partial { background: #f59e0b; }
    .hm-cell.missed { background: #ef4444; opacity: 0.78; }
    .hm-cell.selected { box-shadow: 0 0 0 2px #fff; }

    /* Goals List */
    .goal-card {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .goal-head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .progress-track {
      width: 100%;
      height: 10px;
      background: #0b1120;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
      margin: 8px 0;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #0ea5e9, #10b981);
      transition: width 0.25s ease;
    }

    /* Forms */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    @media (max-width: 760px) {
      .form-grid { grid-template-columns: 1fr; }
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .field label {
      font-size: 0.82rem;
      font-weight: 600;
      color: #cbd5e1;
    }
    .field input,
    .field select,
    .field textarea {
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.9rem;
    }

    .kbd-hint {
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    kbd {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-bottom-width: 2px;
      border-radius: 5px;
      padding: 1px 6px;
      font-family: Consolas, monospace;
      font-size: 0.76rem;
      color: #e2e8f0;
    }

    .hidden { display: none !important; }

    /* Subtle swing cue animation in SVG fallback */
    @keyframes pulseArc {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    .svg-pulse { animation: pulseArc 2.4s ease-in-out infinite; }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #0f172a;
      border: 1px solid var(--green);
      color: #d1fae5;
      padding: 10px 16px;

<body>
  <div class="app-shell">

  <script>
    (function () {
      "use strict";

      const STORAGE_KEY = "simwatch_drills_hub_v1";

      function esc(str) {
        return String(str == null ? "" : str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function todayISO(offsetDays = 0) {
        const d = new Date();
        d.setHours(12, 0, 0, 0);
        d.setDate(d.getDate() + offsetDays);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }

      function shortDateLabel(iso) {
        const parts = iso.split("-");
        return parts.length === 3 ? `${Number(parts[1])}/${Number(parts[2])}` : iso;
      }

      function showToast(msg) {
        const el = document.getElementById("toastEl");
        el.textContent = msg;
        el.classList.remove("has-action");
        el.classList.add("show");
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => el.classList.remove("show"), msg.length > 60 ? 5000 : 2400);
      }

      // Toast with an Undo button for destructive actions (stays up ~7s).
      function showUndoToast(msg, undoFn) {
        const el = document.getElementById("toastEl");
        el.textContent = msg;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "toast-undo";
        btn.textContent = "Undo";
        btn.onclick = () => {
          clearTimeout(showToast._t);

        showToast._t = setTimeout(() => el.classList.remove("show", "has-action"), 7000);

      // Numeric default that keeps a legitimate 0 (unlike `v || def`).
      function numOr(v, def) { return typeof v === "number" && isFinite(v) ? v : def; }

      const DEFAULTS = window.DEFAULT_DRILLS_DATA || { modes: [], routines: [], drills: [], goals: [] };

      
      function stableStr(v) {
        if (Array.isArray(v)) return "[" + v.map(stableStr).join(",") + "]";
        if (v && typeof v === "object") {
          return "{" + Object.keys(v).sort().filter((k) => k !== "userEdited" && k !== "custom").map((k) => JSON.stringify(k) + ":" + stableStr(v[k])).join(",") + "}";
        }
        return JSON.stringify(v === undefined ? null : v);
      }

      // Merge semantics: drills saved via the editor carry userEdited:true and are kept verbatim.
      // Untouched default drills always take the current default data. Tombstoned default ids stay deleted.
      // Legacy saves (no userEdited flag) are migrated: a saved default drill that differs from the
      // default (as the old merge would have shown it) is treated as user-edited.
      function mergeDrills(savedDrills, deletedIds) {
        const defaults = JSON.parse(JSON.stringify(DEFAULTS.drills || []));
        const deleted = new Set(Array.isArray(deletedIds) ? deletedIds : []);
        if (!Array.isArray(savedDrills) || !savedDrills.length) {
          return defaults.filter((d) => !deleted.has(d.id));
        }
        const savedMap = new Map();
        for (const s of savedDrills) if (s && s.id) savedMap.set(s.id, s);
        const defaultIds = new Set(defaults.map((d) => d.id));
        const merged = [];
        for (const d of defaults) {
          if (deleted.has(d.id)) continue;
          const s = savedMap.get(d.id);
          if (!s) { merged.push(d); continue; }
          let edited = s.userEdited === true;
          if (s.userEdited === undefined) {
            const legacy = Object.assign({}, d, s, {
              hackmotion: d.hackmotion || s.hackmotion,
              days: d.days || s.days,
              modes: d.modes || s.modes
            });
            edited = stableStr(legacy) !== stableStr(d);
          }
          if (edited) {
            const keep = JSON.parse(JSON.stringify(s));
            keep.userEdited = true;
            // Older edited copies predate `target`: inherit the default's scoring target.
            if (keep.target === undefined && d.target) keep.target = JSON.parse(JSON.stringify(d.target));
            delete keep.custom;
            merged.push(keep);
          } else {
            merged.push(d);
          }
        }
        for (const s of savedDrills) {
          if (s && s.id && !defaultIds.has(s.id)) {
            merged.push(Object.assign({ custom: true }, s));
          }
        }
        return merged;
      }

      function mergeBagMatrix(savedBag) {
        const defaults = JSON.parse(JSON.stringify(DEFAULTS.bagMatrix || []));
        if (!Array.isArray(savedBag) || !savedBag.length) return defaults;
        const savedMap = new Map(savedBag.map((b) => [b.id || b.club, b]));
        const merged = defaults.map((d) => {
          const s = savedMap.get(d.id || d.club);
          return s ? Object.assign({}, d, s) : d;
        });
        // Keep user-added clubs that are not in the defaults.
        const defaultKeys = new Set(defaults.map((d) => d.id || d.club));
        const extras = savedBag.filter((b) => b && (b.id || b.club) && !defaultKeys.has(b.id || b.club));
        return merged.concat(extras.map((b) => Object.assign({ custom: true }, b)));
      }

      // Goals: default goals always present (so new defaults reach returning users) unless the user
      // deleted them (deletedGoalIds tombstones). User-editable fields (progress, notes) overlay the
      // default; user-added goals are appended.
      function mergeGoals(savedGoals, deletedIds) {
        const defaults = JSON.parse(JSON.stringify(DEFAULTS.goals || []));
        const deleted = new Set(Array.isArray(deletedIds) ? deletedIds : []);
        const saved = Array.isArray(savedGoals) ? savedGoals.filter((g) => g && typeof g === "object") : [];
        const savedMap = new Map(saved.filter((g) => g.id).map((g) => [g.id, g]));
        const defaultIds = new Set(defaults.map((g) => g.id));
        const merged = [];
        for (const d of defaults) {
          if (deleted.has(d.id)) continue;
          const s = savedMap.get(d.id);
          if (!s) { merged.push(d); continue; }
          merged.push(Object.assign({}, d, {
            progress: typeof s.progress === "number" && isFinite(s.progress) ? s.progress : d.progress,
            notes: typeof s.notes === "string" ? s.notes : d.notes
          }));
        }
        for (const s of saved) {
          if (!s.id || !defaultIds.has(s.id)) merged.push(s);
        }
        return merged;
      }

      function mergeCourses(savedCourses) {
        const defaults = JSON.parse(JSON.stringify(DEFAULTS.courses || []));
        if (!Array.isArray(savedCourses) || !savedCourses.length) {
          return defaults.map((c) => Object.assign({ userNotes: "" }, c));
        }
        const savedMap = new Map(savedCourses.map((c) => [c.id, c]));
        const seen = new Set();
        const merged = defaults.map((c) => {
          seen.add(c.id);
          const s = savedMap.get(c.id);
          if (!s) return Object.assign({ userNotes: "" }, c);
          return Object.assign({}, c, {
            favorite: typeof s.favorite === "boolean" ? s.favorite : c.favorite,
            rating: typeof s.rating === "number" ? s.rating : c.rating,
            userNotes: typeof s.userNotes === "string" ? s.userNotes : ""
          });
        });
        for (const s of savedCourses) {
          if (s && s.id && !seen.has(s.id)) {
            merged.push(Object.assign({ userNotes: "", custom: true }, s));
          }
        }
        return merged;
      }

      // ---- Saved-state migration + validation for mat-mode sessions (schema v3). Function declarations
      // only (no consts) because loadState() runs before the SESSION section below is evaluated.
      function migrateSavedState(saved) {
        if (!saved || typeof saved !== "object" || Array.isArray(saved)) return {};
        const from = typeof saved.schemaVersion === "number" ? saved.schemaVersion : 1;
        if (from < 3) {
          // v1/v2 -> v3: mat-mode history did not exist yet; start empty.
          saved.sessions = [];
          saved.sessionPrefs = null;
          saved.activeSession = null;
        }
        return saved;
      }
      // ---- Swing Checklist sanitizers (function declarations: loadState() runs before the checklist section) ----
      function clStrIds(v) {
        return Array.isArray(v) ? Array.from(new Set(v.filter((x) => typeof x === "string" && x && x.length <= 80))) : null;
      }
      function sanitizeChecklistLog(v) {
        const out = {};
        if (!v || typeof v !== "object" || Array.isArray(v)) return out;
        for (const [k, arr] of Object.entries(v)) {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) continue;
          const ids = clStrIds(arr);
          if (ids && ids.length) out[k] = ids;
        }
        return out;
      }
      function sanitizeChecklistCustom(v) {
        if (!Array.isArray(v)) return [];
        const sc = DEFAULTS.swingChecklist || {};
        const phases = (sc.phases || []).map((p) => p.id);
        const builtIn = new Set((sc.items || []).map((i) => i.id));
        const seen = new Set();
        const out = [];
        for (const it of v) {
          if (!it || typeof it !== "object" || Array.isArray(it)) continue;
          const id = typeof it.id === "string" ? it.id.trim().slice(0, 80) : "";
          const title = typeof it.title === "string" ? it.title.trim().slice(0, 120) : "";
          if (!id || !title || seen.has(id) || builtIn.has(id)) continue;
          seen.add(id);
          out.push({
            id, title,
            phase: phases.includes(it.phase) ? it.phase : (phases[0] || ""),
            cue: typeof it.cue === "string" ? it.cue.trim().slice(0, 400) : ""
          });
        }
        return out.slice(0, 200);
      }
      function sanitizeSessionTarget(t) {
        if (!t || typeof t !== "object" || Array.isArray(t)) return null;
        if (!/^(hla|carry|ball_speed|face|path|spin_axis|aoa|manual)$/.test(String(t.metric))) return null;
        const n = (v) => (typeof v === "number" && isFinite(v) ? v : null);
        const out = { metric: t.metric, goal: n(t.goal), tol: n(t.tol), reps: n(t.reps), pass: n(t.pass) };
        if (typeof t.club === "string") out.club = t.club.slice(0, 40);
        if (t.foam === true) out.foam = true;
        return out;
      }
      function sanitizeSessionBlock(b) {
        if (!b || typeof b !== "object" || typeof b.drillId !== "string" || !b.drillId) return null;
        const reps = (Array.isArray(b.reps) ? b.reps : []).filter((r) => r && typeof r === "object").slice(0, 1000).map((r) => {
          const rep = {
            ok: r.ok === true ? true : r.ok === false ? false : null,
            value: typeof r.value === "number" && isFinite(r.value) ? r.value : null,
            ts: typeof r.ts === "string" ? r.ts : ""
          };
          if (typeof r.shotTs === "string" && r.shotTs) rep.shotTs = r.shotTs;
          return rep;
        });
        const num = (v, d) => (typeof v === "number" && isFinite(v) ? v : d);
        return {
          drillId: b.drillId,
          target: sanitizeSessionTarget(b.target),
          repGoal: num(b.repGoal, null),
          planMin: num(b.planMin, null),
          secs: Math.max(0, num(b.secs, 0)),
          done: b.done === true,

      }
      function sanitizeSessions(arr) {
        if (!Array.isArray(arr)) return [];
        const out = [];
        for (const s of arr) {
          if (!s || typeof s !== "object" || typeof s.id !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(String(s.date))) continue;
          const blocks = (Array.isArray(s.blocks) ? s.blocks : []).map(sanitizeSessionBlock).filter(Boolean);
          out.push({
            id: s.id,
            date: s.date,
            mode: /^(real|almost|sore)$/.test(String(s.mode)) ? s.mode : "real",
            minutes: typeof s.minutes === "number" && isFinite(s.minutes) ? s.minutes : 30,
            routineId: typeof s.routineId === "string" ? s.routineId : null,
            startedAt: typeof s.startedAt === "string" ? s.startedAt : null,
            endedAt: typeof s.endedAt === "string" ? s.endedAt : null,
            savedToLog: s.savedToLog === true,
            blocks

      }
      function sanitizeSessionPrefs(p) {
        const out = { mode: null, minutes: 30 };
        if (p && typeof p === "object") {
          if (/^(real|almost|sore)$/.test(String(p.mode))) out.mode = p.mode;
          if ([20, 30, 45].includes(p.minutes)) out.minutes = p.minutes;
        }
        return out;
      }
      function sanitizeActiveSession(a) {
        if (!a || typeof a !== "object") return null;
        const s = sanitizeSessions([a])[0];
        if (!s || !s.blocks.length) return null;
        s.idx = typeof a.idx === "number" && a.idx >= 0 && a.idx < s.blocks.length ? Math.floor(a.idx) : 0;
        return s;
      }

      function loadState() {
        const base = {
          activeView: "deck",
          activeMode: "all",       // "all" | "real" | "almost" | "sore"
          activeRoutine: "all",    // "all" | routine id
          activeSection: "all",    // "all" | section name
          selectedDrillId: (DEFAULTS.drills[0] && DEFAULTS.drills[0].id) || null,
          selectedLogDate: todayISO(0),

          deletedDrillIds: [],
          deletedGoalIds: [],

          drillNotes: {},          // { drillId: "custom feel notes" }
          courses: mergeCourses(null),

          courseCategoryFilter: "all",

          checklistFocusIds: clStrIds((DEFAULTS.swingChecklist || {}).defaultFocusIds) || [], // My Focus stars; seeded from defaults once

        try {

            base.sessionPrefs = sanitizeSessionPrefs(saved.sessionPrefs);
            base.activeSession = sanitizeActiveSession(saved.activeSession);
            if (Array.isArray(saved.checklistFocusIds)) base.checklistFocusIds = clStrIds(saved.checklistFocusIds); // [] = user un-starred everything
            base.checklistLog = sanitizeChecklistLog(saved.checklistLog);
            base.checklistCustomItems = sanitizeChecklistCustom(saved.checklistCustomItems);
            if (typeof saved.checklistFocusOnly === "boolean") base.checklistFocusOnly = saved.checklistFocusOnly;
            if (Array.isArray(saved.drills) && saved.drills.length) base.drills = saved.drills;
            if (Array.isArray(saved.deletedDrillIds)) base.deletedDrillIds = saved.deletedDrillIds.filter((x) => typeof x === "string");
            if (typeof saved.lastBackupAt === "string") base.lastBackupAt = saved.lastBackupAt;
            if (Array.isArray(saved.deletedGoalIds)) base.deletedGoalIds = saved.deletedGoalIds.filter((x) => typeof x === "string");
            if (Array.isArray(saved.goals)) base.goals = mergeGoals(saved.goals, base.deletedGoalIds);
            if (saved.deliveryLogs && typeof saved.deliveryLogs === "object") base.deliveryLogs = saved.deliveryLogs;
            if (saved.drillNotes && typeof saved.drillNotes === "object") base.drillNotes = saved.drillNotes;
            if (Array.isArray(saved.courses)) base.courses = mergeCourses(saved.courses);
            if (Array.isArray(saved.roundLogs)) base.roundLogs = saved.roundLogs;
            if (saved.activeMode) base.activeMode = saved.activeMode;
            if (saved.activeRoutine) base.activeRoutine = saved.activeRoutine;
            if (saved.activeSection) base.activeSection = saved.activeSection;
            if (saved.selectedDrillId) base.selectedDrillId = saved.selectedDrillId;
            if (Array.isArray(saved.bagMatrix)) base.bagMatrix = mergeBagMatrix(saved.bagMatrix);
            if (saved.cadencePresetId) base.cadencePresetId = saved.cadencePresetId;
            if (typeof saved.cadenceDelaySec === "number") base.cadenceDelaySec = saved.cadenceDelaySec;
            if (typeof saved.cadenceVolume === "number") base.cadenceVolume = saved.cadenceVolume;
            if (typeof saved.simTemp === "number") base.simTemp = saved.simTemp;
            if (typeof saved.simAltitude === "number") base.simAltitude = saved.simAltitude;
          }
          base.drills = mergeDrills(base.drills, base.deletedDrillIds);
          if (!base.bagMatrix) base.bagMatrix = mergeBagMatrix(null);
          if (!base.cadencePresetId) base.cadencePresetId = "24-8";
          if (typeof base.cadenceDelaySec !== "number") base.cadenceDelaySec = 2.5;
          if (typeof base.cadenceVolume !== "number") base.cadenceVolume = 0.7;
          if (typeof base.simTemp !== "number") base.simTemp = 70;

      const state = loadState();
      const sessionObjectUrls = {}; // Ephemeral blob URLs picked during this browser tab session

      
      // --- WEB AUDIO API ENGINE (TOUR TEMPO CADENCE & HACKMOTION BIOFEEDBACK) ---
      let audioCtx = null;
      function getAudioContext() {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;

      const activeOscillators = new Set();
      function playToneAt(freq, durationSec, type = "sine", gainVal = 0.3, when = 0) {
        try {
          const ctx = getAudioContext();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const t0 = Math.max(when || 0, ctx.currentTime);
          osc.type = type;
          osc.frequency.setValueAtTime(freq, t0);
          gain.gain.setValueAtTime(gainVal * (numOr(state.cadenceVolume, 0.7)), t0);
          gain.gain.exponentialRampToValueAtTime(0.0001, t0 + durationSec);
          osc.connect(gain);
          gain.connect(ctx.destination);
          activeOscillators.add(osc);
          osc.onended = () => {
            activeOscillators.delete(osc);
            try { osc.disconnect(); gain.disconnect(); } catch (e) { /* ignore */ }
          };
          osc.start(t0);
          osc.stop(t0 + durationSec + 0.02);
        } catch (err) {
          console.warn("Audio error:", err);
        }

      function playTone(freq, durationSec, type = "sine", gainVal = 0.3) {

      }

      function playHackMotionTone(isInZone = true) {
        if (isInZone) {
          const ctx = getAudioContext();
          const t = ctx ? ctx.currentTime : 0;
          playToneAt(660, 0.22, "triangle", 0.35, t);
          playToneAt(880, 0.30, "sine", 0.40, t + 0.09);

        }
      }

      const cadenceState = {

        schedTimer: null,

      function updateCadenceUI(phase) {
        cadenceState.currentPhase = phase;

        const phaseLabel = document.getElementById("tempoOrbPhase");
        if (orb && phaseLabel) {
          orb.className = `tempo-orb phase-${phase}`;
          const labels = {
            ready: "WAITING...",
            takeaway: "1. TAKEAWAY",
            top: "2. TOP PAUSE",
            impact: "3. IMPACT!"
          };

        }

          btnTopbar.classList.toggle("playing", cadenceState.isPlaying);

      }

        return {
          backSec: numOr(preset.backSec, 0.8),
          downSec: numOr(preset.downSec, 0.27),
          delaySec: numOr(state.cadenceDelaySec, 2.5)

      }

      // Schedule one full swing cycle (3 tones + visual events) at absolute audio time t. Returns cycle length.
      function scheduleCadenceCycle(t) {
        const { backSec, downSec, delaySec } = getCadenceTiming();
        playToneAt(520, 0.12, "sine", 0.4, t);
        playToneAt(680, 0.12, "sine", 0.45, t + backSec);
        playToneAt(880, 0.18, "triangle", 0.55, t + backSec + downSec);

          { t, phase: "takeaway" },
          { t: t + backSec, phase: "top" },
          { t: t + backSec + downSec, phase: "impact", rep: true },

      function drainCadenceEvents() {

        let repsAdded = false;
        while (cadenceState.events.length && cadenceState.events[0].t <= now) {
          const ev = cadenceState.events.shift();
          lastPhase = ev.phase;
          if (ev.rep) { cadenceState.repCount++; repsAdded = true; }

        if (lastPhase) updateCadenceUI(lastPhase);
        if (repsAdded) {

          if (repEl) repEl.textContent = cadenceState.repCount;

      function cadenceSchedulerTick() {

        }
        drainCadenceEvents();
      }

      function cadenceFrame() {

      }

      function startCadenceMetronome() {

        cadenceState.nextCycleTime = ctx.currentTime + 0.1;

        cadenceState.schedTimer = setInterval(cadenceSchedulerTick, 25);
        cadenceState.rafId = requestAnimationFrame(cadenceFrame);
        const startedPreset = (DEFAULTS.cadencePresets || []).find((p) => p.id === state.cadencePresetId);
        showToast(`⏱️ Cadence metronome started${startedPreset && startedPreset.name ? ` (${startedPreset.name})` : ""}`);
        renderHeader();

        enhanceA11y();
      }

      function stopCadenceMetronome() {

        cadenceState.rafId = null;
        cadenceState.events = [];

          try { osc.onended = null; osc.stop(0); osc.disconnect(); } catch (e) { /* already stopped */ }
        }
        activeOscillators.clear();
        updateCadenceUI("ready");
        showToast("⏱️ Cadence Metronome Stopped");
        renderHeader();
        if (state.activeView === "cadence") renderCadence();
        enhanceA11y();
      }

      function toggleCadenceMetronome() {

      function saveState() {
        try {

      // ---- Persistent video shorts (File System Access API + IndexedDB handles) ----
      const FS_DIR_SUPPORTED = typeof window.showDirectoryPicker === "function";
      const FS_FILE_SUPPORTED = typeof window.showOpenFilePicker === "function";
      const shortsStore = { dir: null, dirName: "", perm: "none", tried: {}, missing: {} };

      function idbOpen() {
        return new Promise((resolve, reject) => {
          if (!window.indexedDB) { reject(new Error("no indexedDB")); return; }
          const req = indexedDB.open("simwatch_drills_hub_handles", 1);
          req.onupgradeneeded = () => req.result.createObjectStore("handles");
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }
      function idbOp(mode, fn) {
        return idbOpen().then((db) => new Promise((resolve, reject) => {
          const tx = db.transaction("handles", mode);
          const r = fn(tx.objectStore("handles"));
          tx.oncomplete = () => { db.close(); resolve(r && r.result); };
          tx.onerror = () => { db.close(); reject(tx.error); };
        }));
      }
      const idbGet = (k) => idbOp("readonly", (st) => st.get(k)).catch(() => undefined);
      const idbSet = (k, v) => idbOp("readwrite", (st) => st.put(v, k)).catch(() => undefined);

      function shortFileName(drill) {
        const raw = ((drill.video && drill.video.localPath) || "").trim();
        const base = raw && raw !== "shorts/" ? raw.split(/[\\/]/).pop() : "";
        return base || (drill.id + ".mp4");
      }

      async function refreshShortsPermission() {
        if (!shortsStore.dir) { shortsStore.perm = "none"; return; }
        try { shortsStore.perm = await shortsStore.dir.queryPermission({ mode: "read" }); }
        catch (e) { shortsStore.perm = "prompt"; }
      }

      async function loadShortsHandles() {
        if (!FS_DIR_SUPPORTED) return;
        const dir = await idbGet("shortsDir");
        if (dir) {
          shortsStore.dir = dir;
          shortsStore.dirName = dir.name || "";
          await refreshShortsPermission();
          if (state.activeView === "deck") renderDeck();
        }
      }

      // Try to resolve a playable blob URL for this drill from a stored file handle or the linked folder.
      async function ensureShortUrl(drill) {
        if (sessionObjectUrls[drill.id]) return true;
        const name = shortFileName(drill);
        try {
          const fh = await idbGet("file:" + drill.id);
          if (fh && (await fh.queryPermission({ mode: "read" })) === "granted") {
            sessionObjectUrls[drill.id] = URL.createObjectURL(await fh.getFile());
            return true;
          }
        } catch (e) { /* fall through to folder */ }
        if (shortsStore.dir && shortsStore.perm === "granted") {
          try {
            const fh = await shortsStore.dir.getFileHandle(name);
            sessionObjectUrls[drill.id] = URL.createObjectURL(await fh.getFile());
            return true;
          } catch (e) { shortsStore.missing[drill.id] = true; }
        }
        return false;
      }

      async function linkShortsFolder() {
        try {
          const dir = await window.showDirectoryPicker({ id: "simwatch-shorts", mode: "read" });
          shortsStore.dir = dir;
          shortsStore.dirName = dir.name || "";
          shortsStore.perm = "granted";
          shortsStore.tried = {};
          shortsStore.missing = {};
          for (const k of Object.keys(sessionObjectUrls)) { try { URL.revokeObjectURL(sessionObjectUrls[k]); } catch (e) { /* ignore */ } delete sessionObjectUrls[k]; }
          await idbSet("shortsDir", dir);
          showToast(`Linked shorts folder "${dir.name}" - it will be remembered.`);
          renderAll();
        } catch (err) {
          if (err && err.name !== "AbortError") showToast("Could not link folder: " + (err.message || err.name));
        }
      }

      async function reconnectShortsFolder() {
        try {
          const res = await shortsStore.dir.requestPermission({ mode: "read" });
          shortsStore.perm = res;
          shortsStore.tried = {};
          shortsStore.missing = {};
          if (res === "granted") showToast("Shorts folder reconnected.");
          else showToast("Permission not granted for the shorts folder.");
          renderAll();
        } catch (err) {
          showToast("Could not reconnect folder: " + (err.message || err.name));
        }
      }

      // ---- Backup / import helpers ----
      const SCHEMA_VERSION = 4; // v3: sessions / sessionPrefs / activeSession (mat mode); v4: swing checklist (all additive)
      function buildPersistObject() {
        return {
          schemaVersion: SCHEMA_VERSION,
          sessions: state.sessions,
          sessionPrefs: state.sessionPrefs,
          activeSession: state.activeSession,
          checklistFocusIds: state.checklistFocusIds,
          checklistLog: state.checklistLog,
          checklistCustomItems: state.checklistCustomItems,
          checklistFocusOnly: state.checklistFocusOnly,
          activeMode: state.activeMode,
          activeRoutine: state.activeRoutine,
          activeSection: state.activeSection,
          selectedDrillId: state.selectedDrillId,
          drills: state.drills,
          deletedDrillIds: state.deletedDrillIds,
          deletedGoalIds: state.deletedGoalIds,
          lastBackupAt: state.lastBackupAt,
          goals: state.goals,
          deliveryLogs: state.deliveryLogs,
          drillNotes: state.drillNotes,
          courses: state.courses,
          roundLogs: state.roundLogs,
          bagMatrix: state.bagMatrix,
          cadencePresetId: state.cadencePresetId,
          cadenceDelaySec: state.cadenceDelaySec,
          cadenceVolume: state.cadenceVolume,
          simTemp: state.simTemp,
          simAltitude: state.simAltitude
        };
      }

      function isPlainObj(v) { return v && typeof v === "object" && !Array.isArray(v); }

      // Returns a human summary string, or null if the file has nothing recognizable.
      function applyImportedBackup(parsed) {
        if (!isPlainObj(parsed)) return null;
        const parts = [];
        const objs = (arr, test) => (Array.isArray(arr) ? arr.filter((x) => isPlainObj(x) && test(x)) : null);
        const str = (v) => typeof v === "string" && v.length > 0;
        const drills = objs(parsed.drills, (d) => str(d.id) && str(d.title));
        const tomb = Array.isArray(parsed.deletedDrillIds) ? parsed.deletedDrillIds.filter(str) : null;
        if (tomb) state.deletedDrillIds = tomb;
        const goalTomb = Array.isArray(parsed.deletedGoalIds) ? parsed.deletedGoalIds.filter(str) : null;
        if (goalTomb) state.deletedGoalIds = goalTomb;
        if (drills) {
          for (const d of drills) {
            if (!Array.isArray(d.days)) d.days = ["daily-calibration"];
            if (!Array.isArray(d.modes)) d.modes = ["real"];
            if (!Array.isArray(d.instructions)) d.instructions = [];
            if (!Array.isArray(d.clubs)) d.clubs = [];
          }
          state.drills = mergeDrills(drills, state.deletedDrillIds);
          if (!state.drills.length) state.drills = mergeDrills(null, []);
          if (!state.drills.some((d) => d.id === state.selectedDrillId)) state.selectedDrillId = state.drills[0] && state.drills[0].id;
          parts.push(`${drills.length} drills`);
        } else if (tomb) {
          // Tombstones alone still need to be applied to the current drill list.
          state.drills = mergeDrills(state.drills, state.deletedDrillIds);
          if (!state.drills.some((d) => d.id === state.selectedDrillId)) state.selectedDrillId = state.drills[0] && state.drills[0].id;
          parts.push(`${tomb.length} deleted-drill markers`);
        }
        const goals = objs(parsed.goals, () => true);
        if (goals) { state.goals = mergeGoals(goals, state.deletedGoalIds); parts.push(`${goals.length} goals`); }
        else if (goalTomb) state.goals = mergeGoals(state.goals, state.deletedGoalIds);
        if (isPlainObj(parsed.deliveryLogs)) {
          const logs = {};
          for (const [k, v] of Object.entries(parsed.deliveryLogs)) {
            if (/^\d{4}-\d{2}-\d{2}$/.test(k) && isPlainObj(v)) {
              if (!Array.isArray(v.completedDrills)) v.completedDrills = [];
              logs[k] = v;
            }
          }
          state.deliveryLogs = logs;
          parts.push(`${Object.keys(logs).length} log days`);
        }
        if (isPlainObj(parsed.drillNotes)) {
          const notes = {};
          for (const [k, v] of Object.entries(parsed.drillNotes)) if (typeof v === "string") notes[k] = v;
          state.drillNotes = notes;
        }
        const courses = objs(parsed.courses, (c) => str(c.id) && str(c.name));
        if (courses) { state.courses = mergeCourses(courses); parts.push(`${courses.length} courses`); }
        const rounds = objs(parsed.roundLogs, () => true);
        if (rounds) { state.roundLogs = rounds; parts.push(`${rounds.length} rounds`); }
        if (Array.isArray(parsed.sessions)) {
          state.sessions = sanitizeSessions(parsed.sessions);
          parts.push(`${state.sessions.length} mat sessions`);
        }
        if (isPlainObj(parsed.sessionPrefs)) state.sessionPrefs = sanitizeSessionPrefs(parsed.sessionPrefs);
        if (Array.isArray(parsed.checklistCustomItems)) {
          state.checklistCustomItems = sanitizeChecklistCustom(parsed.checklistCustomItems);
          parts.push(`${state.checklistCustomItems.length} custom checklist items`);
        }
        if (Array.isArray(parsed.checklistFocusIds)) {
          state.checklistFocusIds = clStrIds(parsed.checklistFocusIds);
          parts.push(`${state.checklistFocusIds.length} focus items`);
        }
        if (isPlainObj(parsed.checklistLog)) {
          state.checklistLog = sanitizeChecklistLog(parsed.checklistLog);
          parts.push(`${Object.keys(state.checklistLog).length} checklist days`);
        }
        if (typeof parsed.checklistFocusOnly === "boolean") state.checklistFocusOnly = parsed.checklistFocusOnly;
        const bag = objs(parsed.bagMatrix, (b) => str(b.id) || str(b.club));
        if (bag && bag.length) { state.bagMatrix = mergeBagMatrix(bag); parts.push(`${bag.length} bag clubs`); }
        if (typeof parsed.cadencePresetId === "string") state.cadencePresetId = parsed.cadencePresetId;
        if (typeof parsed.cadenceDelaySec === "number" && isFinite(parsed.cadenceDelaySec)) state.cadenceDelaySec = parsed.cadenceDelaySec;
        if (typeof parsed.cadenceVolume === "number" && isFinite(parsed.cadenceVolume)) state.cadenceVolume = Math.max(0, Math.min(1, parsed.cadenceVolume));
        if (typeof parsed.simTemp === "number" && isFinite(parsed.simTemp)) state.simTemp = parsed.simTemp;
        if (typeof parsed.simAltitude === "number" && isFinite(parsed.simAltitude)) state.simAltitude = parsed.simAltitude;
        if (!parts.length && !drills && !tomb) {
          if (typeof parsed.cadencePresetId !== "string" && typeof parsed.simTemp !== "number") return null;
        }
        return parts.length ? parts.join(", ") : "settings only";
      }

      function hasUserData() {
        return state.drills.some((d) => d.userEdited || d.custom) ||
          (state.deletedDrillIds || []).length > 0 ||
          Object.keys(state.deliveryLogs || {}).length > 0 ||
          (state.roundLogs || []).length > 0 ||
          (state.sessions || []).length > 0 ||
          Object.keys(state.checklistLog || {}).length > 0 ||
          (state.checklistCustomItems || []).length > 0 ||

      function backupAgeDays() {
        if (!state.lastBackupAt) return null;
        const t = Date.parse(state.lastBackupAt);
        return isNaN(t) ? null : Math.floor((Date.now() - t) / 86400000);
      }
      function backupIsStale() {
        if (!hasUserData()) return false;
        const age = backupAgeDays();
        return age === null || age > 14;
      }
      function backupStatusText() {
        const age = backupAgeDays();
        if (age === null) return hasUserData() ? "No backup exported yet - export one to protect your data." : "No backup exported yet.";
        const when = new Date(state.lastBackupAt).toLocaleDateString();
        return `Last backup: ${when} (${age} day${age === 1 ? "" : "s"} ago)` + (backupIsStale() ? " - time for a fresh export." : "");

        return state.drills.filter((d) => {
          if (state.activeMode !== "all" && !(d.modes || []).includes(state.activeMode)) return false;
          if (state.activeRoutine !== "all" && !(d.days || []).includes(state.activeRoutine)) return false;
          if (!ignoreSection && state.activeSection !== "all" && d.section !== state.activeSection) return false;
          return true;

      function getAvailableSections() {
        const list = getFilteredDrills(true);
        const seen = new Set();
        const out = [];
        for (const d of list) {
          if (d.section && !seen.has(d.section)) {
            seen.add(d.section);
            out.push(d.section);

        return out;

      function parseYoutubeEmbedUrl(rawUrl) {
        const normalized = normalizeExternalUrl(rawUrl);
        if (!normalized) return null;
        try {
          const u = new URL(normalized);
          let id = "";
          if (u.hostname.includes("youtu.be")) {
            id = u.pathname.replace(/^\/+/, "").split(/[/?#]/)[0];
          } else if (u.pathname.includes("/shorts/")) {
            id = u.pathname.split("/shorts/")[1].split(/[/?#]/)[0];
          } else if (u.pathname.includes("/embed/")) {
            id = u.pathname.split("/embed/")[1].split(/[/?#]/)[0];
          } else if (u.pathname.includes("/live/")) {
            id = u.pathname.split("/live/")[1].split(/[/?#]/)[0];
          } else if (u.searchParams.get("v")) {
            id = u.searchParams.get("v");
          }
          if (!id) return null;
          return `https://www.youtube.com/embed/${encodeURIComponent(id)}?rel=0&playsinline=1`;
        } catch {
          return null;
        }
      }

      function computeDeliveryMetrics() {
        let streak = 0;
        let checkDate = todayISO(0);
        const isGood = (s) => s === "met" || s === "partial" || s === "recovery";
        if (!state.deliveryLogs[checkDate] || !isGood(state.deliveryLogs[checkDate].status)) {
          // Allow counting streak through yesterday if today isn't logged yet
          checkDate = todayISO(-1);
        }
        for (let i = 0; i < 365; i++) {
          const offset = checkDate === todayISO(0) ? -i : -(i + 1);
          const iso = todayISO(offset);
          const log = state.deliveryLogs[iso];
          if (log && isGood(log.status)) {
            streak += 1;
          } else {
            break;
          }
        }

        // Best streak
        const sortedDates = Object.keys(state.deliveryLogs).sort();
        let bestStreak = 0;
        let running = 0;
        let prevTime = null;
        for (const iso of sortedDates) {
          const log = state.deliveryLogs[iso];
          if (!isGood(log.status)) {
            running = 0;
            prevTime = null;
            continue;
          }
          const t = new Date(`${iso}T12:00:00`).getTime();
          if (prevTime !== null && Math.round((t - prevTime) / 86400000) === 1) {
            running += 1;
          } else {
            running = 1;
          }
          prevTime = t;
          if (running > bestStreak) bestStreak = running;
        }

        let last30Good = 0;
        let last30Logged = 0;
        const modeCounts = { real: 0, almost: 0, sore: 0 };
        for (let i = 0; i < 30; i++) {
          const log = state.deliveryLogs[todayISO(-i)];
          if (log && log.status) {
            last30Logged += 1;
            if (isGood(log.status)) {
              last30Good += 1;
              if (modeCounts[log.mode] !== undefined) modeCounts[log.mode] += 1;
            }
          }
        }
        return { streak, bestStreak, last30Good, last30Logged, modeCounts };
      }

      function renderHeader() {
        const metrics = computeDeliveryMetrics();
        const today = getDayLog(todayISO(0));
        const doneCount = today.completedDrills.length;
        const statusMap = {

            renderAll();
          };
        });

      function jumpDrill(delta) {
        const filtered = getFilteredDrills();
        if (!filtered.length) return;
        const cur = currentFilteredDrillIndex(filtered);
        const next = (cur + delta + filtered.length) % filtered.length;
        state.selectedDrillId = filtered[next].id;
        saveState();
        renderDeck();
      }

      function jumpSection(delta) {
        const sections = getAvailableSections();
        if (sections.length < 2) return;
        let curIdx = sections.indexOf(state.activeSection);
        if (curIdx < 0) {
          const filtered = getFilteredDrills();
          const curDrill = filtered[currentFilteredDrillIndex(filtered)];
          curIdx = curDrill ? sections.indexOf(curDrill.section) : 0;
        }
        if (curIdx < 0) curIdx = 0;
        const next = (curIdx + delta + sections.length) % sections.length;
        state.activeSection = sections[next];
        const filtered = getFilteredDrills();
        if (filtered.length) state.selectedDrillId = filtered[0].id;
        saveState();
        renderAll();
      }

                  ${cp.map((r) => `
                  <div class="cp-card" style="border-left: 3px solid ${r[2]};">

              <!-- BEST GSPRO COURSES FOR THIS DRILL -->
              ${(() => {
                const matchedCourses = (state.courses || [])
                  .filter((c) => Array.isArray(c.recommendedDrills) && c.recommendedDrills.includes(drill.id))
                  .sort((a, b) => (Number(Boolean(b.favorite)) - Number(Boolean(a.favorite))) || ((b.rating || 0) - (a.rating || 0)) || a.name.localeCompare(b.name))
                  .slice(0, 6);

                return `

                  ${(drill.modes || []).includes("sore") ? `<span class="badge sore">💪 Gym-Sore OK</span>` : ""}
                </div>
                <h2>${esc(drill.title)}</h2>
              </div>

              <div class="info-block">
                <h3>💡 The Why (Biomechanics &amp; Ball Flight)</h3>
                <p>${esc(drill.why)}</p>

              <div class="info-block">
                <h3>📝 Step-by-Step Instructions</h3>
                <ol class="steps-list">

        // Video error fallback to diagram automatically if file hasn't been added yet

        if (!sessionObjectUrls[drill.id] && !shortsStore.tried[drill.id] && (FS_DIR_SUPPORTED || FS_FILE_SUPPORTED)) {

          ensureShortUrl(drill).then((ok) => {
            if (ok && state.activeView === "deck" && state.selectedDrillId === drill.id) renderDeck();
          });

        const btnLink = document.getElementById("btnLinkShortsFolder");
        if (btnLink) btnLink.onclick = linkShortsFolder;

      function toggleDrillDoneToday(drillId) {
        const iso = todayISO(0);
        const today = ensureDayLog(iso);
        const i = today.completedDrills.indexOf(drillId);
        if (i >= 0) {
          today.completedDrills.splice(i, 1);
          if (today.completedDrills.length === 0 && !today.notes && (today.status === "partial" || today.status === "recovery")) {
            delete state.deliveryLogs[iso];
          }
          showToast("Removed drill from today's completed list");
        } else {
          today.completedDrills.push(drillId);
          if (!today.status) {

      function renderDeliveryBarChartSvg(daysCount = 30) {
        const w = 780;
        const h = 225;
        const padL = 36;
        const padR = 14;
        const padT = 26;
        const padB = 34;
        const innerW = w - padL - padR;
        const innerH = h - padT - padB;
        const slotW = innerW / daysCount;
        const barW = Math.max(10, slotW - 6);

        const colors = {
          met: "#10b981",
          recovery: "#38bdf8",
          partial: "#f59e0b",
          missed: "#ef4444",
          "": "#1e293b"
        };
        const modeEmoji = { real: "🏌️", almost: "🌙", sore: "💪" };

        let gridLines = "";
        for (let q = 1; q <= 5; q++) {
          const y = padT + innerH - (q / 5) * innerH;
          gridLines += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w - padR}" y2="${y.toFixed(1)}" stroke="#1e293b" stroke-width="1"/>`;
          gridLines += `<text x="${padL - 8}" y="${(y + 4).toFixed(1)}" fill="#64748b" font-size="10" text-anchor="end">${q}</text>`;
        }

        let bars = "";
        const trendPts = [];
        for (let i = 0; i < daysCount; i++) {
          const iso = todayISO(-(daysCount - 1 - i));
          const log = state.deliveryLogs[iso];
          const status = (log && log.status) || "";
          const q = status === "missed" ? 1 : ((log && log.quality) || 0);
          const x = padL + i * slotW + (slotW - barW) / 2;
          const barH = status ? Math.max(14, (q / 5) * innerH) : 10;
          const y = padT + innerH - barH;
          const fill = colors[status] || "#1e293b";
          const isSel = state.selectedLogDate === iso;

          if (status && status !== "missed" && q > 0) {
            trendPts.push(`${(x + barW / 2).toFixed(1)},${y.toFixed(1)}`);
          }

          bars += `
            <g class="chart-day-bar" data-chart-date="${iso}" style="cursor:pointer;">
              <title>${iso}: ${esc(status || "Unlogged")} (${esc(log ? log.mode : "-")}${log && log.notes ? " - " + esc(log.notes) : ""})</title>
              <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}"
                    rx="4" fill="${fill}" opacity="${status === "missed" ? "0.65" : "0.92"}"
                    stroke="${isSel ? "#ffffff" : "rgba(255,255,255,0.08)"}" stroke-width="${isSel ? "2" : "1"}"/>
              ${status && status !== "missed" && log && modeEmoji[log.mode]
                ? `<text x="${(x + barW / 2).toFixed(1)}" y="${Math.max(13, y - 5).toFixed(1)}" font-size="10" text-anchor="middle">${modeEmoji[log.mode]}</text>`
                : ""}
              ${(i % 5 === 0 || i === daysCount - 1)
                ? `<text x="${(x + barW / 2).toFixed(1)}" y="${h - 10}" fill="${isSel ? "#38bdf8" : "#94a3b8"}" font-size="10" font-weight="${isSel ? "700" : "400"}" text-anchor="middle">${shortDateLabel(iso)}</text>`
                : ""}
            </g>`;
        }

        const trendLine = trendPts.length >= 2
          ? `<polyline fill="none" stroke="#e0f2fe" stroke-width="2" stroke-opacity="0.7" points="${trendPts.join(" ")}"/>`
          : "";

        return `
          <svg viewBox="0 0 ${w} ${h}" style="width:100%; min-width:580px; height:auto;">
            <text x="${padL}" y="14" fill="#94a3b8" font-size="11" font-weight="700">30-Day Daily Delivery Status &amp; Delivery Quality (1-5) &mdash; Click any bar to edit day</text>
            ${gridLines}
            ${bars}
            ${trendLine}
          </svg>
        `;
      }

      function renderHeatmapHtml() {
        const cols = 13;
        const rows = 7;
        const total = cols * rows;
        let html = `<div class="heatmap-grid">`;
        for (let c = 0; c < cols; c++) {
          html += `<div class="hm-col">`;
          for (let r = 0; r < rows; r++) {
            const idx = c * rows + r;
            const offset = -(total - 1 - idx);
            const iso = todayISO(offset);
            const log = state.deliveryLogs[iso];
            const st = (log && log.status) || "";
            const sel = state.selectedLogDate === iso ? "selected" : "";
            html += `<div class="hm-cell ${esc(st)} ${sel}" data-chart-date="${iso}" title="${iso}: ${esc(st || "No log")}"></div>`;
          }
          html += `</div>`;
        }
        html += `</div>`;
        return html;
      }

        });
      }

      function formatRelPar(score, par) {
        const s = Number(score);
        const p = Number(par);
        if (!Number.isFinite(s) || !Number.isFinite(p)) return "";
        const diff = s - p;
        if (diff === 0) return "E";
        return diff > 0 ? `+${diff}` : `${diff}`;
      }

      function scoreChipClass(diff) {
        if (diff <= 0) return "under";
        if (diff <= 5) return "low";
        if (diff <= 14) return "mid";
        return "high";
      }

      function getCourseRoundStats(courseId) {
        const list = (state.roundLogs || [])
          .filter((r) => r.courseId === courseId)
          .slice()
          .sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
        if (!list.length) {
          return { plays: 0, bestScore: null, bestDiff: null, bestRelStr: "", avgScore: null, lastDate: "", lastScore: null };
        }
        let best = list[0];
        let sum = 0;
        for (const r of list) {
          const diff = Number(r.score) - Number(r.par);
          const bestDiff = Number(best.score) - Number(best.par);
          if (diff < bestDiff || (diff === bestDiff && Number(r.score) < Number(best.score))) {
            best = r;
          }
          sum += Number(r.score) || 0;
        }
        const bestDiff = Number(best.score) - Number(best.par);
        return {
          plays: list.length,
          bestScore: Number(best.score),
          bestDiff,
          bestRelStr: formatRelPar(best.score, best.par),
          avgScore: (sum / list.length).toFixed(1),
          lastDate: list[0].date || "",
          lastScore: Number(list[0].score)
        };
      }

      function getDefaultParForSelection(course, teeKey, holes) {
        const h = Number(holes) || 18;
        if (!course) return h === 9 ? 36 : h === 6 ? 24 : h === 3 ? 12 : 72;
        if (teeKey === "par3") {
          if (course.par && course.par <= 60) {
            return h === course.holes ? course.par : Math.round((course.par / (course.holes || 18)) * h);
          }
          return h * 3;
        }
        const fullPar = Number(course.par) || 72;
        const fullHoles = Number(course.holes) || 18;
        if (h === fullHoles) return fullPar;
        return Math.round((fullPar / fullHoles) * h);
      }

      function normalizeCourseKey(text) {
        return String(text || "")
          .toLowerCase()
          .replace(/(_v\d+)?(_gsp)?$/i, "")
          .replace(/\b(golf\s+course|golf\s+club|course|gc)\s*$/i, "")
          .replace(/[^a-z0-9]+/g, "");
      }

      function findCourseByNameOrId(query) {
        const raw = String(query || "").trim();
        if (!raw) return null;
        const q = raw.toLowerCase();
        const normQ = normalizeCourseKey(raw);
        const candidates = (state.courses || []).slice().sort((a, b) =>
          (Number(Boolean(b.favorite)) - Number(Boolean(a.favorite))) ||
          ((Number(b.rating) || 0) - (Number(a.rating) || 0))
        );
        return (
          candidates.find((c) => c.id.toLowerCase() === q) ||
          candidates.find((c) => c.name.toLowerCase() === q) ||
          candidates.find((c) => normQ && normalizeCourseKey(c.name) === normQ) ||
          candidates.find((c) => normQ && normalizeCourseKey(c.id) === normQ) ||
          candidates.find((c) => c.name.toLowerCase().includes(q) || q.includes(c.name.toLowerCase()) || c.id.toLowerCase().includes(q)) ||
          null
        );
      }

      function isValidYmd(yNum, mNum, dNum) {
        if (!Number.isInteger(yNum) || !Number.isInteger(mNum) || !Number.isInteger(dNum)) return false;
        if (mNum < 1 || mNum > 12 || dNum < 1 || dNum > 31) return false;
        const dt = new Date(Date.UTC(yNum, mNum - 1, dNum));
        return dt.getUTCFullYear() === yNum && dt.getUTCMonth() === mNum - 1 && dt.getUTCDate() === dNum;
      }

      function parseHistoricalDate(raw) {
        const s = String(raw || "").trim();
        if (!s) return null;
        const isoMatch = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);
        if (isoMatch) {
          const yNum = Number(isoMatch[1]);
          const mNum = Number(isoMatch[2]);
          const dNum = Number(isoMatch[3]);
          if (isValidYmd(yNum, mNum, dNum)) {
            return `${String(yNum).padStart(4, "0")}-${String(mNum).padStart(2, "0")}-${String(dNum).padStart(2, "0")}`;
          }
          return null;
        }
        const usMatch = s.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{4})$/);
        if (usMatch) {
          const mNum = Number(usMatch[1]);
          const dNum = Number(usMatch[2]);
          const yNum = Number(usMatch[3]);
          if (isValidYmd(yNum, mNum, dNum)) {
            return `${String(yNum).padStart(4, "0")}-${String(mNum).padStart(2, "0")}-${String(dNum).padStart(2, "0")}`;
          }
          return null;
        }
        if (/\d{4}/.test(s)) {
          const dt = new Date(s);
          if (!Number.isNaN(dt.getTime())) {
            const useUtc = /(Z|[+-]\d{2}:?\d{2}|GMT|UTC)$/i.test(s);
            const yNum = useUtc ? dt.getUTCFullYear() : dt.getFullYear();
            const mNum = (useUtc ? dt.getUTCMonth() : dt.getMonth()) + 1;
            const dNum = useUtc ? dt.getUTCDate() : dt.getDate();
            if (yNum >= 1990 && isValidYmd(yNum, mNum, dNum)) {
              return `${String(yNum).padStart(4, "0")}-${String(mNum).padStart(2, "0")}-${String(dNum).padStart(2, "0")}`;
            }
          }
        }
        return null;
      }

      function parseCsvLine(line) {
        const out = [];
        let cur = "";
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === "\"") {
            if (inQuotes && line[i + 1] === "\"") {
              cur += "\"";
              i++;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (ch === "," && !inQuotes) {
            out.push(cur.trim());
            cur = "";
          } else {
            cur += ch;
          }
        }
        out.push(cur.trim());
        return out;
      }

      function renderRoundsChartSvg(rounds) {
        const list = (rounds || [])
          .slice()
          .sort((a, b) => String(a.date || "").localeCompare(String(b.date || "")))
          .slice(-24);
        if (!list.length) {
          return `<div style="padding:18px; text-align:center; color:var(--muted); font-size:0.86rem;">Log or import rounds below to plot your Score vs. Par trend over time.</div>`;
        }
        const W = 760;
        const H = 228;
        const padL = 44;
        const padR = 20;
        const padT = 30;
        const padB = 34;
        const innerW = W - padL - padR;
        const innerH = H - padT - padB;

        const diffs = list.map((r) => Number(r.score) - Number(r.par));
        const minD = Math.min(-2, ...diffs);
        const maxD = Math.max(8, ...diffs);
        const span = Math.max(1, maxD - minD);
        const yForDiff = (d) => padT + ((maxD - d) / span) * innerH;
        const xForIdx = (i) => (list.length === 1 ? padL + innerW / 2 : padL + (i / (list.length - 1)) * innerW);

        const gridVals = [minD, 0, Math.round(maxD / 2), maxD].filter((v, idx, arr) => arr.indexOf(v) === idx);
        const gridSvg = gridVals.map((v) => {
          const y = yForDiff(v).toFixed(1);
          const isZero = v === 0;
          const lbl = v === 0 ? "E" : (v > 0 ? `+${v}` : `${v}`);
          return `
            <line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"
                  stroke="${isZero ? "#10b981" : "#243248"}"
                  stroke-width="${isZero ? 1.5 : 1}"
                  stroke-dasharray="${isZero ? "4 3" : ""}" />
            <text x="${padL - 8}" y="${Number(y) + 3}" text-anchor="end" fill="${isZero ? "#6ee7b7" : "#94a3b8"}" font-size="10">${lbl}</text>
          `;
        }).join("");

        const pts = list.map((r, i) => `${xForIdx(i).toFixed(1)},${yForDiff(Number(r.score) - Number(r.par)).toFixed(1)}`).join(" ");
        const dotsSvg = list.map((r, i) => {
          const d = Number(r.score) - Number(r.par);
          const x = xForIdx(i).toFixed(1);
          const y = yForDiff(d).toFixed(1);
          const col = d <= 0 ? "#10b981" : d <= 5 ? "#38bdf8" : d <= 14 ? "#f59e0b" : "#ef4444";
          const rel = formatRelPar(r.score, r.par);
          const shortDate = String(r.date || "").slice(5);
          const showLabel = list.length <= 12 || i === 0 || i === list.length - 1 || i % Math.ceil(list.length / 8) === 0;
          return `
            <g>
              <circle cx="${x}" cy="${y}" r="5.5" fill="${col}" stroke="#0b1120" stroke-width="2">
                <title>${esc(r.date)} &mdash; ${esc(r.courseName)}: ${esc(r.score)} (${esc(rel)})</title>
              </circle>
              ${list.length <= 16 ? `<text x="${x}" y="${Number(y) - 9}" text-anchor="middle" fill="#e2e8f0" font-size="9.5" font-weight="700">${esc(rel)}</text>` : ""}
              ${showLabel ? `<text x="${x}" y="${H - 10}" text-anchor="middle" fill="#94a3b8" font-size="9.5">${esc(shortDate)}</text>` : ""}
            </g>
          `;
        }).join("");

        return `
          <svg viewBox="0 0 ${W} ${H}" width="100%" aria-label="Historical Score vs Par Trend">
            <text x="${padL}" y="13" fill="#bae6fd" font-size="11.5" font-weight="700">Score vs. Par Trend (Last ${list.length} Round${list.length === 1 ? "" : "s"})</text>
            ${gridSvg}
            ${list.length > 1 ? `<polyline fill="none" stroke="#38bdf8" stroke-width="2.2" points="${pts}" />` : ""}
            ${dotsSvg}
          </svg>
        `;
      }

      function getCourseShortYardage(c) {
        const vals = Object.values(c.tees || {}).filter((v) => Number(v) > 0);
        return vals.length ? Math.min(...vals) : 99999;
      }

      function getFilteredCourses() {
        const q = (state.courseSearch || "").trim().toLowerCase();
        const cat = state.courseCategoryFilter || "all";
        const focus = state.courseFocusFilter || "all";

        const filtered = (state.courses || []).filter((c) => {
          if (cat === "favorites" && !c.favorite) return false;
          else if (cat === "has-par3-tee" && !(c.tees && Number(c.tees.par3) > 0)) return false;
          else if (cat !== "all" && cat !== "favorites" && cat !== "has-par3-tee") {
            if (!Array.isArray(c.categories) || !c.categories.includes(cat)) return false;
          }
          if (focus !== "all" && c.drillFocus !== focus) return false;
          if (q) {
            const hay = [
              c.name, c.id, c.location, c.designer,
              c.drillFocus, formatBestFor(c.bestFor), c.drillNote, c.userNotes || ""
            ].join(" ").toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });

        const sortBy = state.courseSort || "favorites";
        filtered.sort((a, b) => {
          if (sortBy === "most-played") {
            const pa = getCourseRoundStats(a.id).plays;
            const pb = getCourseRoundStats(b.id).plays;
            return (pb - pa) || (Number(Boolean(b.favorite)) - Number(Boolean(a.favorite))) || a.name.localeCompare(b.name);
          }
          if (sortBy === "best-score") {
            const sa = getCourseRoundStats(a.id).bestDiff;
            const sb = getCourseRoundStats(b.id).bestDiff;
            const va = sa === null ? 9999 : sa;
            const vb = sb === null ? 9999 : sb;
            return (va - vb) || a.name.localeCompare(b.name);
          }
          if (sortBy === "shortest") {
            return (getCourseShortYardage(a) - getCourseShortYardage(b)) || a.name.localeCompare(b.name);
          }
          if (sortBy === "altitude") {
            return ((Number(b.altitudeFt) || 0) - (Number(a.altitudeFt) || 0)) || a.name.localeCompare(b.name);
          }
          if (sortBy === "name") {
            return a.name.localeCompare(b.name);
          }
          // Default: "favorites" — favorites & higher drill ratings first
          return (
            (Number(Boolean(b.favorite)) - Number(Boolean(a.favorite))) ||
            ((Number(b.rating) || 0) - (Number(a.rating) || 0)) ||
            a.name.localeCompare(b.name)
          );
        });
        return filtered;
      }
