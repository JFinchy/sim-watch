          btn.onclick = () => {
            const cid = btn.getAttribute("data-log-combine");
            const comb = (DEFAULTS.simulatorRoutines || {})[cid];
            showToast(`Logged combine: ${comb ? comb.title : cid}`);
          };
        });
      }

      function openEditorForDrill(drillId) {
        editingDrillId = drillId;
        state.activeView = "editor";
        renderAll();
      }

      function renderEditor() {
        const el = document.getElementById("view-editor");
        const existing = editingDrillId ? state.drills.find((d) => d.id === editingDrillId) : null;
        const blank = {
          id: "",
          title: "",
          section: "Mobility & Setup Calibration",
          focus: "",
          days: ["daily-calibration"],
          modes: ["real", "almost"],
          duration: "8 min",
          reps: "15 reps",
          clubs: ["7 Iron"],
          video: { localPath: "", youtubeUrl: "", diagram: "impact", keyFrameCue: "" },
          why: "",
          instructions: ["", "", ""],
          checkpoints: { dtl: "", fo: "" },
          modePlans: { real: "", almost: "", sore: "" }
        };
        const d = existing || blank;
        const routineChoices = DEFAULTS.routines || [];
        const sectionChoices = Array.from(new Set(state.drills.map((x) => x.section).filter(Boolean)));

        el.innerHTML = `
          <div class="panel" style="margin-bottom:18px;">
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:14px;">
              <div>
                <h2 style="margin:0;">${existing ? "✏️ Edit Drill" : "➕ Add Custom Drill"}</h2>
                <p style="margin:2px 0 0; color:var(--muted); font-size:0.86rem;">
                  Add your own video short path (<code>shorts/my_drill.mp4</code> or YouTube Short URL), write-up, and Real / Kids-Asleep / Gym-Sore variations.
                </p>
              </div>
              <div style="display:flex; gap:8px;">
                ${existing ? `<button class="nav-btn" id="btnNewBlankDrill">+ Create New Instead</button>` : ""}
                <button class="nav-btn" id="btnExportBackup">⬇️ Export JSON Backup</button>
                <label class="nav-btn" style="cursor:pointer;">
                  ⬆️ Import JSON
                  <input type="file" accept=".json" id="fileImportJson" style="display:none;" />
                </label>
                <button class="nav-btn danger" id="btnResetDefaults">↺ Reset Default Drills</button>
              </div>
            </div>

            <div class="form-grid">
              <div class="field">
                <label>Drill Title</label>
                <input id="edTitle" value="${esc(d.title)}" placeholder="e.g., Lead-Arm Wall Hinge Takeaway" />
              </div>
              <div class="field">
                <label>Section</label>
                <input id="edSection" list="sectionList" value="${esc(d.section)}" />
                <datalist id="sectionList">
                  ${sectionChoices.map((s) => `<option value="${esc(s)}">`).join("")}
                </datalist>
              </div>
              <div class="field">
                <label>Primary Focus</label>
                <input id="edFocus" value="${esc(d.focus)}" placeholder="e.g., Early Wrist Set & Plane" />
              </div>
              <div class="field">
                <label>Clubs (comma-separated)</label>
                <input id="edClubs" value="${esc((d.clubs || []).join(", "))}" />
              </div>
              <div class="field">
                <label>Duration</label>
                <input id="edDuration" value="${esc(d.duration)}" />
              </div>
              <div class="field">
                <label>Reps / Target</label>
                <input id="edReps" value="${esc(d.reps)}" />
              </div>
              <div class="field">
                <label>Local Video Short Relative Path (e.g. shorts/my_clip.mp4)</label>
                <input id="edLocalPath" value="${esc((d.video && d.video.localPath) || "")}" />
              </div>
              <div class="field">
                <label>YouTube Short / Video URL (optional)</label>
                <input id="edYoutubeUrl" value="${esc((d.video && d.video.youtubeUrl) || "")}" placeholder="https://youtube.com/shorts/..." />
              </div>
            </div>

            <div class="form-grid" style="margin-top:12px;">
              <div class="field">
                <label>Visual Diagram Fallback</label>
                <select id="edDiagram">
                  ${["posture", "takeaway", "shallow", "impact", "wedge", "driver"].map((k) =>
                    `<option value="${k}" ${d.video && d.video.diagram === k ? "selected" : ""}>${k}</option>`
                  ).join("")}
                </select>
              </div>
              <div class="field">
                <label>Short Visual Key Cue Caption</label>
                <input id="edKeyCue" value="${esc((d.video && d.video.keyFrameCue) || "")}" />
              </div>
            </div>

            <div class="field" style="margin-top:12px;">
              <label>Compatible Modes</label>
              <div style="display:flex; gap:16px; flex-wrap:wrap; padding:6px 0;">
                <label><input type="checkbox" id="edModeReal" ${(d.modes || []).includes("real") ? "checked" : ""}/> 🏌️ Real Balls</label>
                <label><input type="checkbox" id="edModeAlmost" ${(d.modes || []).includes("almost") ? "checked" : ""}/> 🌙 Almost Golf Balls (Kids Asleep)</label>
                <label><input type="checkbox" id="edModeSore" ${(d.modes || []).includes("sore") ? "checked" : ""}/> 💪 Gym-Sore / Recovery</label>
              </div>
            </div>

            <div class="field" style="margin-top:8px;">
              <label>Assign to Day / Focus Routines</label>
              <div style="display:flex; gap:12px; flex-wrap:wrap; padding:6px 0;">
                ${routineChoices.map((r) => `
                  <label style="font-size:0.85rem;">
                    <input type="checkbox" class="ed-day-cb" value="${esc(r.id)}" ${(d.days || []).includes(r.id) ? "checked" : ""}/> ${esc(r.title)}
                  </label>
                `).join("")}
              </div>
            </div>

            <div class="field" style="margin-top:10px;">
              <label>💡 The Why (Explain fault &amp; purpose)</label>
              <textarea id="edWhy" rows="3">${esc(d.why)}</textarea>
            </div>

            <div class="field" style="margin-top:10px;">
              <label>📝 Step-by-Step Instructions (one step per line)</label>
              <textarea id="edInstructions" rows="4">${esc((d.instructions || []).join("\n"))}</textarea>
            </div>

            <div class="form-grid" style="margin-top:10px;">
              <div class="field">
                <label>Kinovea DTL Checkpoint</label>
                <input id="edCpDtl" value="${esc((d.checkpoints && d.checkpoints.dtl) || "")}" />
              </div>
              <div class="field">
                <label>Kinovea FO Checkpoint</label>
                <input id="edCpFo" value="${esc((d.checkpoints && d.checkpoints.fo) || "")}" />
              </div>
            </div>

            <div class="form-grid" style="margin-top:10px;">
              <div class="field">
                <label>🏌️ Real Balls Prescription</label>
                <input id="edPlanReal" value="${esc((d.modePlans && d.modePlans.real) || "")}" />
              </div>
              <div class="field">
                <label>🌙 Almost Golf Balls (Kids Asleep) Prescription</label>
                <input id="edPlanAlmost" value="${esc((d.modePlans && d.modePlans.almost) || "")}" />
              </div>
            </div>
            <div class="field" style="margin-top:10px;">
              <label>💪 Gym-Sore / Recovery Prescription</label>
              <input id="edPlanSore" value="${esc((d.modePlans && d.modePlans.sore) || "")}" />
            </div>

            <div style="display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;">
              <button class="nav-btn success" id="btnSaveDrill">${existing ? "💾 Save Changes to Drill" : "➕ Create Drill"}</button>
              ${existing ? `<button class="nav-btn danger" id="btnDeleteDrill">🗑️ Delete This Drill</button>` : ""}
            </div>
          </div>
        `;

        if (existing) {
          document.getElementById("btnNewBlankDrill").onclick = () => {
            editingDrillId = null;
            renderEditor();
          };
          document.getElementById("btnDeleteDrill").onclick = () => {
            if (state.drills.length <= 1) {
              showToast("Keep at least 1 drill in your library.");
              return;
            }
            if (!confirm(`Delete drill "${existing.title}"?`)) return;
            state.drills = state.drills.filter((x) => x.id !== existing.id);
            for (const day of Object.values(state.deliveryLogs || {})) {
              if (day && Array.isArray(day.completedDrills)) {
                day.completedDrills = day.completedDrills.filter((id) => id !== existing.id);
              }
            }
            editingDrillId = null;
            const remaining = getFilteredDrills();
            state.selectedDrillId = (remaining[0] && remaining[0].id) || (state.drills[0] && state.drills[0].id) || null;
            saveState();
            showToast("Drill deleted");
            state.activeView = "browse";
            renderAll();
          };
        }

        document.getElementById("btnSaveDrill").onclick = () => {
          const title = document.getElementById("edTitle").value.trim();
          if (!title) {
            showToast("Please give the drill a title!");
            return;
          }
          const modes = [];
          if (document.getElementById("edModeReal").checked) modes.push("real");
          if (document.getElementById("edModeAlmost").checked) modes.push("almost");
          if (document.getElementById("edModeSore").checked) modes.push("sore");
          const days = Array.from(el.querySelectorAll(".ed-day-cb:checked")).map((cb) => cb.value);

          const obj = {
            id: existing ? existing.id : ("custom-" + Date.now()),
            title,
            section: document.getElementById("edSection").value.trim() || "Custom Drills",
            focus: document.getElementById("edFocus").value.trim() || "Execution",
            days: days.length ? days : ["daily-calibration"],
            modes: modes.length ? modes : ["real"],
            duration: document.getElementById("edDuration").value.trim() || "8 min",
            reps: document.getElementById("edReps").value.trim() || "15 reps",
            clubs: document.getElementById("edClubs").value.split(",").map((s) => s.trim()).filter(Boolean),
            video: {
              localPath: document.getElementById("edLocalPath").value.trim(),
              youtubeUrl: document.getElementById("edYoutubeUrl").value.trim(),
              diagram: document.getElementById("edDiagram").value,
              keyFrameCue: document.getElementById("edKeyCue").value.trim()
            },
            why: document.getElementById("edWhy").value.trim(),
            instructions: document.getElementById("edInstructions").value.split("\n").map((s) => s.trim()).filter(Boolean),
            checkpoints: {
              dtl: document.getElementById("edCpDtl").value.trim(),
              fo: document.getElementById("edCpFo").value.trim()
            },
            modePlans: {
              real: document.getElementById("edPlanReal").value.trim(),
              almost: document.getElementById("edPlanAlmost").value.trim(),
              sore: document.getElementById("edPlanSore").value.trim()
            }
          };

          if (existing) {
            const idx = state.drills.findIndex((x) => x.id === existing.id);
            state.drills[idx] = obj;
          } else {
            state.drills.push(obj);
          }
          state.selectedDrillId = obj.id;
          editingDrillId = null;
          state.activeView = "deck";
          saveState();
          showToast("Saved drill!");
          renderAll();
        };

        document.getElementById("btnExportBackup").onclick = () => {
          const blob = new Blob([JSON.stringify({
            exportedAt: new Date().toISOString(),
            drills: state.drills,
            goals: state.goals,
            deliveryLogs: state.deliveryLogs,
            drillNotes: state.drillNotes,
            courses: state.courses,
            roundLogs: state.roundLogs
          }, null, 2)], { type: "application/json" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = `simwatch_drills_backup_${todayISO(0)}.json`;
          a.click();
          showToast("Exported backup JSON!");
        };

        document.getElementById("fileImportJson").onchange = (ev) => {
          const file = ev.target.files && ev.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const parsed = JSON.parse(reader.result);
              if (Array.isArray(parsed.drills)) state.drills = parsed.drills;
              if (Array.isArray(parsed.goals)) state.goals = parsed.goals;
              if (parsed.deliveryLogs) state.deliveryLogs = parsed.deliveryLogs;
              if (parsed.drillNotes) state.drillNotes = parsed.drillNotes;
              if (Array.isArray(parsed.courses)) state.courses = mergeCourses(parsed.courses);
            if (Array.isArray(parsed.bagMatrix)) state.bagMatrix = mergeBagMatrix(parsed.bagMatrix);
            if (parsed.cadencePresetId) state.cadencePresetId = parsed.cadencePresetId;
            if (typeof parsed.simTemp === "number") state.simTemp = parsed.simTemp;
            if (typeof parsed.simAltitude === "number") state.simAltitude = parsed.simAltitude;
              if (Array.isArray(parsed.roundLogs)) state.roundLogs = parsed.roundLogs;
              saveState();
              showToast("Imported backup successfully!");
              renderAll();
            } catch {
              showToast("Invalid JSON backup file.");
            }
          };
          reader.readAsText(file);
        };

        document.getElementById("btnResetDefaults").onclick = () => {
          if (!confirm("Reset drills & default goals back to factory presets? (Your Daily Delivery chart history stays intact.)")) return;
          state.drills = JSON.parse(JSON.stringify(DEFAULTS.drills));
          state.goals = JSON.parse(JSON.stringify(DEFAULTS.goals));
          state.selectedDrillId = state.drills[0] && state.drills[0].id;
          editingDrillId = null;
          saveState();
          showToast("Reset default drills & goals.");
          renderAll();
        };
      }

      function renderAll() {
        renderHeader();
        renderModeBar();
        renderViewTabs();
        renderFilterBar();

        ["deck", "browse", "tracker", "courses", "editor", "cadence", "bag"].forEach((v) => {
          const viewEl = document.getElementById(`view-${v}`);
          if (viewEl) viewEl.classList.toggle("hidden", state.activeView !== v);
        });

        if (state.activeView === "deck") renderDeck();
        else if (state.activeView === "browse") renderBrowse();
        else if (state.activeView === "tracker") renderTracker();
        else if (state.activeView === "courses") renderCourses();
        else if (state.activeView === "editor") renderEditor();
        else if (state.activeView === "cadence") renderCadence();
        else if (state.activeView === "bag") renderBag();
      }

      // Deck navigation listeners
      document.getElementById("btnPrevDrill").onclick = () => jumpDrill(-1);
      document.getElementById("btnNextDrill").onclick = () => jumpDrill(1);
      document.getElementById("btnPrevSection").onclick = () => jumpSection(-1);
      document.getElementById("btnNextSection").onclick = () => jumpSection(1);

      // Keyboard navigation (ignore when typing inside inputs/textareas/selects or holding modifier keys)
      window.addEventListener("keydown", (e) => {
        if (e.altKey || e.ctrlKey || e.metaKey) return;
        const tag = (e.target && e.target.tagName) || "";
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;

        // Global Cadence Metronome toggle
        if (e.key === "t" || e.key === "T") {
          e.preventDefault();
          toggleCadenceMetronome();
          return;
        }

        // Drill deck navigation only on Deck view
        if (state.activeView !== "deck") return;

        if (e.key === "ArrowLeft") {
          e.preventDefault();
          jumpDrill(-1);
        } else if (e.key === "ArrowRight") {
          e.preventDefault();
          jumpDrill(1);
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          jumpSection(-1);
        } else if (e.key === "ArrowDown") {
          e.preventDefault();
          jumpSection(1);
        } else if (e.key === " " || e.code === "Space") {
          if (tag === "BUTTON" || tag === "A") return;
          const vid = document.getElementById("drillVideo");
          if (vid && !vid.classList.contains("hidden")) {
            e.preventDefault();
            if (vid.paused) vid.play().catch(() => {});
            else vid.pause();
          }
        } else if (e.key === "m" || e.key === "M") {
          if (state.selectedDrillId) {
            e.preventDefault();
            toggleDrillDoneToday(state.selectedDrillId);
          }
        }
      });

      renderAll();
    })();
  </script>
</body>
</html>
