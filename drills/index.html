<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SimWatch Golf Drills, Routines &amp; Daily Delivery Hub</title>
  <style>
    :root {
      --bg: #0b1120;
      --bg-card: #111827;
      --bg-elev: #1e293b;
      --bg-hover: #263449;
      --border: #2c3b55;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --green: #10b981;
      --green-soft: rgba(16, 185, 129, 0.16);
      --indigo: #818cf8;
      --indigo-soft: rgba(129, 140, 248, 0.16);
      --amber: #f59e0b;
      --amber-soft: rgba(245, 158, 11, 0.16);
      --red: #ef4444;
      --red-soft: rgba(239, 68, 68, 0.16);
      --radius: 12px;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at 15% 0%, #13223e 0%, var(--bg) 55%);
      color: var(--text);
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      min-height: 100vh;
      line-height: 1.5;
    }

    a { color: var(--accent); }
    button, input, textarea, select {
      font: inherit;
      color: inherit;
    }

    .app-shell {
      max-width: 1320px;
      margin: 0 auto;
      padding: 18px 20px 60px;
    }

    /* Header */
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 20px;
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: linear-gradient(135deg, #0284c7, #10b981);
      display: grid;
      place-items: center;
      font-size: 22px;
      font-weight: 700;
    }
    .brand h1 {
      margin: 0;
      font-size: 1.25rem;
      letter-spacing: -0.01em;
    }
    .brand p {
      margin: 2px 0 0;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .hud-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      font-size: 0.85rem;
      font-weight: 600;
    }
    .stat-pill.good { background: var(--green-soft); border-color: rgba(16, 185, 129, 0.45); color: #6ee7b7; }
    .stat-pill.warn { background: var(--amber-soft); border-color: rgba(245, 158, 11, 0.45); color: #fcd34d; }
    .stat-pill.info { background: var(--accent-soft); border-color: rgba(56, 189, 248, 0.45); color: #7dd3fc; }

    /* Mode + View Navigation Bars */
    .controls-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .pill-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      background: rgba(17, 24, 39, 0.85);
      padding: 6px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
    .pill-group-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      padding: 0 8px 0 6px;
      font-weight: 700;
    }

    .btn-pill {
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      padding: 7px 13px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-pill:hover { background: var(--bg-elev); color: var(--text); }
    .btn-pill.active {
      background: var(--accent-soft);
      border-color: rgba(56, 189, 248, 0.55);
      color: #e0f2fe;
    }
    .btn-pill.mode-real.active {
      background: var(--green-soft);
      border-color: rgba(16, 185, 129, 0.6);
      color: #a7f3d0;
    }
    .btn-pill.mode-almost.active {
      background: var(--indigo-soft);
      border-color: rgba(129, 140, 248, 0.6);
      color: #c7d2fe;
    }
    .btn-pill.mode-sore.active {
      background: var(--amber-soft);
      border-color: rgba(245, 158, 11, 0.6);
      color: #fde68a;
    }

    /* Routine + Section Ribbon */
    .filter-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .filter-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .filter-label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      min-width: 82px;
      font-weight: 700;
    }
    .chip {
      border: 1px solid var(--border);
      background: var(--bg-elev);
      color: #cbd5e1;
      padding: 5px 11px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 500;
      transition: all 0.14s ease;
    }
    .chip:hover { background: var(--bg-hover); color: #fff; }
    .chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #082f49;
      font-weight: 700;
    }

    /* Section & Drill Deck Controls */
    .deck-nav-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-bottom: 16px;
    }
    .nav-btn {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 15px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.14s ease;
    }
    .nav-btn:hover:not(:disabled) {
      background: var(--bg-hover);
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .nav-btn.primary {
      background: linear-gradient(135deg, #0284c7, #0ea5e9);
      border-color: #38bdf8;
      color: #fff;
    }
    .nav-btn.success {
      background: linear-gradient(135deg, #059669, #10b981);
      border-color: #34d399;
      color: #fff;
    }
    .nav-btn.danger {
      background: var(--red-soft);
      border-color: rgba(239, 68, 68, 0.5);
      color: #fca5a5;
    }

    .deck-position {
      text-align: center;
      flex: 1;
      min-width: 220px;
    }
    .deck-position .section-kicker {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      font-weight: 700;
    }
    .deck-position .counter {
      font-size: 0.92rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .dots-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
    }
    .dot-btn {
      width: 26px;
      height: 22px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-elev);
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
    }
    .dot-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #082f49;
    }
    .dot-btn.done {
      border-color: var(--green);
      color: #6ee7b7;
    }
    .dot-btn.active.done {
      background: var(--green);
      color: #052e16;
    }

    /* Drill Stage Grid */
    .drill-stage {
      display: grid;
      grid-template-columns: 1.02fr 1.18fr;
      gap: 18px;
      align-items: start;
    }
    @media (max-width: 960px) {
      .drill-stage { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
    }

    /* Video / Visual Box */
    .media-frame {
      position: relative;
      background: #070c17;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 16 / 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .media-frame video,
    .media-frame iframe {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border: 0;
      background: #000;
    }
    .diagram-box {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px;
      text-align: center;
      background: radial-gradient(circle at 50% 35%, #162544 0%, #070c17 75%);
    }
    .diagram-box svg {
      width: 100%;
      max-height: 220px;
    }
    .diagram-caption {
      margin-top: 8px;
      font-size: 0.85rem;
      color: #bae6fd;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 6px 12px;
      border-radius: 8px;
    }

    .media-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      align-items: center;
      justify-content: space-between;
    }
    .media-toolbar-left,
    .media-toolbar-right {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .btn-sm {
      padding: 6px 11px;
      font-size: 0.8rem;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--bg-elev);
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
    }
    .btn-sm:hover { background: var(--bg-hover); border-color: var(--accent); }
    .btn-sm.active { background: var(--accent-soft); border-color: var(--accent); color: #7dd3fc; }

    /* Meta Tags */
    .drill-header h2 {
      margin: 6px 0 8px;
      font-size: 1.42rem;
      line-height: 1.25;
    }
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 10px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 600;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      color: #cbd5e1;
    }
    .badge.real { background: var(--green-soft); border-color: rgba(16, 185, 129, 0.45); color: #6ee7b7; }
    .badge.almost { background: var(--indigo-soft); border-color: rgba(129, 140, 248, 0.45); color: #c7d2fe; }
    .badge.sore { background: var(--amber-soft); border-color: rgba(245, 158, 11, 0.45); color: #fde68a; }

    /* Info Sections inside Right Column */
    .info-block {
      margin-top: 14px;
      padding: 13px 15px;
      border-radius: 10px;
      background: rgba(30, 41, 59, 0.55);
      border: 1px solid var(--border);
    }
    .info-block h3 {
      margin: 0 0 8px;
      font-size: 0.92rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .info-block p { margin: 0; font-size: 0.94rem; color: #e2e8f0; }
    .steps-list {
      margin: 0;
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      font-size: 0.93rem;
      color: #e2e8f0;
    }

    .checkpoint-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 600px) {
      .checkpoint-grid { grid-template-columns: 1fr; }
    }
    .cp-card {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.87rem;
    }
    .cp-card strong { color: #7dd3fc; display: block; margin-bottom: 3px; }

    .mode-adapt-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .mode-box {
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      font-size: 0.88rem;
    }
    .mode-box.highlighted {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.25);
    }
    .mode-box.highlighted.real { border-color: var(--green); background: var(--green-soft); }
    .mode-box.highlighted.almost { border-color: var(--indigo); background: var(--indigo-soft); }
    .mode-box.highlighted.sore { border-color: var(--amber); background: var(--amber-soft); }
    .mode-box strong { display: block; margin-bottom: 2px; }

    .feel-notes-area {
      width: 100%;
      min-height: 70px;
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 11px;
      resize: vertical;
      font-size: 0.9rem;
    }
    .feel-notes-area:focus,
    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid var(--accent);
      border-color: transparent;
    }

    /* Routine Browser View */
    .routine-section-group {
      margin-bottom: 22px;
    }
    .routine-section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0 0 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
      font-size: 1.06rem;
      color: #bae6fd;
    }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 14px;
    }
    .drill-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      transition: transform 0.14s ease, border-color 0.14s ease;
    }
    .drill-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }
    .drill-card h4 { margin: 0; font-size: 1.02rem; }
    .drill-card p { margin: 0; font-size: 0.85rem; color: var(--muted); }

    /* Goals & Delivery Tracker View */
    .tracker-top-grid {
      display: grid;
      grid-template-columns: 1.05fr 1.35fr;
      gap: 18px;
      margin-bottom: 18px;
    }
    @media (max-width: 960px) {
      .tracker-top-grid { grid-template-columns: 1fr; }
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    @media (max-width: 720px) {
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    }
    .kpi-card {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
    }
    .kpi-card .label { font-size: 0.76rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .kpi-card .val { font-size: 1.55rem; font-weight: 800; margin-top: 2px; }
    .kpi-card .sub { font-size: 0.78rem; color: var(--muted); }

    .status-btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 10px 0 12px;
    }
    .status-btn {
      padding: 10px 12px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--bg-elev);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.86rem;
      text-align: left;
      transition: all 0.14s ease;
    }
    .status-btn:hover { border-color: var(--accent); }
    .status-btn.selected.met { background: var(--green-soft); border-color: var(--green); color: #6ee7b7; }
    .status-btn.selected.partial { background: var(--amber-soft); border-color: var(--amber); color: #fde68a; }
    .status-btn.selected.recovery { background: var(--accent-soft); border-color: var(--accent); color: #bae6fd; }
    .status-btn.selected.missed { background: var(--red-soft); border-color: var(--red); color: #fca5a5; }

    .rating-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin: 8px 0 12px;
    }
    .rate-pill {
      width: 34px;
      height: 32px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--bg-elev);
      cursor: pointer;
      font-weight: 700;
    }
    .rate-pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #082f49;
    }

    .chart-wrap {
      background: #0b1324;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      overflow-x: auto;
    }
    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 8px;
    }
    .legend-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 3px;
      margin-right: 5px;
      vertical-align: middle;
    }

    .heatmap-grid {
      display: grid;
      grid-template-columns: repeat(13, minmax(16px, 1fr));
      gap: 5px;
      margin-top: 10px;
    }
    .hm-col {
      display: grid;
      grid-template-rows: repeat(7, 16px);
      gap: 5px;
    }
    .hm-cell {
      width: 100%;
      height: 16px;
      border-radius: 4px;
      border: 1px solid rgba(148, 163, 184, 0.16);
      background: #172033;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .hm-cell:hover { transform: scale(1.2); border-color: #fff; }
    .hm-cell.met { background: #10b981; }
    .hm-cell.recovery { background: #38bdf8; }
    .hm-cell.partial { background: #f59e0b; }
    .hm-cell.missed { background: #ef4444; opacity: 0.78; }
    .hm-cell.selected { box-shadow: 0 0 0 2px #fff; }

    /* Goals List */
    .goal-card {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .goal-head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .progress-track {
      width: 100%;
      height: 10px;
      background: #0b1120;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
      margin: 8px 0;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #0ea5e9, #10b981);
      transition: width 0.25s ease;
    }

    /* Forms */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    @media (max-width: 760px) {
      .form-grid { grid-template-columns: 1fr; }
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .field label {
      font-size: 0.82rem;
      font-weight: 600;
      color: #cbd5e1;
    }
    .field input,
    .field select,
    .field textarea {
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.9rem;
    }

    .kbd-hint {
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    kbd {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-bottom-width: 2px;
      border-radius: 5px;
      padding: 1px 6px;
      font-family: Consolas, monospace;
      font-size: 0.76rem;
      color: #e2e8f0;
    }

    .hidden { display: none !important; }

    /* Subtle swing cue animation in SVG fallback */
    @keyframes pulseArc {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    .svg-pulse { animation: pulseArc 2.4s ease-in-out infinite; }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #0f172a;
      border: 1px solid var(--green);
      color: #d1fae5;
      padding: 10px 16px;
      border-radius: 10px;
      box-shadow: var(--shadow);
      font-size: 0.88rem;
      font-weight: 600;
      z-index: 999;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s ease;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* Courses, Playgrounds & Historical Rounds */
    .courses-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
    }
    .courses-controls-left {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      flex: 1;
    }
    .courses-input,
    .courses-select {
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 0.86rem;
      color: var(--text);
    }
    .courses-input { min-width: 220px; flex: 1; max-width: 340px; }

    .crd-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .crd-card {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 13px;
      font-size: 0.84rem;
    }
    .crd-card h4 { margin: 0 0 4px; font-size: 0.94rem; color: #bae6fd; }

    .course-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    @media (max-width: 500px) {
      .course-cards-grid { grid-template-columns: 1fr; }
    }
    .course-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 15px 16px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      box-shadow: var(--shadow);
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }
    .course-card:hover { border-color: rgba(56, 189, 248, 0.55); }
    .course-card.is-fav { border-color: rgba(245, 158, 11, 0.48); }
    .course-card.highlighted-course {
      border-color: var(--green);
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.45), var(--shadow);
    }
    .course-card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .course-card-head h3 {
      margin: 0;
      font-size: 1.06rem;
      line-height: 1.25;
    }
    .course-meta {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .fav-btn {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 0.95rem;
      line-height: 1.2;
      flex-shrink: 0;
    }
    .fav-btn.active {
      background: var(--amber-soft);
      border-color: var(--amber);
      color: #fde68a;
    }
    .star-row {
      display: inline-flex;
      gap: 2px;
      align-items: center;
    }
    .star-btn {
      background: transparent;
      border: 0;
      padding: 0 2px;
      cursor: pointer;
      font-size: 0.86rem;
      color: #475569;
    }
    .star-btn.lit { color: #fbbf24; }
    .tee-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.76rem;
    }
    .tee-pill {
      padding: 2px 8px;
      border-radius: 6px;
      background: #0b1324;
      border: 1px solid var(--border);
      color: #cbd5e1;
    }
    .tee-pill.short-tee {
      border-color: rgba(16, 185, 129, 0.45);
      color: #a7f3d0;
      background: rgba(16, 185, 129, 0.1);
    }
    .course-drill-box {
      background: rgba(30, 41, 59, 0.52);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 11px;
      font-size: 0.84rem;
      color: #e2e8f0;
    }
    .course-note-input {
      width: 100%;
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 5px 9px;
      font-size: 0.8rem;
      color: var(--text);
    }
    .course-stats-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding-top: 6px;
      border-top: 1px solid rgba(44, 59, 85, 0.65);
      font-size: 0.8rem;
      color: var(--muted);
    }
    .rounds-table-wrap {
      overflow-x: auto;
      margin-top: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .rounds-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      text-align: left;
    }
    .rounds-table th,
    .rounds-table td {
      padding: 9px 11px;
      border-bottom: 1px solid rgba(44, 59, 85, 0.65);
      vertical-align: top;
    }
    .rounds-table th {
      background: #0f172a;
      color: #94a3b8;
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .rounds-table tr:hover td { background: rgba(30, 41, 59, 0.35); }
    .score-chip {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.78rem;
    }
    .score-chip.under { background: var(--green-soft); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.45); }
    .score-chip.low { background: var(--accent-soft); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.45); }
    .score-chip.mid { background: var(--amber-soft); color: #fde68a; border: 1px solid rgba(245, 158, 11, 0.45); }
    .score-chip.high { background: var(--red-soft); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.45); }

    /* HACKMOTION & ARTILLERY STYLES */
    .hackmotion-card {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.08) 0%, rgba(17, 24, 39, 0.95) 100%);
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: var(--radius);
      position: relative;
      overflow: hidden;
    }
    .hackmotion-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #10b981, #38bdf8, #818cf8);
    }
    .wrist-gauge-bar {
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(90deg, #38bdf8 0%, #10b981 35%, #10b981 65%, #f59e0b 80%, #ef4444 100%);
      margin: 8px 0;
      position: relative;
    }
    .hud-badge-cadence {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(56, 189, 248, 0.14);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .hud-badge-cadence:hover {
      background: rgba(56, 189, 248, 0.24);
      border-color: rgba(56, 189, 248, 0.55);
    }
    .hud-badge-cadence.playing {
      background: rgba(16, 185, 129, 0.2);
      color: #6ee7b7;
      border-color: rgba(16, 185, 129, 0.5);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.3);
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #7dd3fc;
      display: inline-block;
    }
    .hud-badge-cadence.playing .pulse-dot {
      background: #10b981;
      animation: pulseAnim 1s infinite alternate;
    }
    @keyframes pulseAnim {
      from { transform: scale(0.8); opacity: 0.7; }
      to { transform: scale(1.3); opacity: 1; }
    }

    /* CADENCE STUDIO STYLES */
    .cadence-studio-wrap {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .cadence-hero {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }
    @media (max-width: 860px) {
      .cadence-hero { grid-template-columns: 1fr; }
    }
    .tempo-orb-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.9) 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 28px 20px;
      text-align: center;
      position: relative;
    }
    .tempo-orb {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.8);
      border: 3px solid rgba(56, 189, 248, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      transition: all 0.15s ease;
      cursor: pointer;
      position: relative;
      box-shadow: 0 0 25px rgba(0,0,0,0.5);
    }
    .tempo-orb.phase-takeaway {
      border-color: #10b981;
      box-shadow: 0 0 35px rgba(16, 185, 129, 0.6);
      transform: scale(1.05);
      background: rgba(16, 185, 129, 0.15);
    }
    .tempo-orb.phase-top {
      border-color: #f59e0b;
      box-shadow: 0 0 40px rgba(245, 158, 11, 0.7);
      transform: scale(1.1);
      background: rgba(245, 158, 11, 0.2);
    }
    .tempo-orb.phase-impact {
      border-color: #38bdf8;
      box-shadow: 0 0 50px rgba(56, 189, 248, 0.85);
      transform: scale(1.15);
      background: rgba(56, 189, 248, 0.3);
    }
    .tempo-orb-icon { font-size: 2.4rem; }
    .tempo-orb-phase { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px; }
    
    .cadence-presets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }
    .cadence-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .cadence-card:hover {
      border-color: var(--accent);
      background: var(--bg-hover);
      transform: translateY(-2px);
    }
    .cadence-card.active {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.1);
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.2);
    }

    /* BAG & DISTANCES MATRIX STYLES */
    .bag-matrix-wrap {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .bag-table-card {
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .bag-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }
    .bag-table th {
      background: #0f172a;
      padding: 10px 12px;
      text-align: left;
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    .bag-table td {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(44, 59, 85, 0.65);
      vertical-align: middle;
    }
    .bag-table tr:hover td {
      background: rgba(30, 41, 59, 0.45);
    }
    .editable-num {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--border);
      color: #fff;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
      width: 68px;
      text-align: center;
      font-family: inherit;
    }
    .editable-num:focus {
      border-color: var(--accent);
      outline: none;
      background: #1e293b;
    }

    /* SIM COMBINES BENTO GRID */
    .combines-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
    }
    .combine-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .combine-card:hover {
      border-color: rgba(56, 189, 248, 0.45);
      background: var(--bg-hover);
    }
  </style>

</head>
<body>
  <div class="app-shell">
    <!-- TOP HEADER -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">⛳</div>
        <div>
          <h1>SimWatch Golf Drills &amp; Daily Delivery Hub</h1>
          <p>Offline practice deck &bull; Kinovea DTL/FO checkpoints &bull; Real / Almost Golf Balls / Gym-Sore plans</p>
        </div>
      </div>
      <div class="hud-badges" id="headerStats"></div>
    </header>

    <!-- MODE SWITCHER & VIEW TABS -->
    <div class="controls-strip">
      <div class="pill-group" id="modeBar">
        <span class="pill-group-label">Session Mode</span>
      </div>

      <div class="pill-group" id="viewTabs">
        <button class="btn-pill active" data-view="deck">🎯 Drill Deck</button>
        <button class="btn-pill" data-view="browse">🗂️ Routines &amp; Sections</button>
        <button class="btn-pill" data-view="tracker">📊 Goals &amp; Delivery Chart</button>
        <button class="btn-pill" data-view="courses">⛳ GSPro Courses &amp; Rounds</button>
        <button class="btn-pill" data-view="cadence">⏱️ Cadence &amp; Tempo</button>
        <button class="btn-pill" data-view="bag">🎒 Club Bag &amp; Gapping</button>
        <button class="btn-pill" data-view="editor">➕ Add / Edit Drill</button>
      </div>
    </div>

    <!-- FILTER BAR (shown in Deck & Browse views) -->
    <section class="filter-card" id="filterCard">
      <div class="filter-row" id="routinePills"></div>
      <div class="filter-row" id="sectionPills"></div>
    </section>

    <!-- VIEW 1: DRILL DECK PLAYER -->
    <main id="view-deck">
      <div class="deck-nav-bar">
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="nav-btn" id="btnPrevSection" title="Previous Section (Up Arrow)">&laquo; Prev Section</button>
          <button class="nav-btn primary" id="btnPrevDrill" title="Previous Drill (Left Arrow)">&larr; Prev Drill</button>
        </div>

        <div class="deck-position" id="deckPosition"></div>

        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="nav-btn primary" id="btnNextDrill" title="Next Drill (Right Arrow)">Next Drill &rarr;</button>
          <button class="nav-btn" id="btnNextSection" title="Next Section (Down Arrow)">Next Section &raquo;</button>
        </div>
      </div>

      <div id="drillStageContainer"></div>

      <div class="kbd-hint" style="margin-top:14px;">
        <span>Shortcuts:</span>
        <span><kbd>&larr;</kbd> <kbd>&rarr;</kbd> Prev / Next Drill</span>
        <span><kbd>&uarr;</kbd> <kbd>&darr;</kbd> Prev / Next Section</span>
        <span><kbd>Space</kbd> Play / Pause Video Short</span>
        <span><kbd>T</kbd> Toggle Cadence Metronome</span>
        <span><kbd>M</kbd> Mark Drill Completed Today</span>
      </div>
    </main>

    <!-- VIEW 2: ROUTINES & SECTIONS BROWSER -->
    <section id="view-browse" class="hidden"></section>

    <!-- VIEW 3: GOALS & DAILY DELIVERY TRACKER -->
    <section id="view-tracker" class="hidden"></section>

    <!-- VIEW 4: GSPRO COURSES, DRILL PLAYGROUNDS & HISTORICAL ROUNDS -->
    <section id="view-courses" class="hidden"></section>

    <!-- VIEW 5: ADD / EDIT DRILL + BACKUP -->
    <section id="view-editor" class="hidden"></section>

    <!-- VIEW 6: CADENCE & TOUR TEMPO STUDIO -->
    <section id="view-cadence" class="hidden"></section>

    <!-- VIEW 7: CLUB BAG & GAPPING MATRIX + WEATHER / ALTITUDE NORMALIZER -->
    <section id="view-bag" class="hidden"></section>
  </div>

  <div class="toast" id="toastEl"></div>

  <script src="./drills_data.js"></script>
  <script>
    (function () {
      "use strict";

      const STORAGE_KEY = "simwatch_drills_hub_v1";

      function esc(str) {
        return String(str == null ? "" : str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function todayISO(offsetDays = 0) {
        const d = new Date();
        d.setHours(12, 0, 0, 0);
        d.setDate(d.getDate() + offsetDays);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }

      function shortDateLabel(iso) {
        const parts = iso.split("-");
        return parts.length === 3 ? `${Number(parts[1])}/${Number(parts[2])}` : iso;
      }

      function showToast(msg) {
        const el = document.getElementById("toastEl");
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => el.classList.remove("show"), 2400);
      }

      const DEFAULTS = window.DEFAULT_DRILLS_DATA || { modes: [], routines: [], drills: [], goals: [] };

      
      function mergeDrills(savedDrills) {
        const defaults = JSON.parse(JSON.stringify(DEFAULTS.drills || []));
        if (!Array.isArray(savedDrills) || !savedDrills.length) return defaults;
        const savedMap = new Map(savedDrills.map((d) => [d.id, d]));
        const seen = new Set();
        const merged = defaults.map((d) => {
          seen.add(d.id);
          const s = savedMap.get(d.id);
          if (!s) return d;
          return Object.assign({}, d, s, {
            hackmotion: d.hackmotion || s.hackmotion,
            days: d.days || s.days,
            modes: d.modes || s.modes
          });
        });
        for (const s of savedDrills) {
          if (s && s.id && !seen.has(s.id)) {
            merged.push(Object.assign({ custom: true }, s));
          }
        }
        return merged;
      }

      function mergeBagMatrix(savedBag) {
        const defaults = JSON.parse(JSON.stringify(DEFAULTS.bagMatrix || []));
        if (!Array.isArray(savedBag) || !savedBag.length) return defaults;
        const savedMap = new Map(savedBag.map((b) => [b.id || b.club, b]));
        return defaults.map((d) => {
          const s = savedMap.get(d.id || d.club);
          return s ? Object.assign({}, d, s) : d;
        });
      }

      function mergeCourses(savedCourses) {
        const defaults = JSON.parse(JSON.stringify(DEFAULTS.courses || []));
        if (!Array.isArray(savedCourses) || !savedCourses.length) {
          return defaults.map((c) => Object.assign({ userNotes: "" }, c));
        }
        const savedMap = new Map(savedCourses.map((c) => [c.id, c]));
        const seen = new Set();
        const merged = defaults.map((c) => {
          seen.add(c.id);
          const s = savedMap.get(c.id);
          if (!s) return Object.assign({ userNotes: "" }, c);
          return Object.assign({}, c, {
            favorite: typeof s.favorite === "boolean" ? s.favorite : c.favorite,
            rating: typeof s.rating === "number" ? s.rating : c.rating,
            userNotes: typeof s.userNotes === "string" ? s.userNotes : ""
          });
        });
        for (const s of savedCourses) {
          if (s && s.id && !seen.has(s.id)) {
            merged.push(Object.assign({ userNotes: "", custom: true }, s));
          }
        }
        return merged;
      }

      function loadState() {
        const base = {
          activeView: "deck",
          activeMode: "all",       // "all" | "real" | "almost" | "sore"
          activeRoutine: "all",    // "all" | routine id
          activeSection: "all",    // "all" | section name
          selectedDrillId: (DEFAULTS.drills[0] && DEFAULTS.drills[0].id) || null,
          selectedLogDate: todayISO(0),
          drills: JSON.parse(JSON.stringify(DEFAULTS.drills)),
          goals: JSON.parse(JSON.stringify(DEFAULTS.goals)),
          deliveryLogs: {},        // { "YYYY-MM-DD": { status, mode, quality, notes, completedDrills: [] } }
          drillNotes: {},          // { drillId: "custom feel notes" }
          courses: mergeCourses(null),
          roundLogs: [],           // [{ id, date, courseId, courseName, holes, tee, score, par, fir, gir, putts, birdies, mode, notes }]
          courseCategoryFilter: "all",
          courseFocusFilter: "all",
          courseSearch: "",
          courseSort: "favorites",
          roundFilterCourse: "all",
          highlightedCourseId: null,
          prefillRoundCourseId: null,
          prefillRoundTee: null,
          showAddCourseForm: false,
          showBulkImport: false
        };
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const saved = JSON.parse(raw);
            if (Array.isArray(saved.drills) && saved.drills.length) base.drills = saved.drills;
            if (Array.isArray(saved.goals)) base.goals = saved.goals;
            if (saved.deliveryLogs && typeof saved.deliveryLogs === "object") base.deliveryLogs = saved.deliveryLogs;
            if (saved.drillNotes && typeof saved.drillNotes === "object") base.drillNotes = saved.drillNotes;
            if (Array.isArray(saved.courses)) base.courses = mergeCourses(saved.courses);
            if (Array.isArray(saved.roundLogs)) base.roundLogs = saved.roundLogs;
            if (saved.activeMode) base.activeMode = saved.activeMode;
            if (saved.activeRoutine) base.activeRoutine = saved.activeRoutine;
            if (saved.activeSection) base.activeSection = saved.activeSection;
            if (saved.selectedDrillId) base.selectedDrillId = saved.selectedDrillId;
            if (Array.isArray(saved.bagMatrix)) base.bagMatrix = mergeBagMatrix(saved.bagMatrix);
            if (saved.cadencePresetId) base.cadencePresetId = saved.cadencePresetId;
            if (typeof saved.cadenceDelaySec === "number") base.cadenceDelaySec = saved.cadenceDelaySec;
            if (typeof saved.cadenceVolume === "number") base.cadenceVolume = saved.cadenceVolume;
            if (typeof saved.simTemp === "number") base.simTemp = saved.simTemp;
            if (typeof saved.simAltitude === "number") base.simAltitude = saved.simAltitude;
          }
          base.drills = mergeDrills(base.drills);
          if (!base.bagMatrix) base.bagMatrix = mergeBagMatrix(null);
          if (!base.cadencePresetId) base.cadencePresetId = "24-8";
          if (typeof base.cadenceDelaySec !== "number") base.cadenceDelaySec = 2.5;
          if (typeof base.cadenceVolume !== "number") base.cadenceVolume = 0.7;
          if (typeof base.simTemp !== "number") base.simTemp = 70;
          if (typeof base.simAltitude !== "number") base.simAltitude = 0;
        } catch (err) {

      // --- WEB AUDIO API ENGINE (TOUR TEMPO CADENCE & HACKMOTION BIOFEEDBACK) ---
      let audioCtx = null;
      function getAudioContext() {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function playTone(freq, durationSec, type = "sine", gainVal = 0.3) {
        try {
          const ctx = getAudioContext();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const now = ctx.currentTime;
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(gainVal * (state.cadenceVolume || 0.7), now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + durationSec);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + durationSec);
        } catch (err) {
          console.warn("Audio error:", err);
        }
      }

      function playHackMotionTone(isInZone = true) {
        if (isInZone) {
          playTone(660, 0.22, "triangle", 0.35);
          setTimeout(() => playTone(880, 0.30, "sine", 0.40), 90);
        } else {
          playTone(220, 0.25, "sawtooth", 0.25);
        }
      }

      function updateCadenceUI(phase) {
        cadenceState.currentPhase = phase;

        if (orb && phaseLabel) {
          orb.className = `tempo-orb phase-${phase}`;

      function scheduleCadenceBeat() {
        if (!cadenceState.isPlaying) return;
        const currentCycle = ++cadenceState.cycleId;
        const presets = DEFAULTS.cadencePresets || [];
        const preset = presets.find((p) => p.id === state.cadencePresetId) || presets[1] || { backSec: 0.8, downSec: 0.27 };
        const backSec = preset.backSec || 0.8;
        const downSec = preset.downSec || 0.27;
        const delaySec = state.cadenceDelaySec || 2.5;

        // Tone 1: Start Takeaway
        updateCadenceUI("takeaway");
        playTone(520, 0.12, "sine", 0.4);

        // Tone 2: Top / Transition
        setTimeout(() => {
          if (!cadenceState.isPlaying || cadenceState.cycleId !== currentCycle) return;
          updateCadenceUI("top");
          playTone(680, 0.12, "sine", 0.45);
        }, backSec * 1000);

        // Tone 3: Impact Strike
        setTimeout(() => {
          if (!cadenceState.isPlaying || cadenceState.cycleId !== currentCycle) return;
          updateCadenceUI("impact");
          playTone(880, 0.18, "triangle", 0.55);
          cadenceState.repCount++;
          const repEl = document.getElementById("cadenceRepCounter");
          if (repEl) repEl.textContent = cadenceState.repCount;
        }, (backSec + downSec) * 1000);

        // Reset to Ready
        setTimeout(() => {
          if (!cadenceState.isPlaying || cadenceState.cycleId !== currentCycle) return;
          updateCadenceUI("ready");
        }, (backSec + downSec + 0.35) * 1000);

        // Loop next swing
        const totalCycleMs = (backSec + downSec + delaySec) * 1000;
        cadenceState.timerId = setTimeout(() => {
          if (cadenceState.isPlaying && cadenceState.cycleId === currentCycle) scheduleCadenceBeat();
        }, totalCycleMs);
      }

        const s = String(rawUrl || "").trim();

      function parseYoutubeEmbedUrl(rawUrl) {
        const normalized = normalizeExternalUrl(rawUrl);
        if (!normalized) return null;
        try {
          const u = new URL(normalized);
          let id = "";
          if (u.hostname.includes("youtu.be")) {
            id = u.pathname.replace(/^\/+/, "").split(/[/?#]/)[0];
          } else if (u.pathname.includes("/shorts/")) {
            id = u.pathname.split("/shorts/")[1].split(/[/?#]/)[0];
          } else if (u.pathname.includes("/embed/")) {
            id = u.pathname.split("/embed/")[1].split(/[/?#]/)[0];
          } else if (u.pathname.includes("/live/")) {
            id = u.pathname.split("/live/")[1].split(/[/?#]/)[0];
          } else if (u.searchParams.get("v")) {
            id = u.searchParams.get("v");
          }
          if (!id) return null;
          return `https://www.youtube.com/embed/${encodeURIComponent(id)}?rel=0&playsinline=1`;
        } catch {
          return null;
        }
      }

      function computeDeliveryMetrics() {
        let streak = 0;
        let checkDate = todayISO(0);
        const isGood = (s) => s === "met" || s === "partial" || s === "recovery";
        if (!state.deliveryLogs[checkDate] || !isGood(state.deliveryLogs[checkDate].status)) {
          // Allow counting streak through yesterday if today isn't logged yet
          checkDate = todayISO(-1);
        }
        for (let i = 0; i < 365; i++) {
          const offset = checkDate === todayISO(0) ? -i : -(i + 1);
          const iso = todayISO(offset);
          const log = state.deliveryLogs[iso];
          if (log && isGood(log.status)) {
            streak += 1;
          } else {
            break;
          }
        }

        // Best streak
        const sortedDates = Object.keys(state.deliveryLogs).sort();
        let bestStreak = 0;
        let running = 0;
        let prevTime = null;
        for (const iso of sortedDates) {
          const log = state.deliveryLogs[iso];
          if (!isGood(log.status)) {
            running = 0;
            prevTime = null;
            continue;
          }
          const t = new Date(`${iso}T12:00:00`).getTime();
          if (prevTime !== null && Math.round((t - prevTime) / 86400000) === 1) {
            running += 1;
          } else {
            running = 1;
          }
          prevTime = t;
          if (running > bestStreak) bestStreak = running;
        }

        let last30Good = 0;
        let last30Logged = 0;
        const modeCounts = { real: 0, almost: 0, sore: 0 };
        for (let i = 0; i < 30; i++) {
          const log = state.deliveryLogs[todayISO(-i)];
          if (log && log.status) {
            last30Logged += 1;
            if (isGood(log.status)) {
              last30Good += 1;
              if (modeCounts[log.mode] !== undefined) modeCounts[log.mode] += 1;
            }
          }
        }
        return { streak, bestStreak, last30Good, last30Logged, modeCounts };
      }

          btn.onclick = () => {
            state.activeSection = btn.getAttribute("data-section");
            const filtered = getFilteredDrills();
            if (filtered.length) state.selectedDrillId = filtered[0].id;
            saveState();
            renderAll();
          };
        });
      }

      function jumpDrill(delta) {
        const filtered = getFilteredDrills();
        if (!filtered.length) return;
        const cur = currentFilteredDrillIndex(filtered);
        const next = (cur + delta + filtered.length) % filtered.length;
        state.selectedDrillId = filtered[next].id;
        saveState();
        renderDeck();
      }

      function jumpSection(delta) {
        const sections = getAvailableSections();
        if (sections.length < 2) return;
        let curIdx = sections.indexOf(state.activeSection);
        if (curIdx < 0) {
          const filtered = getFilteredDrills();
          const curDrill = filtered[currentFilteredDrillIndex(filtered)];
          curIdx = curDrill ? sections.indexOf(curDrill.section) : 0;
        }
        if (curIdx < 0) curIdx = 0;
        const next = (curIdx + delta + sections.length) % sections.length;
        state.activeSection = sections[next];
        const filtered = getFilteredDrills();
        if (filtered.length) state.selectedDrillId = filtered[0].id;
        saveState();
        renderAll();
      }

                  ${(drill.modes || []).includes("real") ? `<span class="badge real">🏌️ Real Balls</span>` : ""}

      function toggleDrillDoneToday(drillId) {
        const iso = todayISO(0);
        const today = ensureDayLog(iso);
        const i = today.completedDrills.indexOf(drillId);
        if (i >= 0) {
          today.completedDrills.splice(i, 1);
          if (today.completedDrills.length === 0 && !today.notes && (today.status === "partial" || today.status === "recovery")) {
            delete state.deliveryLogs[iso];
          }
          showToast("Removed drill from today's completed list");

          today.completedDrills.push(drillId);
          if (!today.status) {
            today.status = state.activeMode === "sore" ? "recovery" : "partial";

        for (const d of filtered) {

        const secHtml = Object.keys(bySection).map((sec) => `

      function renderDeliveryBarChartSvg(daysCount = 30) {
        const w = 780;
        const h = 225;
        const padL = 36;
        const padR = 14;
        const padT = 26;
        const padB = 34;
        const innerW = w - padL - padR;
        const innerH = h - padT - padB;
        const slotW = innerW / daysCount;
        const barW = Math.max(10, slotW - 6);

        const colors = {
          met: "#10b981",
          recovery: "#38bdf8",
          partial: "#f59e0b",
          missed: "#ef4444",
          "": "#1e293b"
        };
        const modeEmoji = { real: "🏌️", almost: "🌙", sore: "💪" };

        let gridLines = "";
        for (let q = 1; q <= 5; q++) {
          const y = padT + innerH - (q / 5) * innerH;
          gridLines += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w - padR}" y2="${y.toFixed(1)}" stroke="#1e293b" stroke-width="1"/>`;
          gridLines += `<text x="${padL - 8}" y="${(y + 4).toFixed(1)}" fill="#64748b" font-size="10" text-anchor="end">${q}</text>`;
        }

        let bars = "";
        const trendPts = [];
        for (let i = 0; i < daysCount; i++) {
          const iso = todayISO(-(daysCount - 1 - i));
          const log = state.deliveryLogs[iso];
          const status = (log && log.status) || "";
          const q = status === "missed" ? 1 : ((log && log.quality) || 0);
          const x = padL + i * slotW + (slotW - barW) / 2;
          const barH = status ? Math.max(14, (q / 5) * innerH) : 10;
          const y = padT + innerH - barH;
          const fill = colors[status] || "#1e293b";
          const isSel = state.selectedLogDate === iso;

          if (status && status !== "missed" && q > 0) {
            trendPts.push(`${(x + barW / 2).toFixed(1)},${y.toFixed(1)}`);
          }

          bars += `
            <g class="chart-day-bar" data-chart-date="${iso}" style="cursor:pointer;">
              <title>${iso}: ${esc(status || "Unlogged")} (${esc(log ? log.mode : "-")}${log && log.notes ? " - " + esc(log.notes) : ""})</title>
              <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}"
                    rx="4" fill="${fill}" opacity="${status === "missed" ? "0.65" : "0.92"}"
                    stroke="${isSel ? "#ffffff" : "rgba(255,255,255,0.08)"}" stroke-width="${isSel ? "2" : "1"}"/>
              ${status && status !== "missed" && log && modeEmoji[log.mode]
                ? `<text x="${(x + barW / 2).toFixed(1)}" y="${Math.max(13, y - 5).toFixed(1)}" font-size="10" text-anchor="middle">${modeEmoji[log.mode]}</text>`
                : ""}
              ${(i % 5 === 0 || i === daysCount - 1)
                ? `<text x="${(x + barW / 2).toFixed(1)}" y="${h - 10}" fill="${isSel ? "#38bdf8" : "#94a3b8"}" font-size="10" font-weight="${isSel ? "700" : "400"}" text-anchor="middle">${shortDateLabel(iso)}</text>`
                : ""}
            </g>`;
        }

        const trendLine = trendPts.length >= 2
          ? `<polyline fill="none" stroke="#e0f2fe" stroke-width="2" stroke-opacity="0.7" points="${trendPts.join(" ")}"/>`
          : "";

        return `
          <svg viewBox="0 0 ${w} ${h}" style="width:100%; min-width:580px; height:auto;">
            <text x="${padL}" y="14" fill="#94a3b8" font-size="11" font-weight="700">30-Day Daily Delivery Status &amp; Delivery Quality (1-5) &mdash; Click any bar to edit day</text>
            ${gridLines}
            ${bars}
            ${trendLine}
          </svg>
        `;
      }

        const cols = 13;
        const rows = 7;
        const total = cols * rows;
        let html = `<div class="heatmap-grid">`;
        for (let c = 0; c < cols; c++) {
          html += `<div class="hm-col">`;
          for (let r = 0; r < rows; r++) {
            const idx = c * rows + r;
            const offset = -(total - 1 - idx);
            const iso = todayISO(offset);

            html += `<div class="hm-cell ${esc(st)} ${sel}" data-chart-date="${iso}" title="${iso}: ${esc(st || "No log")}"></div>`;

          html += `</div>`;
        }
        html += `</div>`;
        return html;
      }

      function formatRelPar(score, par) {
        const s = Number(score);
        const p = Number(par);
        if (!Number.isFinite(s) || !Number.isFinite(p)) return "";
        const diff = s - p;
        if (diff === 0) return "E";
        return diff > 0 ? `+${diff}` : `${diff}`;
      }

      function scoreChipClass(diff) {
        if (diff <= 0) return "under";
        if (diff <= 5) return "low";
        if (diff <= 14) return "mid";
        return "high";
      }

      function getCourseRoundStats(courseId) {
        const list = (state.roundLogs || [])
          .filter((r) => r.courseId === courseId)
          .slice()
          .sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
        if (!list.length) {
          return { plays: 0, bestScore: null, bestDiff: null, bestRelStr: "", avgScore: null, lastDate: "", lastScore: null };
        }
        let best = list[0];
        let sum = 0;
        for (const r of list) {
          const diff = Number(r.score) - Number(r.par);
          const bestDiff = Number(best.score) - Number(best.par);
          if (diff < bestDiff || (diff === bestDiff && Number(r.score) < Number(best.score))) {
            best = r;
          }
          sum += Number(r.score) || 0;
        }
        const bestDiff = Number(best.score) - Number(best.par);
        return {
          plays: list.length,
          bestScore: Number(best.score),
          bestDiff,
          bestRelStr: formatRelPar(best.score, best.par),
          avgScore: (sum / list.length).toFixed(1),
          lastDate: list[0].date || "",
          lastScore: Number(list[0].score)
        };
      }

      function getDefaultParForSelection(course, teeKey, holes) {
        const h = Number(holes) || 18;
        if (!course) return h === 9 ? 36 : h === 6 ? 24 : h === 3 ? 12 : 72;
        if (teeKey === "par3") {
          if (course.par && course.par <= 60) {
            return h === course.holes ? course.par : Math.round((course.par / (course.holes || 18)) * h);
          }
          return h * 3;
        }
        const fullPar = Number(course.par) || 72;
        const fullHoles = Number(course.holes) || 18;
        if (h === fullHoles) return fullPar;
        return Math.round((fullPar / fullHoles) * h);
      }

      function normalizeCourseKey(text) {
        return String(text || "")
          .toLowerCase()
          .replace(/(_v\d+)?(_gsp)?$/i, "")
          .replace(/\b(golf\s+course|golf\s+club|course|gc)\s*$/i, "")
          .replace(/[^a-z0-9]+/g, "");
      }

      function findCourseByNameOrId(query) {
        const raw = String(query || "").trim();
        if (!raw) return null;
        const q = raw.toLowerCase();
        const normQ = normalizeCourseKey(raw);
        const candidates = (state.courses || []).slice().sort((a, b) =>
          (Number(Boolean(b.favorite)) - Number(Boolean(a.favorite))) ||
          ((Number(b.rating) || 0) - (Number(a.rating) || 0))
        );
        return (
          candidates.find((c) => c.id.toLowerCase() === q) ||
          candidates.find((c) => c.name.toLowerCase() === q) ||
          candidates.find((c) => normQ && normalizeCourseKey(c.name) === normQ) ||
          candidates.find((c) => normQ && normalizeCourseKey(c.id) === normQ) ||
          candidates.find((c) => c.name.toLowerCase().includes(q) || q.includes(c.name.toLowerCase()) || c.id.toLowerCase().includes(q)) ||
          null
        );
      }

      function isValidYmd(yNum, mNum, dNum) {
        if (!Number.isInteger(yNum) || !Number.isInteger(mNum) || !Number.isInteger(dNum)) return false;
        if (mNum < 1 || mNum > 12 || dNum < 1 || dNum > 31) return false;
        const dt = new Date(Date.UTC(yNum, mNum - 1, dNum));
        return dt.getUTCFullYear() === yNum && dt.getUTCMonth() === mNum - 1 && dt.getUTCDate() === dNum;
      }

      function parseHistoricalDate(raw) {
        const s = String(raw || "").trim();
        if (!s) return null;
        const isoMatch = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);
        if (isoMatch) {
          const yNum = Number(isoMatch[1]);
          const mNum = Number(isoMatch[2]);
          const dNum = Number(isoMatch[3]);
          if (isValidYmd(yNum, mNum, dNum)) {
            return `${String(yNum).padStart(4, "0")}-${String(mNum).padStart(2, "0")}-${String(dNum).padStart(2, "0")}`;
          }
          return null;
        }
        const usMatch = s.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{4})$/);
        if (usMatch) {
          const mNum = Number(usMatch[1]);
          const dNum = Number(usMatch[2]);
          const yNum = Number(usMatch[3]);
          if (isValidYmd(yNum, mNum, dNum)) {
            return `${String(yNum).padStart(4, "0")}-${String(mNum).padStart(2, "0")}-${String(dNum).padStart(2, "0")}`;
          }
          return null;
        }
        if (/\d{4}/.test(s)) {
          const dt = new Date(s);
          if (!Number.isNaN(dt.getTime())) {
            const useUtc = /(Z|[+-]\d{2}:?\d{2}|GMT|UTC)$/i.test(s);
            const yNum = useUtc ? dt.getUTCFullYear() : dt.getFullYear();
            const mNum = (useUtc ? dt.getUTCMonth() : dt.getMonth()) + 1;
            const dNum = useUtc ? dt.getUTCDate() : dt.getDate();
            if (yNum >= 1990 && isValidYmd(yNum, mNum, dNum)) {
              return `${String(yNum).padStart(4, "0")}-${String(mNum).padStart(2, "0")}-${String(dNum).padStart(2, "0")}`;
            }
          }
        }
        return null;
      }

      function parseCsvLine(line) {
        const out = [];
        let cur = "";
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === "\"") {
            if (inQuotes && line[i + 1] === "\"") {
              cur += "\"";
              i++;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (ch === "," && !inQuotes) {
            out.push(cur.trim());
            cur = "";
          } else {
            cur += ch;
          }
        }
        out.push(cur.trim());
        return out;
      }

      function renderRoundsChartSvg(rounds) {
        const list = (rounds || [])
          .slice()
          .sort((a, b) => String(a.date || "").localeCompare(String(b.date || "")))
          .slice(-24);
        if (!list.length) {
          return `<div style="padding:18px; text-align:center; color:var(--muted); font-size:0.86rem;">Log or import rounds below to plot your Score vs. Par trend over time.</div>`;
        }
        const W = 760;
        const H = 228;
        const padL = 44;
        const padR = 20;
        const padT = 30;
        const padB = 34;
        const innerW = W - padL - padR;
        const innerH = H - padT - padB;

        const diffs = list.map((r) => Number(r.score) - Number(r.par));
        const minD = Math.min(-2, ...diffs);
        const maxD = Math.max(8, ...diffs);
        const span = Math.max(1, maxD - minD);
        const yForDiff = (d) => padT + ((maxD - d) / span) * innerH;
        const xForIdx = (i) => (list.length === 1 ? padL + innerW / 2 : padL + (i / (list.length - 1)) * innerW);

        const gridVals = [minD, 0, Math.round(maxD / 2), maxD].filter((v, idx, arr) => arr.indexOf(v) === idx);
        const gridSvg = gridVals.map((v) => {
          const y = yForDiff(v).toFixed(1);
          const isZero = v === 0;
          const lbl = v === 0 ? "E" : (v > 0 ? `+${v}` : `${v}`);
          return `
            <line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"
                  stroke="${isZero ? "#10b981" : "#243248"}"
                  stroke-width="${isZero ? 1.5 : 1}"
                  stroke-dasharray="${isZero ? "4 3" : ""}" />
            <text x="${padL - 8}" y="${Number(y) + 3}" text-anchor="end" fill="${isZero ? "#6ee7b7" : "#94a3b8"}" font-size="10">${lbl}</text>
          `;
        }).join("");

        const pts = list.map((r, i) => `${xForIdx(i).toFixed(1)},${yForDiff(Number(r.score) - Number(r.par)).toFixed(1)}`).join(" ");
        const dotsSvg = list.map((r, i) => {
          const d = Number(r.score) - Number(r.par);
          const x = xForIdx(i).toFixed(1);
          const y = yForDiff(d).toFixed(1);
          const col = d <= 0 ? "#10b981" : d <= 5 ? "#38bdf8" : d <= 14 ? "#f59e0b" : "#ef4444";
          const rel = formatRelPar(r.score, r.par);
          const shortDate = String(r.date || "").slice(5);
          const showLabel = list.length <= 12 || i === 0 || i === list.length - 1 || i % Math.ceil(list.length / 8) === 0;
          return `
            <g>
              <circle cx="${x}" cy="${y}" r="5.5" fill="${col}" stroke="#0b1120" stroke-width="2">
                <title>${esc(r.date)} &mdash; ${esc(r.courseName)}: ${esc(r.score)} (${esc(rel)})</title>
              </circle>
              ${list.length <= 16 ? `<text x="${x}" y="${Number(y) - 9}" text-anchor="middle" fill="#e2e8f0" font-size="9.5" font-weight="700">${esc(rel)}</text>` : ""}
              ${showLabel ? `<text x="${x}" y="${H - 10}" text-anchor="middle" fill="#94a3b8" font-size="9.5">${esc(shortDate)}</text>` : ""}
            </g>
          `;
        }).join("");

        return `
          <svg viewBox="0 0 ${W} ${H}" width="100%" aria-label="Historical Score vs Par Trend">
            <text x="${padL}" y="13" fill="#bae6fd" font-size="11.5" font-weight="700">Score vs. Par Trend (Last ${list.length} Round${list.length === 1 ? "" : "s"})</text>
            ${gridSvg}
            ${list.length > 1 ? `<polyline fill="none" stroke="#38bdf8" stroke-width="2.2" points="${pts}" />` : ""}
            ${dotsSvg}
          </svg>
        `;
      }

      function getCourseShortYardage(c) {
        const vals = Object.values(c.tees || {}).filter((v) => Number(v) > 0);
        return vals.length ? Math.min(...vals) : 99999;
      }

      function getFilteredCourses() {
        const q = (state.courseSearch || "").trim().toLowerCase();
        const cat = state.courseCategoryFilter || "all";
        const focus = state.courseFocusFilter || "all";

        const filtered = (state.courses || []).filter((c) => {
          if (cat === "favorites" && !c.favorite) return false;
          else if (cat === "has-par3-tee" && !(c.tees && Number(c.tees.par3) > 0)) return false;
          else if (cat !== "all" && cat !== "favorites" && cat !== "has-par3-tee") {
            if (!Array.isArray(c.categories) || !c.categories.includes(cat)) return false;
          }
          if (focus !== "all" && c.drillFocus !== focus) return false;
          if (q) {
            const hay = [
              c.name, c.id, c.location, c.designer,
              c.drillFocus, formatBestFor(c.bestFor), c.drillNote, c.userNotes || ""
            ].join(" ").toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });

        const sortBy = state.courseSort || "favorites";
        filtered.sort((a, b) => {
          if (sortBy === "most-played") {
            const pa = getCourseRoundStats(a.id).plays;
            const pb = getCourseRoundStats(b.id).plays;
            return (pb - pa) || (Number(Boolean(b.favorite)) - Number(Boolean(a.favorite))) || a.name.localeCompare(b.name);
          }
          if (sortBy === "best-score") {
            const sa = getCourseRoundStats(a.id).bestDiff;
            const sb = getCourseRoundStats(b.id).bestDiff;
            const va = sa === null ? 9999 : sa;
            const vb = sb === null ? 9999 : sb;
            return (va - vb) || a.name.localeCompare(b.name);
          }
          if (sortBy === "shortest") {
            return (getCourseShortYardage(a) - getCourseShortYardage(b)) || a.name.localeCompare(b.name);
          }
          if (sortBy === "altitude") {
            return ((Number(b.altitudeFt) || 0) - (Number(a.altitudeFt) || 0)) || a.name.localeCompare(b.name);
          }
          if (sortBy === "name") {
            return a.name.localeCompare(b.name);
          }
          // Default: "favorites" — favorites & higher drill ratings first
          return (
            (Number(Boolean(b.favorite)) - Number(Boolean(a.favorite))) ||
            ((Number(b.rating) || 0) - (Number(a.rating) || 0)) ||
            a.name.localeCompare(b.name)
          );
        });
        return filtered;
      }

            const cId = matched ? matched.id : cName.toLowerCase().replace(/[^a-z0-9]+/g, "_");
            state.roundLogs.push({
              id: `rnd_${Date.now()}_${Math.random().toString(36).slice(2, 7)}_${added}`,
              date: iso,
              courseId: cId,
              courseName: cName,
              tee: tee.toLowerCase() === "par 3" ? "par3" : tee.toLowerCase(),
              holes,
              score,
              par,
              fir: item.fir || "",

              putts: item.putts || "",
              birdies: item.birdies || "",
              mode: item.mode || "real",
              notes: item.notes || ""

            added++;

        function parseAndImportText(rawText) {
          const trimmed = String(rawText || "").trim();
          if (!trimmed) {
            showToast("Paste CSV lines or choose a file first.");
            return;
          }
          if (trimmed.startsWith("[") || trimmed.startsWith("{")) {
            try {
              const parsed = JSON.parse(trimmed);
              const arr = Array.isArray(parsed) ? parsed : (Array.isArray(parsed.roundLogs) ? parsed.roundLogs : []);
              if (arr.length) {
                importRoundObjects(arr);
                return;
              }
            } catch {
              // Fall through to CSV parser
            }
          }
          const lines = trimmed.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
          const objs = [];
          let hasFull12ColHeader = false;
          lines.forEach((line, idx) => {
            const cols = parseCsvLine(line);
            if (!cols.length) return;
            if (idx === 0 && /^date$/i.test(cols[0])) {
              hasFull12ColHeader = cols.length >= 11 && /^fir$/i.test(cols[6] || "");
              return; // Skip CSV header row
            }
            const looksLike12Col = hasFull12ColHeader || (
              cols.length >= 12 &&
              ["real", "almost", "sore", ""].includes(String(cols[10] || "").trim().toLowerCase())
            );
            if (looksLike12Col) {
              objs.push({
                date: cols[0],
                courseName: cols[1] || "",
                score: cols[2],
                par: cols[3],
                tee: cols[4] || "",
                holes: cols[5] || "",
                fir: cols[6] || "",
                gir: cols[7] || "",
                putts: cols[8] || "",
                birdies: cols[9] || "",
                mode: cols[10] || "real",
                notes: cols.slice(11).join(", ")
              });
            } else {
              objs.push({
                date: cols[0],
                courseName: cols[1] || "",
                score: cols[2],
                par: cols[3],
                tee: cols[4] || "",
                holes: cols[5] || "",
                notes: cols.slice(6).join(", ")
              });
            }
          });
          importRoundObjects(objs);
        }

        const btnRunBulkImport = document.getElementById("btnRunBulkImport");
        if (btnRunBulkImport) {
          btnRunBulkImport.onclick = () => parseAndImportText(document.getElementById("bulkImportText").value);
        }

        const bulkImportFile = document.getElementById("bulkImportFile");
        if (bulkImportFile) {
          bulkImportFile.onchange = (ev) => {
            const file = ev.target.files && ev.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => parseAndImportText(reader.result);
            reader.readAsText(file);
          };
        }

        document.getElementById("btnExportRoundsCsv").onclick = () => {
          const rows = [["Date", "Course", "Score", "Par", "Tee", "Holes", "FIR", "GIR", "Putts", "Birdies", "Mode", "Notes"]];
          const csvCell = (v) => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
          for (const r of state.roundLogs) {
            rows.push([
              r.date, r.courseName, r.score, r.par, r.tee, r.holes,
              r.fir || "", r.gir || "", r.putts || "", r.birdies || "", r.mode || "real", r.notes || ""
            ].map(csvCell));
          }
          const blob = new Blob([rows.map((r) => r.join(",")).join("\n")], { type: "text/csv" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = `simwatch_rounds_${todayISO(0)}.csv`;
          a.click();
          showToast("Exported historical rounds CSV!");
        };

        const roundFilterSel = document.getElementById("roundFilterCourseSelect");
        if (roundFilterSel) {
          roundFilterSel.onchange = () => {
            state.roundFilterCourse = roundFilterSel.value;
            redrawCourses(true);
          };
        }

        el.querySelectorAll("[data-del-round]").forEach((btn) => {
          btn.onclick = () => {
            const rid = btn.getAttribute("data-del-round");
            state.roundLogs = state.roundLogs.filter((r) => r.id !== rid);

          };
        });
